ld text-white tabular-nums\">{formatCurrency(a.totalAmount,a.currency)} • {a.status}<\/h4><p className=\"text-[11px] text-[#8E8E9E] mt-0.5\">Solicitud {a.requestId||'administrativa'} • {a.date}<\/p><\/div><p className=\"text-[11px] text-[#8E8E9E] tabular-nums\">Enviado: {formatCurrency(a.sentAmount||0,a.currency)} • Recibido: {formatCurrency(a.receivedAmount||0,a.currency)}<\/p><\/div>{a.requestId&&<div className=\"grid grid-cols-2 sm:grid-cols-4 gap-2\">{stageLabels.map((label,i)=>{const h=(a.history||[]).find(x=>x.stage===label);return <div key={label} className={`p-2.5 rounded-xl text-center border transition-colors ${i<=idx?'bg-[#7138F5]/20 border-[#7138F5]/45 text-[#D7C8FF]':'bg-[#0A0A0D]/80 border-white/[0.06] text-zinc-500'}`}><p className=\"text-[9px] font-bold\">{label}<\/p><p className=\"text-[9px] mt-1\">{h?.date||'Pendiente'}<\/p><\/div>})}<\/div>}{a.disbursementStage==='sent'&&!a.artistReportedReceived&&<button onClick={()=>onReportAdvanceReceived(a.id)} className=\"px-3.5 py-2 rounded-xl bg-[#0A0A0D] hover:bg-[#7138F5]/15 border border-[#7138F5] text-xs font-bold text-[#B69AFF] transition-colors\">Informar que recibí el dinero<\/button>}{a.artistReportedReceived&&a.disbursementStage!=='received'&&<p className=\"text-xs text-amber-200\">Informaste que recibiste el dinero; la confirmación administrativa está pendiente.<\/p>}<div className=\"grid sm:grid-cols-3 gap-2 text-xs text-zinc-300 tabular-nums\"><p>Importe aprobado: {formatCurrency(a.totalAmount,a.currency)}<\/p><p>Recuperado: {formatCurrency(recovered,a.currency)}<\/p><p>Pendiente de recuperar: {formatCurrency(remaining,a.currency)}<\/p><\/div>{(a.discounts||[]).map(d=><p key={d.id} className=\"text-[11px] text-zinc-400\">Descuento {d.date}: {formatCurrency(d.amount,a.currency)} — {d.note}<\/p>)}<\/div>})}<\/div>}\n  <\/div>;\n}\n\nfunction NotificationsView({ notifications, users, isAdmin, viewer, onMarkRead, onMarkAllRead, onNavigate }) {\n  return (\n    <div className=\"space-y-6 animate-fade-in\">\n      {isAdmin && <NotificationAdminTabs active=\"admin-notificaciones\" onNavigate={onNavigate} />}\n      <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-1\">\n        <div>\n          <h1 className=\"text-2xl sm:text-[26px] font-extrabold tracking-tight text-white\">Centro de Notificaciones<\/h1>\n          <p className=\"text-xs sm:text-[13px] text-[#8E8E9E] mt-1\">Avisos sobre cambios de estado en lanzamientos, métricas publicadas y permisos.<\/p>\n        <\/div>\n        {notifications.length > 0 && (\n          <button onClick={onMarkAllRead} className=\"px-3.5 py-2 rounded-xl bg-[#1E1E24] hover:bg-[#25252D] border border-white/[0.08] hover:border-[#7138F5]/40 text-xs font-semibold text-[#B69AFF] self-start transition-all duration-150\">\n            Marcar todas como leídas\n          <\/button>\n        )}\n      <\/div>\n\n      {notifications.length === 0 ? (\n        <div className=\"p-10 rounded-2xl bg-[#1E1E24]/90 border border-white/[0.07] text-center text-xs text-[#8E8E9E]\">\n          No tienes notificaciones registradas.\n        <\/div>\n      ) : (\n        <div className=\"space-y-3\">\n          {notifications.map(n => {\n            const targetUser = users.find(u => u.id === n.artistId);\n            const isRead = isNotificationReadBy(n, viewer);\n            const ownedByViewer = notificationOwnedBy(n, viewer);\n            return (\n              <div key={n.id} className={`p-4 sm:p-5 rounded-2xl border transition-all duration-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${isRead ? 'bg-[#1E1E24]/60 border-white/[0.06]' : 'bg-[#1E1E24] border-[#7138F5]/60 shadow-[0_8px_24px_rgba(113,56,245,0.12)]'}`}>\n                <div>\n                  <div className=\"flex flex-wrap items-center gap-2\">\n                    {!isRead && <span className=\"w-2 h-2 rounded-full bg-[#7138F5] shadow-[0_0_8px_#7138F5]\" />}\n                    <span className=\"text-xs font-bold text-white\">{n.title}<\/span>\n                    {isAdmin && targetUser && <span className=\"text-[10px] text-[#B69AFF] font-semibold\">({targetUser.artisticName})<\/span>}\n                    {isAdmin && <span className={`px-1.5 py-0.5 rounded-full border text-[9px] font-bold ${n.isManual ? 'bg-[#7138F5]/15 border-[#7138F5]/30 text-[#D6C8FF]' : 'bg-zinc-500/10 border-zinc-500/25 text-zinc-400'}`}>{n.isManual ? 'Anuncio manual' : 'Automática'}<\/span>}\n                    <span className=\"text-[10px] text-zinc-500 font-mono\">{n.date}<\/span>\n                  <\/div>\n                  <p className=\"text-xs text-[#8E8E9E] mt-1 leading-relaxed\">{n.message}<\/p>\n                  {isAdmin && !ownedByViewer && <p className=\"text-[10px] text-zinc-500 mt-1\">Estado del destinatario: {n.read ? 'leída' : 'sin leer'} · tu marca de lectura no lo modifica.<\/p>}\n                <\/div>\n                <div className=\"flex items-center gap-2 shrink-0\">\n                  {!isAdmin && notificationOpenTab(n, viewer) && (\n                    <button onClick={() => { const tab = notificationOpenTab(n, viewer); onMarkRead(n.id); if (tab) onNavigate(tab); }} className=\"px-3.5 py-1.5 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] text-white text-xs font-bold shadow-md shadow-[#7138F5]/20 transition-all duration-150\">\n                      Abrir sección\n                    <\/button>\n                  )}\n                  {!isRead && (\n                    <button onClick={() => onMarkRead(n.id)} className=\"px-3 py-1.5 rounded-xl bg-[#0A0A0D] border border-white/[0.08] hover:border-white/[0.16] text-zinc-300 text-xs transition-colors\">\n                      Leída\n                    <\/button>\n                  )}\n                <\/div>\n              <\/div>\n            );\n          })}\n        <\/div>\n      )}\n    <\/div>\n  );\n}\n\nfunction ArtistProfileView({ artist, releasesCount, onUpdateProfile }) {\n  const [artisticName, setArtisticName] = useState(artist.artisticName || '');\n  const [name, setName] = useState(artist.name || '');\n  const [genre, setGenre] = useState(artist.genre || '');\n  const [country, setCountry] = useState(artist.country || '');\n\n  return (\n    <div className=\"max-w-2xl space-y-6 animate-fade-in\">\n      <div className=\"pb-1\">\n        <h1 className=\"text-2xl sm:text-[26px] font-extrabold tracking-tight text-white\">Mi Perfil de Artista<\/h1>\n        <p className=\"text-xs sm:text-[13px] text-[#8E8E9E] mt-1\">Tus datos profesionales aparecen precargados al enviar nuevos lanzamientos.<\/p>\n      <\/div>\n      <div className=\"p-6 sm:p-7 rounded-2xl bg-[#1E1E24]/90 border border-white/[0.07] shadow-[0_8px_30px_rgba(0,0,0,0.28)] space-y-5\">\n        <div className=\"flex items-center gap-4 border-b border-white/[0.07] pb-5\">\n          <div className=\"w-14 h-14 rounded-2xl bg-gradient-to-br from-[#7138F5] to-[#5221C9] flex items-center justify-center font-black text-lg text-white shadow-lg shadow-[#7138F5]/25 ring-1 ring-white/15\">{artist.avatar}<\/div>\n          <div>\n            <h2 className=\"text-lg font-bold text-white tracking-tight\">{artist.artisticName}<\/h2>\n            <p className=\"text-xs text-[#8E8E9E] mt-0.5\">{artist.email} • {releasesCount} lanzamiento(s) en catálogo<\/p>\n          <\/div>\n        <\/div>\n        <form\n          onSubmit={e => {\n            e.preventDefault();\n            onUpdateProfile({ artisticName, name, genre, country });\n          }}\n          className=\"space-y-4\"\n        >\n          <div>\n            <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">Nombre artístico<\/label>\n            <input type=\"text\" value={artisticName} onChange={e => setArtisticName(e.target.value)} className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\" />\n          <\/div>\n          <div>\n            <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">Nombre legal / Créditos de compositor<\/label>\n            <input type=\"text\" value={name} onChange={e => setName(e.target.value)} className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\" />\n          <\/div>\n          <div className=\"grid grid-cols-1 sm:grid-cols-2 gap-3.5\">\n            <div>\n              <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">Género<\/label>\n              <input type=\"text\" value={genre} onChange={e => setGenre(e.target.value)} className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\" />\n            <\/div>\n            <div>\n              <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">País / Ciudad<\/label>\n              <input type=\"text\" value={country} onChange={e => setCountry(e.target.value)} className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\" />\n            <\/div>\n          <\/div>\n          <button type=\"submit\" className=\"px-5 py-2.5 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] active:scale-[0.99] text-white text-xs font-bold shadow-lg shadow-[#7138F5]/25 transition-all duration-150\">\n            Guardar cambios de perfil\n          <\/button>\n        <\/form>\n      <\/div>\n    <\/div>\n  );\n}\n\n\n// ===== Centro de soporte (feedback, preguntas frecuentes y conversaciones) =====\n// The view only calls the handlers it receives, so a real support service can replace them later.\nconst SUPPORT_FAQ = [\n  { id: 'faq-release', q: '¿Cómo envío un lanzamiento?', a: ['Abre «Enviar lanzamiento» en el menú lateral y pulsa «Enviar nuevo lanzamiento».', 'Completa los tres pasos: información general y versiones, pistas y créditos con el archivo WAV de cada versión, y revisión final.', 'Puedes guardar un borrador en el paso 2. Al confirmar el envío, el lanzamiento queda «En revisión» y aparece en «Mis lanzamientos».'] },\n  { id: 'faq-status', q: '¿Qué significa cada estado de un lanzamiento?', statuses: true },\n  { id: 'faq-promo', q: '¿Cómo solicito una promoción?', a: ['En «Promoción en TikTok», pulsa «Solicitar promoción» y elige uno de tus lanzamientos y la pista o versión.', 'El equipo de marketing revisa la solicitud y puede aceptarla o rechazarla; la aprobación no está garantizada.', 'Sigue su estado en «Mis solicitudes de Promo».'] },\n  { id: 'faq-cancel', q: '¿Cómo cancelo una solicitud pendiente?', a: ['En «Mis solicitudes de Promo», busca la solicitud en estado «Pendiente» y pulsa «Cancelar solicitud».', 'Confirma en la ventana de aviso. Solo se pueden cancelar solicitudes pendientes y la solicitud cancelada se conserva en tu historial.'] },\n  { id: 'faq-removal', q: '¿Cómo solicito la retirada de un vídeo?', a: ['Cuando una promoción figura como «Subida / publicada», aparece el botón «Solicitar retirada del vídeo» en «Mis solicitudes de Promo».', 'Puedes indicar un motivo. El vídeo sigue publicado mientras Bonaizznt (Marketing Staff) revisa la solicitud.', 'Si se aprueba, el vídeo deja de mostrarse como promoción activa en el portal. El portal no está conectado a TikTok, por lo que la retirada en TikTok la realiza el equipo manualmente.'] },\n  { id: 'faq-notifications', q: '¿Cómo consulto mis notificaciones?', a: ['Las cuentas de artista tienen «Notificaciones» en el menú lateral. El número junto al nombre indica cuántas siguen sin leer.', 'Ahí aparecen los avisos sobre lanzamientos, promociones, anuncios de Bersz Records y respuestas de soporte. Puedes marcarlas como leídas una a una o todas a la vez.'] },\n  { id: 'faq-contact', q: '¿Cómo contacto con Bersz Records?', a: ['En «Soporte», abre «Hablar con el equipo» y crea una conversación con un asunto y tu mensaje.', 'En esta demo los mensajes se guardan en este navegador y el equipo responde desde el panel de Bersz Admin. No es un chat en tiempo real.'] }\n];\n\nfunction SupportStatusPill({ status }) {\n  const styles = {\n    'Recibido': 'bg-[#7138F5]/15 border-[#7138F5]/40 text-[#D9CCFF]',\n    'En revisión': 'bg-amber-500/15 border-amber-400/35 text-amber-200',\n    'Respondido': 'bg-emerald-500/15 border-emerald-400/35 text-emerald-200',\n    'Cerrado': 'bg-zinc-500/15 border-zinc-400/35 text-zinc-300',\n    'Abierta': 'bg-emerald-500/15 border-emerald-400/35 text-emerald-200',\n    'Cerrada': 'bg-zinc-500/15 border-zinc-400/35 text-zinc-300'\n  };\n  return <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full border text-[10px] font-bold whitespace-nowrap ${styles[status] || styles['Recibido']}`}><span className=\"w-1.5 h-1.5 rounded-full bg-current opacity-90\" aria-hidden=\"true\" />{status}<\/span>;\n}\n\nfunction SupportCenterView({ currentUser, isStaff, users = [], feedback = [], conversations = [], onSubmitFeedback = () => false, onUpdateFeedback = () => false, onStartConversation = () => null, onSendMessage = () => false, onSetConversationStatus = () => false, onMarkRead = () => {} }) {\n  const [tab, setTab] = useState(isStaff ? 'chat' : 'feedback');\n  const [form, setForm] = useState({ subject: '', category: '', message: '' });\n  const [feedbackDrafts, setFeedbackDrafts] = useState({});\n  const [feedbackFilter, setFeedbackFilter] = useState('all');\n  const [openFaq, setOpenFaq] = useState({});\n  const [selectedId, setSelectedId] = useState(null);\n  const [composingNew, setComposingNew] = useState(false);\n  const [newConversation, setNewConversation] = useState({ subject: '', message: '' });\n  const [reply, setReply] = useState('');\n  const [chatFilter, setChatFilter] = useState('all');\n  const threadRef = useRef(null);\n  const fmt = value => value ? new Date(value).toLocaleString('es-ES') : 'fecha no registrada';\n  const sortedConversations = [...conversations].sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));\n  const visibleConversations = sortedConversations.filter(item => chatFilter === 'all' || (chatFilter === 'awaiting' ? supportAwaitingTeam(item) : item.status === 'Cerrada'));\n  const selected = conversations.find(item => item.id === selectedId) || null;\n  const sortedFeedback = [...feedback].sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt))).filter(item => feedbackFilter === 'all' || item.status === feedbackFilter);\n  useEffect(() => { if (selected) onMarkRead(selected.id); }, [selected?.id, selected?.messages?.length]);\n  useEffect(() => { if (threadRef.current) threadRef.current.scrollTop = threadRef.current.scrollHeight; }, [selected?.id, selected?.messages?.length]);\n  useEffect(() => { setReply(''); }, [selectedId]);\n  const unreadCount = conversations.filter(item => supportUnreadFor(item, isStaff)).length;\n  const tabs = [\n    ['feedback', isStaff ? 'Feedback recibido' : 'Feedback', isStaff ? feedback.filter(item => item.status === 'Recibido').length : null, MessageSquare],\n    ['faq', 'Preguntas frecuentes', null, Info],\n    ['chat', isStaff ? 'Bandeja de soporte' : 'Hablar con el equipo', unreadCount || null, LifeBuoy]\n  ];\n  const submitFeedback = event => { event.preventDefault(); if (onSubmitFeedback(form)) setForm({ subject: '', category: '', message: '' }); };\n  const submitNewConversation = event => { event.preventDefault(); const id = onStartConversation(newConversation); if (id) { setNewConversation({ subject: '', message: '' }); setComposingNew(false); setSelectedId(id); } };\n  const submitReply = event => { event.preventDefault(); if (selected && onSendMessage(selected.id, reply)) setReply(''); };\n  const userFor = id => users.find(user => user.id === id);\n  const draftFor = item => feedbackDrafts[item.id] || { status: item.status, response: item.response || '' };\n  const setDraft = (item, fields) => setFeedbackDrafts(prev => ({ ...prev, [item.id]: { ...draftFor(item), ...fields } }));\n  const inputCls = 'bz28-input mt-1.5 block w-full px-3.5 py-2.5 rounded-xl text-xs text-white';\n\n  return <div className=\"bz28 max-w-6xl mx-auto space-y-6 animate-fade-in\">\n    <header className=\"flex flex-col gap-4\">\n      <div><p className=\"text-[10px] font-bold uppercase tracking-[.18em] text-[#B69AFF]\">Soporte<\/p><h1 className=\"text-2xl sm:text-[26px] font-extrabold text-white\">{isStaff ? 'Centro de soporte · Gestión' : 'Centro de soporte'}<\/h1><p className=\"text-xs text-[#8E8E9E] mt-1\">{isStaff ? 'Gestiona el feedback recibido y responde las conversaciones de artistas y Marketing Staff.' : 'Envía comentarios, consulta las preguntas frecuentes o escribe al equipo de Bersz Records.'}<\/p><\/div>\n      <nav className=\"bz28-tabs self-start md:self-auto\" role=\"tablist\" aria-label=\"Áreas de soporte\">{tabs.map(([key, label, count, Icon]) => <button key={key} type=\"button\" role=\"tab\" aria-selected={tab === key} onClick={() => setTab(key)} className={`bz28-tab ${tab === key ? 'is-active' : ''}`}><Icon className=\"w-3.5 h-3.5\" aria-hidden=\"true\" />{label}{count ? <span className=\"bz28-tab-count\">{count}<\/span> : null}<\/button>)}<\/nav>\n    <\/header>\n\n    {tab === 'feedback' && !isStaff && <div key=\"fb\" className=\"bz28-in grid lg:grid-cols-[minmax(0,5fr)_minmax(0,7fr)] gap-5 items-start\">\n      <form onSubmit={submitFeedback} className=\"bz28-card p-5 sm:p-6 rounded-2xl space-y-4\" aria-labelledby=\"fb-form-title\">\n        <div><h2 id=\"fb-form-title\" className=\"text-sm font-extrabold text-white\">Enviar feedback<\/h2><p className=\"text-[11px] text-[#8E8E9E] mt-1\">Se enviará como {currentUser.artisticName} ({supportRoleLabel(currentUser.role)}).<\/p><\/div>\n        <label className=\"block text-[11px] font-semibold text-zinc-300\">Asunto<input required maxLength={140} value={form.subject} onChange={e => setForm(prev => ({ ...prev, subject: e.target.value }))} placeholder=\"Resume tu comentario\" className={inputCls} /><\/label>\n        <label className=\"block text-[11px] font-semibold text-zinc-300\">Categoría<select required value={form.category} onChange={e => setForm(prev => ({ ...prev, category: e.target.value }))} className={`${inputCls} bz28-select`}><option value=\"\">Selecciona una categoría<\/option>{SUPPORT_FEEDBACK_CATEGORIES.map(category => <option key={category} value={category}>{category}<\/option>)}<\/select><\/label>\n        <label className=\"block text-[11px] font-semibold text-zinc-300\">Mensaje<textarea required rows={5} maxLength={2000} value={form.message} onChange={e => setForm(prev => ({ ...prev, message: e.target.value }))} placeholder=\"Cuéntanos tu experiencia con el portal o con Bersz Records\" className={`${inputCls} resize-y`} /><\/label>\n        <button type=\"submit\" disabled={!form.subject.trim() || !form.category || !form.message.trim()} className=\"bz28-btn bz28-btn-primary w-full\"><Send className=\"w-4 h-4\" aria-hidden=\"true\" />Enviar feedback<\/button>\n      <\/form>\n      <section className=\"space-y-3\" aria-labelledby=\"fb-list-title\">\n        <h2 id=\"fb-list-title\" className=\"text-sm font-extrabold text-white\">Mis comentarios <span className=\"text-[#8E8E9E] font-semibold\">({feedback.length})<\/span><\/h2>\n        {sortedFeedback.length === 0 ? <p className=\"bz28-empty\">Todavía no has enviado comentarios.<\/p> : sortedFeedback.map(item => <article key={item.id} className=\"bz28-card p-4 rounded-2xl space-y-2\">\n          <div className=\"flex flex-wrap items-start justify-between gap-2\"><div className=\"min-w-0\"><h3 className=\"text-[13px] font-bold text-white\">{item.subject}<\/h3><p className=\"text-[10px] text-[#8E8E9E] mt-0.5\">{item.category} · {fmt(item.createdAt)}<\/p><\/div><SupportStatusPill status={item.status} /><\/div>\n          <p className=\"text-xs text-zinc-300 whitespace-pre-wrap\">{item.message}<\/p>\n          {item.response && <p className=\"p-3 rounded-xl bg-emerald-500/10 border border-emerald-400/20 text-xs text-emerald-100 whitespace-pre-wrap\"><span className=\"block text-[10px] font-bold uppercase tracking-wider text-emerald-200/80 mb-1\">Respuesta de Bersz Records<\/span>{item.response}<\/p>}\n        <\/article>)}\n      <\/section>\n    <\/div>}\n\n    {tab === 'feedback' && isStaff && <section key=\"fb-staff\" className=\"bz28-in space-y-3\" aria-label=\"Feedback recibido\">\n      <div className=\"flex flex-wrap items-center justify-between gap-3\"><p className=\"text-xs text-[#8E8E9E]\">{feedback.length} comentario(s) recibidos de artistas y Marketing Staff.<\/p><select value={feedbackFilter} onChange={e => setFeedbackFilter(e.target.value)} aria-label=\"Filtrar feedback por estado\" className=\"bz28-input bz28-select px-3.5 py-2 rounded-xl text-xs text-white\"><option value=\"all\">Todos los estados<\/option>{SUPPORT_FEEDBACK_STATUSES.map(status => <option key={status} value={status}>{status}<\/option>)}<\/select><\/div>\n      {sortedFeedback.length === 0 ? <p className=\"bz28-empty\">No hay comentarios para este filtro.<\/p> : <div className=\"grid gap-3 lg:grid-cols-2\">{sortedFeedback.map(item => { const draft = draftFor(item); const author = userFor(item.userId); return <article key={item.id} className=\"bz28-card p-4 sm:p-5 rounded-2xl space-y-3\">\n        <div className=\"flex flex-wrap items-start justify-between gap-2\"><div className=\"min-w-0\"><h3 className=\"text-[13px] font-bold text-white\">{item.subject}<\/h3><p className=\"text-[10px] text-[#8E8E9E] mt-0.5\">{author?.artisticName || item.userName} · {supportRoleLabel(item.role)} · {item.category} · {fmt(item.createdAt)}<\/p><\/div><SupportStatusPill status={item.status} /><\/div>\n        <p className=\"text-xs text-zinc-200 whitespace-pre-wrap\">{item.message}<\/p>\n        <form onSubmit={event => { event.preventDefault(); if (onUpdateFeedback(item.id, draft.status, draft.response)) setFeedbackDrafts(prev => { const next = { ...prev }; delete next[item.id]; return next; }); }} className=\"space-y-2 pt-3 border-t border-white/[.06]\">\n          <div className=\"grid sm:grid-cols-[180px_1fr] gap-2\"><label className=\"block text-[10px] font-semibold text-zinc-400\">Estado<select value={draft.status} onChange={e => setDraft(item, { status: e.target.value })} className={`${inputCls} bz28-select`}>{SUPPORT_FEEDBACK_STATUSES.map(status => <option key={status} value={status}>{status}<\/option>)}<\/select><\/label><label className=\"block text-[10px] font-semibold text-zinc-400\">Respuesta para el usuario (opcional)<textarea rows={2} maxLength={2000} value={draft.response} onChange={e => setDraft(item, { response: e.target.value })} className={`${inputCls} resize-y`} /><\/label><\/div>\n          <div className=\"flex justify-end\"><button type=\"submit\" className=\"bz28-btn bz28-btn-primary\">Guardar y notificar<\/button><\/div>\n        <\/form>\n        <details className=\"text-[10px] text-zinc-400\"><summary className=\"cursor-pointer text-[#B69AFF] font-semibold\">Historial ({(item.history || []).length})<\/summary>{(item.history || []).map((entry, index) => <p key={index} className=\"mt-1\">{fmt(entry.date)} · {entry.actor} · {entry.status}{entry.note ? ` · ${entry.note}` : ''}<\/p>)}<\/details>\n      <\/article>; })}<\/div>}\n    <\/section>}\n\n    {tab === 'faq' && <section key=\"faq\" className=\"bz28-in space-y-3\" aria-label=\"Preguntas frecuentes\">\n      {SUPPORT_FAQ.map(item => <BzAccordion key={item.id} id={item.id} level={2} title={item.q} open={Boolean(openFaq[item.id])} onToggle={() => setOpenFaq(prev => ({ ...prev, [item.id]: !prev[item.id] }))}>\n        {item.statuses ? <dl className=\"grid sm:grid-cols-2 gap-2\">{RELEASE_STATUSES.map(status => <div key={status} className=\"p-3 rounded-xl bg-[#0A0A0D]/60 border border-white/[.05]\"><dt><span className={`text-[10px] px-2 py-0.5 rounded-full border font-bold ${STATUS_BADGE_STYLES[status] || ''}`}>{status}<\/span><\/dt><dd className=\"text-xs text-zinc-300 mt-2\">{RELEASE_STATUS_DESCRIPTIONS[status]}<\/dd><\/div>)}<\/dl> : <div className=\"space-y-2\">{item.a.map((line, index) => <p key={index} className=\"text-xs text-zinc-300 leading-relaxed\">{line}<\/p>)}<\/div>}\n      <\/BzAccordion>)}\n      <p className=\"text-[11px] text-[#8E8E9E]\">¿No encuentras tu respuesta? <button type=\"button\" onClick={() => setTab('chat')} className=\"font-bold text-[#B69AFF] hover:text-white underline underline-offset-4\">{isStaff ? 'Abre la bandeja de soporte' : 'Escribe al equipo'}<\/button>.<\/p>\n    <\/section>}\n\n    {tab === 'chat' && <section key=\"chat\" className=\"bz28-in space-y-4\" aria-label={isStaff ? 'Bandeja de soporte' : 'Conversaciones con Bersz Records'}>\n      <p className=\"bz28-demo-note\" role=\"note\"><Info className=\"w-4 h-4 shrink-0 mt-0.5\" aria-hidden=\"true\" /><span><strong>Modo demostración.<\/strong> Los mensajes se guardan solo en este navegador. No hay conexión en tiempo real con un agente: {isStaff ? 'las respuestas que escribas aquí aparecerán en la conversación del usuario.' : 'el equipo de Bersz Records responde desde el panel de Bersz Admin.'}<\/span><\/p>\n      <div className=\"grid lg:grid-cols-[minmax(0,4fr)_minmax(0,8fr)] gap-4 items-start\">\n        <aside className=\"bz28-card p-3 rounded-2xl space-y-2\" aria-label=\"Conversaciones\">\n          {!isStaff && <button type=\"button\" onClick={() => { setComposingNew(true); setSelectedId(null); }} className=\"bz28-btn bz28-btn-primary w-full\"><Plus className=\"w-4 h-4\" aria-hidden=\"true\" />Nueva conversación<\/button>}\n          {isStaff && <select value={chatFilter} onChange={e => setChatFilter(e.target.value)} aria-label=\"Filtrar conversaciones\" className=\"bz28-input bz28-select w-full px-3 py-2 rounded-xl text-xs text-white\"><option value=\"all\">Todas las conversaciones<\/option><option value=\"awaiting\">Pendientes de respuesta<\/option><option value=\"closed\">Cerradas<\/option><\/select>}\n          {visibleConversations.length === 0 ? <p className=\"bz28-empty\">{isStaff ? 'No hay conversaciones para este filtro.' : 'Todavía no tienes conversaciones con el equipo.'}<\/p> : <ul className=\"space-y-1.5 max-h-[460px] overflow-y-auto pr-0.5\">{visibleConversations.map(item => { const last = supportLastMessage(item); const unread = supportUnreadFor(item, isStaff); const awaiting = supportAwaitingTeam(item); return <li key={item.id}><button type=\"button\" aria-pressed={selectedId === item.id} onClick={() => { setSelectedId(item.id); setComposingNew(false); }} className={`bz28-conv w-full text-left p-3 rounded-xl ${selectedId === item.id ? 'is-selected' : ''}`}>\n            <span className=\"flex items-start justify-between gap-2\"><span className=\"min-w-0\"><span className=\"flex items-center gap-1.5 text-[12px] font-bold text-white truncate\">{unread && <span className=\"bz28-unread\" aria-label=\"Mensaje sin leer\" />}{item.subject}<\/span>{isStaff && <span className=\"block text-[10px] text-[#B69AFF] mt-0.5 truncate\">{userFor(item.userId)?.artisticName || item.userName} · {supportRoleLabel(item.role)}<\/span>}<\/span><SupportStatusPill status={item.status} /><\/span>\n            <span className=\"block text-[10px] text-zinc-400 mt-1.5 truncate\">{last ? `${last.fromStaff ? 'Equipo' : (isStaff ? item.userName : 'Tú')}: ${last.text}` : 'Sin mensajes'}<\/span>\n            <span className={`block text-[10px] mt-1 font-semibold ${awaiting ? 'text-amber-200' : 'text-zinc-500'}`}>{item.status === 'Cerrada' ? 'Conversación cerrada' : awaiting ? 'Respuesta pendiente del equipo' : 'Respondida por el equipo'}<\/span>\n          <\/button><\/li>; })}<\/ul>}\n        <\/aside>\n\n        <div className=\"bz28-card rounded-2xl min-h-[420px] flex flex-col\">\n          {composingNew && !isStaff ? <form onSubmit={submitNewConversation} className=\"p-5 sm:p-6 space-y-4\" aria-labelledby=\"new-conv-title\">\n            <div><h2 id=\"new-conv-title\" className=\"text-sm font-extrabold text-white\">Nueva conversación con Bersz Records<\/h2><p className=\"text-[11px] text-[#8E8E9E] mt-1\">Escribirás como {currentUser.artisticName} ({supportRoleLabel(currentUser.role)}).<\/p><\/div>\n            <label className=\"block text-[11px] font-semibold text-zinc-300\">Asunto<input required maxLength={140} value={newConversation.subject} onChange={e => setNewConversation(prev => ({ ...prev, subject: e.target.value }))} placeholder=\"¿Sobre qué necesitas ayuda?\" className={inputCls} /><\/label>\n            <label className=\"block text-[11px] font-semibold text-zinc-300\">Mensaje<textarea required rows={5} maxLength={2000} value={newConversation.message} onChange={e => setNewConversation(prev => ({ ...prev, message: e.target.value }))} placeholder=\"Describe tu consulta\" className={`${inputCls} resize-y`} /><\/label>\n            <div className=\"flex flex-col-reverse sm:flex-row justify-end gap-2\"><button type=\"button\" onClick={() => setComposingNew(false)} className=\"bz28-btn bz28-btn-secondary\">Cancelar<\/button><button type=\"submit\" disabled={!newConversation.subject.trim() || !newConversation.message.trim()} className=\"bz28-btn bz28-btn-primary\"><Send className=\"w-4 h-4\" aria-hidden=\"true\" />Iniciar conversación<\/button><\/div>\n          <\/form> : selected ? <>\n            <header className=\"p-4 sm:p-5 border-b border-white/[.07] flex flex-wrap items-start justify-between gap-3\">\n              <div className=\"min-w-0\"><h2 className=\"text-sm font-extrabold text-white\">{selected.subject}<\/h2><p className=\"text-[10px] text-[#8E8E9E] mt-1\">{isStaff ? `${userFor(selected.userId)?.artisticName || selected.userName} · ${supportRoleLabel(selected.role)} · ` : ''}Iniciada {fmt(selected.createdAt)}<\/p><\/div>\n              <div className=\"flex flex-wrap items-center gap-2\"><SupportStatusPill status={selected.status} />{selected.status === 'Abierta' && <button type=\"button\" onClick={() => onSetConversationStatus(selected.id, 'Cerrada')} className=\"bz28-btn bz28-btn-secondary bz28-btn-sm\">Cerrar conversación<\/button>}{isStaff && selected.status === 'Cerrada' && <button type=\"button\" onClick={() => onSetConversationStatus(selected.id, 'Abierta')} className=\"bz28-btn bz28-btn-secondary bz28-btn-sm\">Reabrir<\/button>}<\/div>\n            <\/header>\n            <div ref={threadRef} className=\"bz28-thread flex-1 p-4 sm:p-5 space-y-3 overflow-y-auto max-h-[480px]\" aria-live=\"polite\">\n              {(selected.messages || []).map(message => { const mine = isStaff ? message.fromStaff : !message.fromStaff; return <div key={message.id} className={`bz28-msg-row ${mine ? 'is-mine' : ''}`}><div className={`bz28-bubble ${message.fromStaff ? 'is-staff' : 'is-user'}`}>\n                <p className=\"bz28-bubble-author\">{message.fromStaff ? `Equipo Bersz Records · ${message.authorName}` : `${message.authorName} · ${supportRoleLabel(selected.role)}`}<\/p>\n                <p className=\"text-xs whitespace-pre-wrap leading-relaxed\">{message.text}<\/p>\n                <p className=\"bz28-bubble-time\">{fmt(message.createdAt)}<\/p>\n              <\/div><\/div>; })}\n              {supportAwaitingTeam(selected) && <p className=\"text-center text-[10px] text-amber-200/90\">{isStaff ? 'El usuario espera una respuesta del equipo.' : 'Respuesta pendiente del equipo de Bersz Records.'}<\/p>}\n            <\/div>\n            {selected.status === 'Abierta' ? <form onSubmit={submitReply} className=\"p-3 sm:p-4 border-t border-white/[.07] flex flex-col sm:flex-row gap-2 items-stretch sm:items-end\">\n              <label className=\"flex-1 block text-[10px] font-semibold text-zinc-400\">{isStaff ? 'Responder como equipo de Bersz Records' : 'Escribe tu mensaje'}<textarea rows={2} maxLength={2000} value={reply} onChange={e => setReply(e.target.value)} onKeyDown={event => { if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) submitReply(event); }} placeholder=\"Escribe un mensaje…\" className={`${inputCls} resize-none`} /><\/label>\n              <button type=\"submit\" disabled={!reply.trim()} className=\"bz28-btn bz28-btn-primary\"><Send className=\"w-4 h-4\" aria-hidden=\"true\" />Enviar<\/button>\n            <\/form> : <p className=\"p-4 border-t border-white/[.07] text-[11px] text-zinc-400\">{isStaff ? 'La conversación está cerrada. Reábrela para responder.' : 'La conversación está cerrada. Puedes iniciar una nueva desde «Nueva conversación».'}<\/p>}\n          <\/> : <div className=\"flex-1 flex flex-col items-center justify-center text-center p-8 gap-3\"><span className=\"bz28-acc-icon w-11 h-11\" aria-hidden=\"true\"><MessageSquare className=\"w-5 h-5\" /><\/span><p className=\"text-xs text-[#8E8E9E] max-w-xs\">{isStaff ? 'Selecciona una conversación para leerla y responder.' : 'Selecciona una conversación o inicia una nueva para escribir al equipo.'}<\/p><\/div>}\n        <\/div>\n      <\/div>\n    <\/section>}\n  <\/div>;\n}\n";
</script>
  <script type="module">
    import React, { createElement } from 'react';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client?external=react';
    import * as Lucide from 'https://esm.sh/lucide-react@0.468.0?external=react';

    const rootElement = document.getElementById('root');
    try {
      const source = window.__BERSZ_APP_SOURCE__;
      const compiled = Babel.transform(source, { presets: [['react', { runtime: 'classic' }]], sourceType: 'script' }).code;
      const runtime = [
        'const { useState, useEffect, useMemo, useRef } = React;',
        'const { Home, Disc, Upload, BarChart3, Video, DollarSign, User, Users, Settings, LogOut, Lock, Unlock, Plus, Trash2, Edit3, CheckCircle2, AlertCircle, Clock, ChevronRight, ChevronLeft, FileAudio, Image: ImageIcon, ExternalLink, Search, Filter, ShieldCheck, Bell, Menu, X, Play, Download, RefreshCw, Eye, Sparkles, Check, Info, ArrowUpRight, Layers, FileText, Music, Sliders, History, LifeBuoy, MessageSquare, Send, ChevronDown } = Lucide;',
        compiled,
        'return App;'
      ].join('\n');
      const App = new Function('React', 'Lucide', runtime)(React, Lucide);
      createRoot(rootElement).render(createElement(App));
    } catch (error) {
      console.error(error);
      rootElement.innerHTML = '<main style="max-width:760px;margin:10vh auto;padding:24px;color:#fff;font:14px system-ui"><h1 style="font-size:22px">No se pudo cargar el portal</h1><p style="color:#aaa">Comprueba tu conexión a internet y vuelve a abrir este archivo.</p><pre style="white-space:pre-wrap;color:#fca5a5"></pre></main>';
      rootElement.querySelector('pre').textContent = error?.stack || String(error);
    }
  </script>
