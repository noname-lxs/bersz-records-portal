  <style>
    :root {
      color-scheme: dark;
      --bersz-black: #0A0A0D;
      --bersz-violet: #7138F5;
      --bersz-lavender: #B69AFF;
      --bersz-gray: #1E1E24;
      --bersz-white: #FFFFFF;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root {
      min-height: 100%;
      margin: 0;
      background-color: #0A0A0D;
      color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -0.011em;
      overflow-x: hidden;
    }
    button, input, select, textarea { font: inherit; }

    /* Subtle ambient background on main canvas */
    .bersz-main-canvas {
      background-image:
        radial-gradient(ellipse 80% 45% at 50% -10%, rgba(113, 56, 245, 0.11), transparent 70%),
        radial-gradient(ellipse 50% 35% at 95% 0%, rgba(182, 154, 255, 0.05), transparent 65%);
      background-attachment: local;
    }

    /* Refined form controls & focus states (150-200ms) */
    input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not(.bersz-search-input),
    select,
    textarea {
      transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
      border-color: rgba(255, 255, 255, 0.09);
    }
    input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not(.bersz-search-input):hover,
    select:hover,
    textarea:hover {
      border-color: rgba(182, 154, 255, 0.28);
    }
    input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not(.bersz-search-input):focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #7138F5 !important;
      box-shadow: 0 0 0 3px rgba(113, 56, 245, 0.22);
    }
    input::placeholder, textarea::placeholder {
      color: rgba(142, 142, 158, 0.68);
    }
    input[type="checkbox"], input[type="radio"] {
      accent-color: #7138F5;
      cursor: pointer;
    }

    /* Interactive button & link micro-transitions */
    button, a {
      transition: background-color 180ms cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 180ms cubic-bezier(0.22, 1, 0.36, 1),
                  color 180ms cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 180ms cubic-bezier(0.22, 1, 0.36, 1),
                  transform 160ms cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 180ms ease;
    }
    button:focus-visible, a:focus-visible {
      outline: 2px solid #B69AFF;
      outline-offset: 2px;
    }

    /* Table refinements */
    table th {
      letter-spacing: 0.04em;
    }

    /* Custom subtle scrollbars */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #0A0A0D; }
    ::-webkit-scrollbar-thumb {
      background: #25252E;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    ::-webkit-scrollbar-thumb:hover { background: #383846; }

    /* Subtle animations (160ms - 220ms) */
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes modal-backdrop-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes modal-panel-in {
      from { opacity: 0; transform: translateY(6px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-fade-in { animation: fade-in 200ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    .animate-modal-backdrop { animation: modal-backdrop-in 170ms ease-out both; }
    .animate-modal-panel { animation: modal-panel-in 210ms cubic-bezier(0.22, 1, 0.36, 1) both; }

    /* Respect system prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .animate-fade-in, .animate-modal-backdrop, .animate-modal-panel {
        animation: none !important;
        transform: none !important;
      }
    }

    .bersz-credit-input { display: block; width: 100%; padding: .625rem .875rem; border-radius: .75rem; background: var(--bersz-black); border: 1px solid var(--bersz-gray); color: var(--bersz-white); font-size: .75rem; min-width: 0; }
    .bersz-credit-label { display: block; font-size: .75rem; color: var(--bersz-white); line-height: 1.7; }
    .bersz-credit-add { padding: .5rem .75rem; border-radius: .75rem; border: 1px solid var(--bersz-violet); background: var(--bersz-black); color: var(--bersz-lavender); font-size: .75rem; font-weight: 700; }
    .bersz-credit-remove { padding: .5rem; color: var(--bersz-lavender); flex-shrink: 0; }
    .bersz-credit-radio { accent-color: var(--bersz-violet); }
    .bersz-credit-notice { border-left: 3px solid var(--bersz-violet); padding: .5rem .875rem; color: var(--bersz-lavender); font-size: .75rem; line-height: 1.7; }
  .bersz-credit-section{display:flex;flex-direction:column;gap:1.25rem;padding:1.5rem;border-radius:1rem;background:var(--bersz-black);border:1px solid rgba(255,255,255,.07)}

.bersz-credit-role{display:inline-flex;align-items:center;height:2.5rem;padding:0 .9rem;border-radius:.75rem;border:1px solid rgba(113,56,245,.45);color:var(--bersz-lavender);font-size:.75rem;font-weight:700;white-space:nowrap}
.bersz-credit-group .bersz-credit-add{margin-top:1rem}
.bersz-credit-group .bersz-credit-remove{flex:none;height:2.5rem}

.bz-btn-primary,.bersz-wizard .bz-btn-primary{color:#fff!important;border:1px solid rgba(255,255,255,.18)!important;background:var(--bz-grad)!important;background-size:180% 100%!important;background-position:0% 50%!important;box-shadow:0 10px 28px -10px rgba(113,56,245,.85),0 0 0 0 rgba(155,75,255,0),inset 0 1px 0 rgba(255,255,255,.28)!important}
.bz-btn-primary::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--bz-ease)}
.bz-btn-primary:hover:not(:disabled),.bersz-wizard .bz-btn-primary:hover:not(:disabled){background-position:100% 50%!important;transform:translateY(-2px)!important;border-color:rgba(255,255,255,.32)!important;box-shadow:0 16px 36px -12px rgba(226,61,219,.7),0 0 0 4px rgba(155,75,255,.18),inset 0 1px 0 rgba(255,255,255,.35)!important}
.bz-btn-primary:hover:not(:disabled)::before{transform:translateX(120%)}
.bz-btn:active:not(:disabled),.bersz-wizard .bz-btn:active:not(:disabled){transform:translateY(0) scale(.965)!important;transition-duration:.08s!important}
.bz-btn-ghost,.bersz-wizard .bz-btn-ghost{color:#E9E2FF!important;background:linear-gradient(160deg,rgba(30,30,36,.95),rgba(10,10,13,.95))!important;border:1px solid var(--bz-line-2)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 18px -12px rgba(0,0,0,.8)!important}
.bz-btn-ghost:hover:not(:disabled),.bersz-wizard .bz-btn-ghost:hover:not(:disabled){color:#fff!important;border-color:var(--bz-lav)!important;transform:translateY(-1px)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 3px rgba(113,56,245,.18),0 10px 24px -12px rgba(113,56,245,.8)!important}
.bersz-wizard .bz-btn-sm{min-height:34px;padding:.4rem .9rem!important;font-size:.68rem!important}
.bz-btn-lg{min-height:54px;padding:.95rem 2rem!important;font-size:.85rem!important}
.bz-btn:disabled,.bersz-wizard .bz-btn:disabled{opacity:.45;cursor:not-allowed;filter:saturate(.4)!important;transform:none!important;box-shadow:none!important}
.bz-btn[data-loading=true]{pointer-events:none;background-size:300% 100%!important;animation:bz-shimmer 1.2s linear infinite}
.bz-btn:focus-visible,.bersz-wizard .bz-btn:focus-visible{outline:2px solid var(--bz-lav)!important;outline-offset:3px}
.bz-loading{display:inline-flex;align-items:center;gap:.5rem}
.bz-spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:bz-spin .7s linear infinite}
.bersz-wizard .bz-icon-btn,.bersz-wizard .bersz-credit-remove{min-height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px!important;border:1px solid transparent!important;transition:background-color .2s,border-color .2s,transform .18s var(--bz-ease),color .2s!important}
.bersz-wizard .bz-icon-btn:hover,.bersz-wizard .bersz-credit-remove:hover{background:rgba(226,61,219,.12)!important;border-color:rgba(226,61,219,.4)!important;color:#fff!important;transform:rotate(90deg) scale(1.05)!important}
.bersz-wizard .bersz-credit-add{display:inline-flex;align-items:center;gap:.4rem;min-height:38px;padding:.45rem 1rem!important;border-radius:9999px!important;border:1px dashed rgba(182,154,255,.5)!important;background:rgba(113,56,245,.08)!important;color:var(--bz-lav)!important;font-family:"Space Grotesk",sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.04em!important;text-transform:uppercase!important;transition:background-color .2s,border-color .2s,transform .2s var(--bz-ease),box-shadow .25s,color .2s!important}
.bersz-wizard .bersz-credit-add:hover{border-style:solid!important;border-color:var(--bz-lav)!important;background:rgba(113,56,245,.2)!important;color:#fff!important;transform:translateY(-1px)!important;box-shadow:0 8px 22px -12px rgba(113,56,245,.9)!important}
.bersz-wizard .bersz-credit-add:active{transform:scale(.96)!important}

/* --- Tipografía y encabezado --- */
.bersz-wizard>div:first-child h1{font-family:"Archivo",sans-serif;font-weight:900!important;font-style:italic!important;text-transform:uppercase!important;font-size:clamp(1.5rem,3.4vw,2.25rem)!important;line-height:1.05!important;letter-spacing:-.02em!important;background:linear-gradient(100deg,#fff 0%,#E6DCFF 45%,var(--bz-lav) 100%);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.bersz-wizard h2{font-family:"Archivo",sans-serif;font-weight:800!important;font-size:1.15rem!important;text-transform:uppercase;letter-spacing:.01em!important;display:flex;align-items:center;gap:.6rem}
.bersz-wizard h2::before{content:"";width:6px;height:1.15em;border-radius:9999px;background:var(--bz-grad);box-shadow:0 0 14px rgba(155,75,255,.8)}
.bersz-wizard label.block,.bersz-wizard legend{font-family:"Space Grotesk",sans-serif;letter-spacing:.03em!important;color:#E6DCFF!important}

/* --- Stepper y progreso --- */
.bersz-wizard .bersz-stepper{position:relative;padding:14px;border-radius:20px;background:var(--bz-surface);border:1px solid var(--bz-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.bersz-wizard .bersz-stepper li{transition:color .3s}
.bersz-wizard .bersz-stepper li>span{transition:background .35s var(--bz-ease),border-color .35s,box-shadow .35s,transform .35s var(--bz-ease);font-family:"Space Grotesk",sans-serif;font-weight:700}
.bersz-wizard .bersz-stepper li[aria-current]>span{background:var(--bz-grad)!important;border-color:transparent!important;transform:scale(1.08);box-shadow:0 0 0 4px rgba(113,56,245,.22),0 8px 22px -6px rgba(226,61,219,.65)}
.bersz-wizard .bersz-stepper li[data-complete=true]>span{background:rgba(113,56,245,.22);border-color:var(--bz-v)}
.bersz-wizard .bersz-stepper li strong{font-family:"Space Grotesk",sans-serif}
.bersz-wizard .bz-progress{height:6px!important;background:rgba(30,30,36,.9)!important;border-color:var(--bz-line)!important}
.bersz-wizard .bz-progress-fill{position:relative;background:var(--bz-grad)!important;background-size:200% 100%!important;box-shadow:0 0 16px rgba(155,75,255,.75);transition:width .6s var(--bz-ease)!important;animation:bz-shimmer 3s linear infinite}

/* --- Pasos: navegación animada --- */
.bersz-wizard .bersz-form-step{animation:bz-step-fwd .42s var(--bz-ease) both}
.bersz-wizard .bersz-form-step[data-dir=back]{animation-name:bz-step-back}
.bersz-wizard .bersz-form-step>*{animation:bz-rise .5s var(--bz-ease) both}
.bersz-wizard .bersz-form-step>*:nth-child(2){animation-delay:.04s}.bersz-wizard .bersz-form-step>*:nth-child(3){animation-delay:.08s}.bersz-wizard .bersz-form-step>*:nth-child(4){animation-delay:.12s}.bersz-wizard .bersz-form-step>*:nth-child(5){animation-delay:.16s}.bersz-wizard .bersz-form-step>*:nth-child(n+6){animation-delay:.2s}

/* --- Campos --- */
.bersz-wizard input:not([type=radio]):not([type=checkbox]):not([type=file]),.bersz-wizard select,.bersz-wizard textarea{border-radius:14px!important;background:rgba(10,10,13,.85)!important;border:1px solid rgba(182,154,255,.14)!important;transition:border-color .2s,box-shadow .25s var(--bz-ease),background-color .2s,transform .2s var(--bz-ease)!important}
.bersz-wizard input:not([type=radio]):not([type=checkbox]):not([type=file]):hover,.bersz-wizard select:hover,.bersz-wizard textarea:hover{border-color:rgba(182,154,255,.32)!important}
.bersz-wizard input:not([type=radio]):not([type=checkbox]):not([type=file]):focus,.bersz-wizard select:focus,.bersz-wizard textarea:focus{outline:none!important;border-color:var(--bz-v2)!important;background:rgba(18,14,30,.95)!important;box-shadow:0 0 0 4px rgba(113,56,245,.2),0 0 26px -8px rgba(155,75,255,.8)!important}
.bersz-wizard input[type=radio],.bersz-wizard input[type=checkbox]{width:18px;height:18px;accent-color:var(--bz-v);transition:transform .18s var(--bz-ease)}
.bersz-wizard input[type=radio]:checked,.bersz-wizard input[type=checkbox]:checked{transform:scale(1.1);filter:drop-shadow(0 0 6px rgba(155,75,255,.8))}
.bersz-wizard fieldset label.cursor-pointer{padding:.55rem .95rem;border-radius:9999px;border:1px solid var(--bz-line);background:rgba(10,10,13,.6);transition:border-color .2s,background-color .2s,box-shadow .25s}
.bersz-wizard fieldset label.cursor-pointer:hover{border-color:var(--bz-line-2)}
.bersz-wizard fieldset label.cursor-pointer:has(input:checked){border-color:var(--bz-v);background:rgba(113,56,245,.16);color:#fff;box-shadow:0 0 0 3px rgba(113,56,245,.14)}

/* --- Selector de versiones --- */
.bersz-wizard .bz-chip{position:relative;min-height:52px!important;border-radius:16px!important;border:1px solid rgba(182,154,255,.14)!important;background:rgba(10,10,13,.8)!important;color:#A9A6BA!important;font-family:"Space Grotesk",sans-serif;letter-spacing:.02em!important;transition:transform .22s var(--bz-ease),border-color .25s,background .3s,color .2s,box-shadow .3s!important}
.bersz-wizard .bz-chip:hover{transform:translateY(-2px)!important;border-color:var(--bz-line-2)!important;color:#fff!important}
.bersz-wizard .bz-chip:active{transform:scale(.96)!important}
.bersz-wizard .bz-chip[data-active=true]{color:#fff!important;border-color:transparent!important;background:linear-gradient(rgba(24,16,44,.92),rgba(24,16,44,.92)) padding-box,var(--bz-grad) border-box!important;border:1px solid transparent!important;box-shadow:0 10px 26px -14px rgba(155,75,255,.95),inset 0 0 22px -10px rgba(155,75,255,.7)!important;animation:bz-pop .32s var(--bz-ease)}
.bersz-wizard .bz-chip[data-locked=true]{cursor:default}
.bz-chip-check{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--bz-grad);color:#fff;opacity:0;transform:scale(.4) rotate(-45deg);transition:opacity .2s,transform .3s var(--bz-ease);box-shadow:0 0 12px rgba(226,61,219,.6)}
.bz-chip[data-active=true] .bz-chip-check{opacity:1;transform:none}
.bersz-wizard .bz-tab{border-radius:9999px!important;font-family:"Space Grotesk",sans-serif;transition:transform .2s var(--bz-ease),background .3s,border-color .25s,color .2s,box-shadow .3s!important}
.bersz-wizard .bz-tab:hover{transform:translateY(-1px)!important}
.bersz-wizard .bz-tab[data-active=true]{background:var(--bz-grad)!important;border-color:transparent!important;color:#fff!important;box-shadow:0 8px 22px -10px rgba(226,61,219,.8)!important}

/* --- Tarjetas, secciones, mensajes --- */
.bersz-wizard [class*="bg-[#0A0A0D]/90"],.bersz-wizard .bersz-credit-section,.bersz-wizard .bz-wav{background:var(--bz-surface)!important;border:1px solid var(--bz-line)!important;border-radius:20px!important;padding:1.25rem!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 22px 44px -28px rgba(0,0,0,.9);transition:border-color .3s,box-shadow .35s}
.bersz-wizard .bersz-credit-section:hover,.bersz-wizard .bz-wav:hover{border-color:var(--bz-line-2)!important}
.bersz-wizard .bersz-credit-group{border-bottom:1px solid var(--bz-line)!important}
.bersz-wizard .bersz-credit-notice,.bersz-wizard .bz-msg{animation:bz-msg-in .4s var(--bz-ease) both}
.bersz-wizard .bersz-credit-notice{border-left:3px solid transparent;border-image:var(--bz-grad) 1;background:rgba(113,56,245,.07);border-radius:0 12px 12px 0}
.bersz-wizard .bz-msg{border-radius:12px!important}
.bersz-wizard .bz-reveal{animation:bz-rise .4s var(--bz-ease) both}
.bersz-wizard .bz-row,.bersz-wizard .bersz-credit-row{animation:bz-row-in .32s var(--bz-ease) both}
.bersz-wizard .bersz-credit-index{width:1.9rem;height:1.9rem;align-self:center;border-radius:50%;background:rgba(113,56,245,.16);border:1px solid var(--bz-line-2)}
.bersz-wizard .bersz-credit-role{border-radius:9999px!important;background:rgba(113,56,245,.14)}

/* --- Portada --- */
.bersz-wizard .bz-cover{width:9rem;height:9rem;border-radius:18px!important;border:1px dashed var(--bz-line-2)!important;background:radial-gradient(circle at 50% 40%,rgba(113,56,245,.18),rgba(10,10,13,.9) 70%)!important;transition:border-color .3s,box-shadow .35s,transform .3s var(--bz-ease)}
.bersz-wizard .bz-cover[data-has=true]{border-style:solid!important;border-color:transparent!important;box-shadow:0 0 0 1px rgba(182,154,255,.4),0 18px 40px -16px rgba(155,75,255,.75)}
.bersz-wizard .bz-cover:hover{transform:translateY(-2px) rotate(-1deg)}
.bz-cover-img{animation:bz-cover-in .45s var(--bz-ease) both}
.bersz-wizard .bz-file::file-selector-button{margin-right:.8rem;padding:.6rem 1.2rem;border:1px solid rgba(255,255,255,.18);border-radius:9999px;background:var(--bz-grad);background-size:180% 100%;color:#fff;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 22px -10px rgba(113,56,245,.9);transition:background-position .5s var(--bz-ease),transform .2s var(--bz-ease),box-shadow .25s}
.bersz-wizard .bz-file:hover::file-selector-button{background-position:100% 50%;transform:translateY(-1px);box-shadow:0 12px 26px -10px rgba(226,61,219,.8)}

/* --- WAV --- */
.bersz-wizard .bz-wav[data-loaded=true]{border-color:rgba(110,231,183,.35)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 0 3px rgba(110,231,183,.06),0 22px 44px -28px rgba(0,0,0,.9)}
.bersz-wizard .bz-wav[data-loading=true]{position:relative;overflow:hidden}
.bersz-wizard .bz-wav[data-loading=true]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--bz-grad);background-size:200% 100%;animation:bz-shimmer 1s linear infinite}
.bz-swap{animation:bz-msg-in .35s var(--bz-ease) both}

/* --- Resumen final --- */
.bersz-wizard .bersz-release-overview,.bersz-wizard .bersz-summary-track{padding:1.4rem!important;margin-top:1rem;border:1px solid var(--bz-line)!important;border-radius:20px;background:var(--bz-surface);animation:bz-rise .5s var(--bz-ease) both}
.bersz-wizard .bersz-summary-track:nth-child(2){animation-delay:.06s}.bersz-wizard .bersz-summary-track:nth-child(3){animation-delay:.12s}.bersz-wizard .bersz-summary-track:nth-child(n+4){animation-delay:.18s}
.bersz-wizard .bersz-track-heading>span{display:inline-block;padding:.2rem .7rem;border-radius:9999px;background:rgba(113,56,245,.2);border:1px solid var(--bz-line-2);font-family:"Space Grotesk",sans-serif;text-transform:uppercase;letter-spacing:.06em!important}
.bersz-wizard .bersz-cover-frame{border-radius:16px!important;box-shadow:0 18px 40px -18px rgba(155,75,255,.7)}
.bersz-wizard .bz-confirm{padding:1rem 1.1rem;border-radius:16px;border:1px solid var(--bz-line);background:rgba(10,10,13,.6);transition:border-color .25s,background-color .25s,box-shadow .3s}
.bersz-wizard .bz-confirm[data-checked=true]{border-color:var(--bz-v);background:rgba(113,56,245,.12);box-shadow:0 0 0 3px rgba(113,56,245,.14);color:#fff}

/* --- Pantalla inicial --- */
.bz-intro{display:flex;flex-direction:column;gap:1.25rem;padding:1rem 0 2rem}
.bz-intro-hero{position:relative;overflow:hidden;padding:clamp(2rem,5vw,3.5rem) clamp(1.4rem,4vw,3rem);border-radius:28px;border:1px solid var(--bz-line);background:radial-gradient(120% 90% at 0% 0%,rgba(113,56,245,.35),transparent 55%),radial-gradient(90% 80% at 100% 100%,rgba(226,61,219,.2),transparent 60%),linear-gradient(160deg,rgba(30,30,36,.9),rgba(10,10,13,.95));box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 30px 70px -36px rgba(113,56,245,.8);animation:bz-rise .55s var(--bz-ease) both}
.bz-intro-hero::after{content:"";position:absolute;width:320px;height:320px;right:-110px;top:-120px;border-radius:50%;border:1px solid rgba(182,154,255,.18);box-shadow:0 0 0 40px rgba(182,154,255,.04),0 0 0 80px rgba(182,154,255,.03);animation:bz-orbit 14s linear infinite;pointer-events:none}
.bz-intro-eyebrow{display:inline-flex;align-items:center;gap:.45rem;padding:.35rem .85rem;border-radius:9999px;border:1px solid var(--bz-line-2);background:rgba(113,56,245,.14);color:var(--bz-lav);font-family:"Space Grotesk",sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.bz-intro-title{margin:1.1rem 0 .9rem;font-family:"Archivo",sans-serif;font-weight:900!important;font-style:italic;text-transform:uppercase;font-size:clamp(2rem,6vw,3.6rem)!important;line-height:.95!important;letter-spacing:-.03em!important;background:linear-gradient(100deg,#fff 10%,#E6DCFF 50%,var(--bz-lav) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.bz-intro-text{max-width:34rem;margin:0 0 1.8rem;color:#C9C4DA;font-size:.95rem;line-height:1.65}
.bz-intro-note{display:flex;gap:1rem;align-items:flex-start;padding:1.2rem 1.35rem;border-radius:20px;border:1px solid var(--bz-line);border-left:3px solid var(--bz-v);background:linear-gradient(160deg,rgba(30,30,36,.85),rgba(10,10,13,.92));animation:bz-rise .55s var(--bz-ease) .14s both}
.bz-intro-note-icon{flex:none;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:rgba(113,56,245,.18);border:1px solid var(--bz-line-2);color:var(--bz-lav)}
.bz-intro-note-icon svg{animation:bz-spin 6s linear infinite}
.bz-intro-note-title{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--bz-lav);margin:0 0 .3rem}
.bz-intro-note-text{margin:0;color:#B9B5C9;font-size:.85rem;line-height:1.6}
.bz-form-enter{animation:bz-form-in .5s var(--bz-ease) both}

/* --- Animaciones --- */
@keyframes bz-step-fwd{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes bz-step-back{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes bz-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes bz-form-in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes bz-row-in{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes bz-msg-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes bz-pop{0%{transform:scale(.95)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes bz-cover-in{from{opacity:0;transform:scale(.92);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes bz-shimmer{from{background-position:0% 50%}to{background-position:200% 50%}}
@keyframes bz-spin{to{transform:rotate(360deg)}}
@keyframes bz-orbit{to{transform:rotate(360deg)}}

@media (max-width:640px){
  .bz-intro-hero{border-radius:22px}
  .bz-btn-lg{width:100%}
  .bersz-wizard .flex.justify-between{flex-wrap:wrap;gap:.6rem}
  .bersz-wizard .flex.justify-between .bz-btn{flex:1 1 auto}
  .bersz-wizard .bz-cover{width:7.5rem;height:7.5rem}
}
@media (prefers-reduced-motion:reduce){
  .bz-intro *,.bz-intro,.bz-form-enter,.bersz-wizard *,.bersz-wizard{animation:none!important;transition-duration:.01ms!important}
  .bz-btn-primary::before{display:none}
}
/* ===== Refinamiento v2.7: tiempos unificados, tarjetas con borde iluminado, estados y táctil ===== */
.bz-intro,.bersz-wizard{--bz-t-fast:.16s;--bz-t-mid:.28s;--bz-t-slow:.42s}
/* Sin animaciones permanentes: el brillo solo acompaña cambios reales */
.bersz-wizard .bz-progress-fill{animation:none!important;background-size:100% 100%!important;background:linear-gradient(90deg,#7138F5,#9B4BFF 55%,#B69AFF)!important;box-shadow:0 0 12px rgba(155,75,255,.55)!important}
.bz-intro-hero::after,.bz-intro-note-icon svg{animation:none!important}
.bersz-wizard .bersz-stepper li[data-complete=true]>span{color:#fff;box-shadow:0 0 0 2px rgba(113,56,245,.25)}
/* Tarjetas interactivas: borde iluminado al pasar el cursor */
.bersz-wizard .bersz-summary-track,.bersz-wizard .bersz-release-overview,.bersz-wizard .bz-wav,.bersz-wizard .bz-confirm,.bersz-wizard .bz-cover,.bz-intro-note{transition:border-color var(--bz-t-mid) var(--bz-ease),box-shadow var(--bz-t-mid) var(--bz-ease),transform var(--bz-t-mid) var(--bz-ease)}
@media (hover:hover){
 .bersz-wizard .bersz-summary-track:hover,.bersz-wizard .bersz-release-overview:hover,.bersz-wizard .bz-wav:hover,.bz-intro-note:hover{border-color:rgba(182,154,255,.42)!important;box-shadow:0 0 0 1px rgba(113,56,245,.25),0 18px 40px -24px rgba(113,56,245,.75)!important}
 .bersz-wizard .bz-confirm:hover{border-color:var(--bz-line-2)}
}
/* Hover solo con cursor: en táctil no quedan estados "pegados" */
@media (hover:none){

    window.__BERSZ_APP_SOURCE__ = "const BerszEmblemSVG = ({ className = \"w-10 h-10\" }) => (\n  <img src=\"bersz-pill.png\" alt=\"Bersz\" className={className + \" bersz-logo-img object-contain\"} />\n);\n\nconst BerszWordmarkSVG = ({ className = \"h-14\" }) => (\n  <img src=\"bersz-full.png\" alt=\"Bersz Records\" className={className + \" bersz-logo-img bersz-logo-full w-auto object-contain\"} />\n);\n\nconst AUDIO_DB_NAME = 'BerszAudioVaultDB';\nconst AUDIO_STORE_NAME = 'private_wav_masters';\n\nconst openAudioVaultDB = () => {\n  return new Promise((resolve, reject) => {\n    if (typeof window === 'undefined' || !window.indexedDB) {\n      reject(new Error('IndexedDB no está disponible.'));\n      return;\n    }\n    const req = window.indexedDB.open(AUDIO_DB_NAME, 1);\n    req.onupgradeneeded = (e) => {\n      const db = e.target.result;\n      if (!db.objectStoreNames.contains(AUDIO_STORE_NAME)) {\n        db.createObjectStore(AUDIO_STORE_NAME, { keyPath: 'id' });\n      }\n    };\n    req.onsuccess = () => resolve(req.result);\n    req.onerror = () => reject(req.error);\n  });\n};\n\nconst saveWavToVault = async (audioId, fileBlob, metadata) => {\n  const db = await openAudioVaultDB();\n  return new Promise((resolve, reject) => {\n    const tx = db.transaction(AUDIO_STORE_NAME, 'readwrite');\n    const store = tx.objectStore(AUDIO_STORE_NAME);\n    store.put({\n      id: audioId,\n      blob: fileBlob,\n      name: metadata.name,\n      sizeMB: metadata.sizeMB,\n      type: metadata.type || 'audio/wav',\n      ownerArtistId: metadata.ownerArtistId,\n      uploadedAt: metadata.uploadedAt,\n      ...(metadata.isTestAudio ? { isTestAudio: true } : {})\n    });\n    tx.oncomplete = () => { db.close(); resolve(true); };\n    tx.onerror = () => { db.close(); reject(tx.error); };\n  });\n};\n\nconst getWavFromVault = async (audioId) => {\n  const db = await openAudioVaultDB();\n  return new Promise((resolve, reject) => {\n    const tx = db.transaction(AUDIO_STORE_NAME, 'readonly');\n    const store = tx.objectStore(AUDIO_STORE_NAME);\n    const req = store.get(audioId);\n    req.onsuccess = () => { db.close(); resolve(req.result || null); };\n    req.onerror = () => { db.close(); reject(req.error); };\n  });\n};\n\nconst deleteWavFromVault = async (audioId) => {\n  if (!audioId) return true;\n  const db = await openAudioVaultDB();\n  return new Promise((resolve, reject) => {\n    const tx = db.transaction(AUDIO_STORE_NAME, 'readwrite');\n    tx.objectStore(AUDIO_STORE_NAME).delete(audioId);\n    tx.oncomplete = () => { db.close(); resolve(true); };\n    tx.onerror = () => { db.close(); reject(tx.error); };\n  });\n};\n\nconst createSyntheticWavBlob = () => {\n  const sampleRate = 22050;\n  const durationSeconds = 2;\n  const numSamples = sampleRate * durationSeconds;\n  const buffer = new ArrayBuffer(44 + numSamples * 2);\n  const view = new DataView(buffer);\n  const writeString = (offset, str) => {\n    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));\n  };\n  writeString(0, 'RIFF');\n  view.setUint32(4, 36 + numSamples * 2, true);\n  writeString(8, 'WAVE');\n  writeString(12, 'fmt ');\n  view.setUint32(16, 16, true);\n  view.setUint16(20, 1, true);\n  view.setUint16(22, 1, true);\n  view.setUint32(24, sampleRate, true);\n  view.setUint32(28, sampleRate * 2, true);\n  view.setUint16(32, 2, true);\n  view.setUint16(34, 16, true);\n  writeString(36, 'data');\n  view.setUint32(40, numSamples * 2, true);\n  for (let i = 0; i < numSamples; i++) {\n    const t = i / sampleRate;\n    const envelope = Math.exp(-3 * (t % 0.5));\n    const freq = (i % 11025 < 5512) ? 110 : 164.81;\n    const sample = Math.sin(2 * Math.PI * freq * t) * envelope * 0.45;\n    view.setInt16(44 + i * 2, sample * 32767, true);\n  }\n  return new Blob([buffer], { type: 'audio/wav' });\n};\n\n// Detects audio generated by \"Generar WAV de prueba real\": flagged records, or (older records) a byte-identical copy of the synthe nible en el catálogo actual.<\/p>}<\/article>; })}<\/div>}<\/div>;\n}\n\nfunction BzAccordion({ id, title, subtitle, count, open, onToggle, icon: Icon, level = 2, children }) {\n  return <section className=\"bz28-acc\" data-open={open}>\n    <div role=\"heading\" aria-level={level}><button type=\"button\" id={`${id}-btn`} aria-expanded={open} aria-controls={`${id}-panel`} onClick={onToggle} className=\"bz28-acc-trigger\">\n      {Icon && <span className=\"bz28-acc-icon\" aria-hidden=\"true\"><Icon className=\"w-4 h-4\" /><\/span>}\n      <span className=\"min-w-0 flex-1 text-left\"><span className=\"bz28-acc-title\">{title}<\/span>{subtitle && <span className=\"bz28-acc-sub\">{subtitle}<\/span>}<\/span>\n      {count != null && <span className=\"bz28-acc-count\" aria-label={`${count} registros`}>{count}<\/span>}\n      <ChevronDown className=\"bz28-acc-chevron w-4 h-4\" aria-hidden=\"true\" />\n    <\/button><\/div>\n    <div id={`${id}-panel`} role=\"region\" aria-labelledby={`${id}-btn`} className=\"bz28-acc-panel\" inert={open ? undefined : 'true'}><div className=\"bz28-acc-inner\"><div className=\"bz28-acc-body\">{children}<\/div><\/div><\/div>\n  <\/section>;\n}\n\nfunction ArtistPromoRequestsViewV2({ requests, releases, removals = [], onCancel, onRequestRemoval = () => false }) {\n  const [cancelRequestId, setCancelRequestId] = useState(null);\n  const [removalTargetId, setRemovalTargetId] = useState(null);\n  const [removalReason, setRemovalReason] = useState('');\n  const [openSections, setOpenSections] = useState({ recent: true, previous: false, all: false });\n  const cancelTarget = requests.find(request => request.id === cancelRequestId);\n  const removalTarget = requests.find(request => request.id === removalTargetId);\n  const now = new Date();\n  const buckets = promoPeriodBuckets(requests, now);\n  const previousLabel = new Date(now.getFullYear(), now.getMonth() - 1, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });\n  const toggle = ock text-[11px] font-semibold text-zinc-300\">Sección de destino<select required={!allowNone} value={value} onChange={event => onChange(event.target.value)} className=\"bmk-input mt-1 block w-full px-3 py-2.5 rounded-lg bg-[#0A0A0D] border border-white/10 text-xs text-white\">{allowNone ? <option value=\"\">Sin destino específico<\/option> : <option value=\"\" disabled>Selecciona una sección<\/option>}{options.map(item => <option key={item.id} value={item.id} disabled={!item.available}>{item.label}{item.available ? '' : ' — no disponible para todos los destinatarios'}<\/option>)}<\/select><\/label>\n    <p className=\"text-[10px] text-zinc-500\">Secciones de {forMarketing ? 'Marketing Staff' : 'artistas'}. El botón «Abrir sección» de la notificación llevará aquí.{forMarketing ? '' : ' Regalías solo aparece disponible si todos los destinatarios tienen esa sección habilitada.'}<\/p>\n    {selected && !selected.available && <p role=\"alert\" className=\"text-[10px] text-amber-200\">«{selected.label}» no está disponible para: {selected.blockedNames.join(', ')}. Selecciona destinatarios compatibles u otra sección.<\/p>}\n  <\/div>;\n}\n\nfunction ManualAnnouncementComposerView({ users, onCreate, onNavigate }) {\n  const [title, setTitle] = useState('');\n  const [message, setMessage] = useState('');\n  const [audience, setAudience] = useState('all');\n  const [recipientIds, setRecipientIds] = useState([]);\n  const [destinationId, setDestinationId] = useState('');\n  const changeAudience = next => { if (announcementRole(next) !== announcementRole(audience)) { setRecipientIds([]); setDestinationId(''); } setAudience(next); };\n  const submit = event => { event.preventDefault(); const targets = resolveAnnouncementRecipients({ users }, audience, recipientIds); if (onCreate({ title, message, audience, recipientIds: targets, destinationId })) { setTitle(''); setMessage(''); setAudience('all'); setRecipientIds([]); setDestinationId(''); } };\n  return <div className=\"bmk max-w-3xl mx-auto space-y-5 animate-fade-in\"><NotificationAdminTabs active=\"admin-notificaciones-create\" onNavigate={onNavigate} /><header><p className=\"text-[10px] font-bold uppercase tracking-[.18em] text-[#B69AFF]\">Sistema<\/p><h1 className=\"text-2xl sm:text-[26px] font-extrabold text-white\">Crear notificación<\/h1><p className=\"text-xs text-[#8E8E9E] mt-1\">Publica un anuncio manual en el centro de notificaciones de artistas o de Marketing Staff.<\/p><\/header><form onSubmit={submit} className=\"bmk-surface p-5 sm:p-6 rounded-2xl space-y-4\"><label className=\"block text-[11px] font-semibold text-zinc-300\">Título<input required maxLength={120} value={title} onChange={event => setTitle(event.target.value)} className=\"bmk-input mt-1 block w-full px-3 py-2.5 rounded-lg bg-[#0A0A0D] border border-white/10 text-xs text-white\" /><\/label><label className=\"block text-[11px] font-semibold text-zinc-300\">Mensaje<textarea required rows={5} maxLength={2000} value={message} onChange={event => setMessage(event.target.value)} className=\"bmk-input mt-1 block w-full px-3 py-2.5 rounded-lg bg-[#0A0A0D] border border-white/10 text-xs text-white resize-y\" /><\/label><div className=\"space-y-2\"><p className=\"text-[11px] font-semibold text-zinc-300\">Destinatarios<\/p><AnnouncementRecipientPicker users={users} audience={audience} setAudience={changeAudience} recipientIds={recipientIds} setRecipientIds={setRecipientIds} /><\/div><AnnouncementDestinationPicker users={users} audience={audience} recipientIds={recipientIds} value={destinationId} onChange={setDestinationId} allowNone={false} /><p className=\"text-[10px] text-zinc-500\">Los anuncios se guardan localmente en la demo. No se envía correo electrónico.<\/p><button className=\"bmk-btn px-4 py-2.5 rounded-lg bg-[#7138F5] text-xs font-bold text-white\">Publicar notificación<\/button><\/form><\/div>;\n}\n\nfunction ManualAnnouncementsManagerView({ users, announcements, notifications = [], onEdit, onNavigate }) {\n  const [editing, setEditing] = useState(null);\n  const [title, setTitle] = useState('');\n  const [message, setMessage] = useState('');\n  const [audience, setAudience] = useState('selected');\n  const [recipientIds, setRecipientIds] = useState([]);\n  const [destinationId, setDestinationId] = useState('');\n  const [search, setSearch] = useState('');\n  const copiesOf = id => notifications.filter(n => n && n.isManual && n.announcementId === id);\n  const nameOf = id => users.find(user => user.id === id)?.artisticName || id;\n  const startEdit = item => { const current = copiesOf(item.id).map(n => n.artistId); setEditing(item); setTitle(item.title || ''); setMessage(item.message || ''); setAudience(announcementAudience(item.audience)); setRecipientIds([...new Set(current.length ? current : (item.recipientIds || []))]); setDestinationId(item.destinationId || ''); };\n  const cancelEdit = () => { setEditing(null); setTitle(''); setMessage(''); setAudience('selected'); setRecipientIds([]); setDestinationId(''); };\n  const changeAudience = next => { if (announcementRole(next) !== announcementRole(audience)) { setRecipientIds([]); setDestinationId(''); } setAudience(next); };\n  const finalIds = resolveAnnouncementRecipients({ users }, audience, recipientIds);\n  const submitEdit = event => { event.preventDefault(); if (onEdit(editing.id, { title, message, audience, recipientIds: finalIds, destinationId })) cancelEdit(); };\n  const editingCopies = editing ? copiesOf(editing.id) : [];\n  const statusFor = (artistId, checked) => { const copy = editingCopies.find(n => n.artistId === artistId); if (copy && checked) return copy.read ? { label: 'Leído', className: 'bg-emerald-500/15 border-emerald-400/35 text-emerald-200' } : { label: 'No leído', className: 'bg-[#7138F5]/15 border-[#7138F5]/35 text-[#B69AFF]' }; if (copy && !checked) return { label: 'Se retirará', className: 'bg-red-500/15 border-red-400/35 text-red-200' }; if (!copy && checked) return { label: 'Nuevo · no leído', className: 'bg-sky-500/15 border-sky-400/35 text-sky-200' }; return null; };\n  const addedCount = finalIds.filter(id => !editingCopies.some(n => n.artistId === id)).length;\n  const removedCount = editingCopies.filter(n => !finalIds.includes(n.artistId)).length;\n  const manual = [...announcements].filter(item => item.isManual).filter(item => `${item.title || ''} ${item.message || ''}`.toLowerCase().includes(search.toLowerCase())).sort((a,b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));\n  return <div className=\"bmk max-w-5xl mx-auto space-y-5 animate-fade-in\"><NotificationAdminTabs active=\"admin-notificaciones-manage\" onNavigate={onNavigate} /><header><p className=\"text-[10px] font-bold uppercase tracking-[.18em] text-[#B69AFF]\">Sistema<\/p><h1 className=\"text-2xl sm:text-[26px] font-extrabold text-white\">Administrar notificaciones<\/h1><p className=\"text-xs text-[#8E8E9E] mt-1\">Solo se muestran anuncios manuales de Bersz; las notificaciones automáticas quedan fuera de esta lista.<\/p><\/header>\n    <label className=\"bmk-search relative block\"><Search className=\"w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-[#8E8E9E] pointer-events-none\" /><input value={search} onChange={event => setSearch(event.target.value)} placeholder=\"Buscar anuncio por título o mensaje\" aria-label=\"Buscar anuncios\" className=\"bmk-input w-full pl-9 pr-3.5 py-2.5 rounded-xl bg-[#1E1E24] border border-white/[0.08] text-xs text-white\" /><\/label>\n    {manual.length ? <div className=\"space-y-3\">{manual.map(item => { const copies = copiesOf(item.id); const readCount = copies.filter(n => n.read).length; const destination = notificationDestination(item.destinationId); return <article key={item.id} className=\"bmk-card bmk-card-soft p-5 rounded-2xl space-y-3\">\n      <div className=\"flex flex-wrap items-start justify-between gap-3\"><div className=\"min-w-0\"><div className=\"flex flex-wrap items-center gap-1.5\"><span className=\"px-2 p -[#8E8E9E]\">{announcements.some(item => item.isManual) ? 'No hay anuncios que coincidan con la búsqueda.' : 'No hay anuncios manuales registrados.'}<\/div>}\n    {editing && <div className=\"bmk-backdrop fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4\"><form onSubmit={submitEdit} className=\"bmk-modal w-full max-w-2xl max-h-[90vh] overflow-y-auto p-5 sm:p-6 rounded-2xl bg-[#1E1E24] border border-[#7138F5]/40 space-y-4\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"announcement-edit-title\"><div className=\"flex items-start justify-between gap-3\"><div><p className=\"text-[10px] font-bold uppercase tracking-wider text-[#B69AFF]\">Anuncio manual<\/p><h2 id=\"announcement-edit-title\" className=\"text-lg font-extrabold text-white mt-1\">Editar anuncio manual<\/h2><\/div><button type=\"button\" aria-label=\"Cerrar\" onClick={cancelEdit} className=\"p-1 text-zinc-400 hover:text-white\"><X className=\"w-5 h-5\" /><\/button><\/div><label className=\"block text-[11px] font-semibold text-zinc-300\">Título<input required maxLength={120} value={title} onChange={event => setTitle(event.target.value)} className=\"bmk-input mt-1 block w-full px-3 py-2.5 rounded-lg bg-[#0A0A0D] border border-white/10 text-xs text-white\" /><\/label><label className=\"block text-[11px] font-semibold text-zinc-300\">Mensaje<textarea required rows={4} maxLength={2000} value={message} onChange={event => setMessage(event.target.value)} className=\"bmk-input mt-1 block w-full px-3 py-2.5 rounded-lg bg-[#0A0A0D] border border-white/10 text-xs text-white resize-y\" /><\/label><div className=\"space-y-2\"><p className=\"text-[11px] font-semibold text-zinc-300\">Destinatarios<\/p><AnnouncementRecipientPicker users={users} audience={audience} setAudience={changeAudience} recipientIds={recipientIds} setRecipientIds={setRecipientIds} statusFor={statusFor} /><\/div><AnnouncementDestinationPicker users={users} audience={audience} recipientIds={recipientIds} value={destinationId} onChange={setDestinationId} allowNone={!editing.destinationId} /><p className=\"text-[10px] text-zinc-400\">Al guardar: {finalIds.length} destinatario(s){addedCount ? ` · ${addedCount} nuevo(s) lo recibirán como no leído` : ''}{removedCount ? ` · ${removedCount} dejará(n) de recibirlo` : ''}. Quienes se mantienen conservan su estado de lectura.<\/p><div className=\"flex flex-col-reverse sm:flex-row justify-end gap-2\"><button type=\"button\" onClick={cancelEdit} className=\"bmk-btn px-4 py-2.5 rounded-lg bg-[#0A0A0D] border border-white/10 text-xs\">Cancelar<\/button><button className=\"bmk-btn px-4 py-2.5 rounded-lg bg-[#7138F5] text-xs font-bold text-white\">Guardar cambios<\/button><\/div><\/form><\/div>}\n  <\/div>;\n}\n\nfunction SidebarButton({ icon: Icon, label, active, onClick, locked, badge }) {\n  return (\n    <button\n      onClick={onClick}\n      className={`group w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold tracking-tight transition-all duration-150 ${\n        active ? 'bg-[#7138F5] text-white shadow-[0_4px_16px_rgba(113,56,245,0.32)] ring-1 ring-white/15' : 'text-[#8E8E9E] hover:text-white hover:bg-[#1E1E24]'\n      }`}\n    >\n      <div className=\"flex items-center gap-3\">\n        <Icon className={`w-4 h-4 transition-colors duration-150 ${active ? 'text-white' : 'text-[#8E8E9E] group-hover:text-[#B69AFF]'}`} />\n        <span>{label}<\/span>\n      <\/div>\n      <div className=\"flex items-center gap-1.5\">\n        {badge > 0 && (\n          <span className={`px-1.5 py-0.5 text-[10px] font-bold rounded-full leading-none ${active ? 'bg-white text-[#7138F5]' : 'bg-[#7138F5] text-white shadow-sm shadow-[#7138F5]/40'}`}>\n            {badge}\n          <\/span>\n        )}\n        {locked && <Lock className=\"w-3.5 h-3.5 text-zinc-500 group-hover:text-zinc-400 transition-colors\" />}\n      <\/div>\n    <\/button>\n  );\n}\n\nfunction AdminDashboardView({ appData, onNavigate }) {\n  const
