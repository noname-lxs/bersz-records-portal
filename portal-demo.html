bg-[#0A0A0D] hover:bg-zinc-800 border border-[#2D2D35] hover:border-[#7138F5]/50 text-xs font-semibold text-[#B69AFF] flex items-center gap-1.5 transition-all duration-150\"\n                    >\n                      <Eye className=\"w-3.5 h-3.5\" />\n                      <span>{isSelected ? 'Ocultar ficha' : 'Ver ficha y catálogo'}<\/span>\n                    <\/button>\n                    <button\n                      onClick={() => openEditModal(art)}\n                      className=\"px-3.5 py-2 rounded-xl bg-[#0A0A0D] hover:bg-zinc-800 border border-[#2D2D35] text-xs font-semibold text-white flex items-center gap-1.5 transition-all duration-150\"\n                    >\n                      <Edit3 className=\"w-3.5 h-3.5\" />\n                      <span>Editar<\/span>\n                    <\/button>\n                    <button\n                      onClick={() => onToggleArtistPermission(art.id, 'active')}\n                      className={`px-3.5 py-2 rounded-xl border text-xs font-semibold transition-all duration-150 ${art.active ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300 hover:bg-emerald-500/25' : 'bg-red-500/15 border-red-500/40 text-red-300 hover:bg-red-500/25'}`}\n                    >\n                      {art.active ? 'Desactivar' : 'Activar'}\n                    <\/button>\n                    <button\n                      onClick={() => onToggleArtistPermission(art.id, 'royaltiesEnabled')}\n                      className={`px-3.5 py-2 rounded-xl border text-xs font-semibold flex items-center gap-1.5 transition-all duration-150 ${art.royaltiesEnabled ? 'bg-[#7138F5]/20 border-[#7138F5]/50 text-white' : 'bg-[#0A0A0D] border-[#2D2D35] text-[#8E8E9E] hover:text-white'}`}\n                    >\n                      {art.royaltiesEnabled ? <Unlock className=\"w-3.5 h-3.5 text-[#B69AFF]\" /> : <Lock className=\"w-3.5 h-3.5\" />}\n                      <span>Regalías: {art.royaltiesEnabled ? 'Habilitado' : 'Bloqueado'}<\/span>\n                    <\/button>\n                    <button\n                      onClick={() => onToggleArtistPermission(art.id, 'advancesEnabled')}\n                      className={`px-3.5 py-2 rounded-xl border text-xs font-semibold flex items-center gap-1.5 transition-all duration-150 ${art.advancesEnabled ? 'bg-[#7138F5]/20 border-[#7138F5]/50 text-white' : 'bg-[#0A0A0D] border-[#2D2D35] text-[#8E8E9E] hover:text-white'}`}\n                    >\n                      {art.advancesEnabled ? <Unlock className=\"w-3.5 h-3.5 text-[#B69AFF]\" /> : <Lock className=\"w-3.5 h-3.5\" />}\n                      <span>Adelantos: {art.advancesEnabled ? 'Habilitado' : 'Bloqueado'}<\/span>\n                    <\/button>\n                  <\/div>\n                <\/div>\n\n                {isSelected && inspectedArtist && (\n                  <div className=\"pt-4 border-t border-[#2D2D35] grid grid-cols-1 md:grid-cols-2 gap-4 animate-fade-in\">\n                    <div className=\"p-4 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] space-y-2 text-xs\">\n                      <p className=\"font-bold text-[#B69AFF] uppercase tracking-wider text-[10px]\">Información de Perfil<\/p>\n                      <p><span className=\"text-[#8E8E9E]\">ID Interno:<\/span> {inspectedArtist.id}<\/p>\n                      <p><span className=\"text-[#8E8E9E]\">Fecha de alta:<\/span> {inspectedArtist.joinedAt || '2026'}<\/p>\n                      <p><span className=\"text-[#8E8E9E]\">Nombre Legal:<\/span> {inspectedArtist.name}<\/p>\n                      <p><span className=\"text-[#8E8E9E]\">Género / Región:<\/span> {inspectedArtist.genre} ({inspectedArtist.country})<\/p>\n                    <\/div>\n                    <div className=\"p-4 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] space-y-2.5 text-xs\">\n                      <p className=\"font-bold text-[#B69AFF] uppercase tracking-wider text-[10px]\">Lanzamientos Asociados ({inspectedReleases.length})<\/p>\n                      {inspectedReleases.length === 0 ? (\n                        <p className=\"text-[#8E8E9E]\">Este artista aún no tiene lanzamientos registrados.<\/p>\n                      ) : (\n                        <div className=\"space-y-1.5\">\n                          {inspectedReleases.map(r => (\n                            <div key={r.id} className=\"flex items-center justify-between p-2.5 rounded-lg bg-[#1E1E24] border border-[#2D2D35]/60\">\n                              <span className=\"font-semibold text-white\">{r.title} <span className=\"text-[10px] font-mono text-[#8E8E9E]\">({r.refCode})<\/span><\/span>\n                              <span className={`text-[10px] px-2 py-0.5 rounded-full border ${STATUS_BADGE_STYLES[r.status] || ''}`}>{r.status}<\/span>\n                            <\/div>\n                          ))}\n                        <\/div>\n                      )}\n                    <\/div>\n                  <\/div>\n                )}\n              <\/div>\n            );\n          })}\n        <\/div>\n      )}\n    <\/div>\n  );\n}\n\nfunction BerszStoredCover({ cover, download = false }) {\n  const [original, setOriginal] = useState(null);\n  const [loading, setLoading] = useState(Boolean(cover?.imageId));\n  useEffect(() => {\n    let cancelled = false; let url = null;\n    setOriginal(null); setLoading(Boolean(cover?.imageId));\n    if (cover?.imageId) getWavFromVault(cover.imageId).then(record => {\n      if (cancelled) return;\n      if (record?.blob) { url = URL.createObjectURL(record.blob); setOriginal({ url, name: record.name || cover.name, size: record.blob.size }); }\n    }).catch(() => {}).finally(() => { if (!cancelled) setLoading(false); });\n    return () => { cancelled = true; if (url) URL.revokeObjectURL(url); };\n  }, [cover?.imageId]);\n  return <figure className=\"bersz-cover-detail\">\n    <div className=\"bersz-cover-frame\">{original ? <img src={original.url} alt=\"Portada del EP\" /> : <ImageIcon className=\"w-10 h-10\" />}<\/div>\n    <figcaption><strong>Portada del EP<\/strong><p>{cover?.name || 'Sin portada registrada'}<\/p>{cover && <p>{cover.width} × {cover.height} px<\/p>}\n      {loading ? <p>Consultando archivo original…<\/p> : cover && !original ? <p role=\"status\">Archivo original no disponible en este navegador.<\/p> : null}\n      {download && original && <a className=\"bersz-credit-add bersz-download-original\" href={original.url} download={original.name}><Download className=\"w-4 h-4\" /> Descargar portada original<\/a>}\n    <\/figcaption>\n  <\/figure>;\n}\nfunction BerszAudioAvailability({ track }) {\n  const [available, setAvailable] = useState(null);\n  useEffect(() => {\n    let cancelled = false; setAvailable(null);\n    if (!track.audioFile?.audioId) { setAvailable(false); return; }\n    inspectVaultAudio(track.audioFile).then(r => { if (!cancelled) setAvailable(r.status === 'missing' ? false : r.status); }).catch(() => { if (!cancelled) setAvailable(false); });\n    return () => { cancelled = true; };\n  }, [track.audioFile?.audioId]);\n  return <div className=\"bersz-audio-status\"><FileAudio className=\"w-5 h-5\" /><div><strong>{track.audioFile?.name || `Falta archivo WAV · ${track.version}`}<\/strong><p>{track.audioFile?.sizeMB || ''}{track.audioFile ? (available === null ? ' · Consultando disponibilidad…' : available === 'test' ? ' · Audio de prueba generado en el portal (no es un máster original)' : available ? ' · Archivo original disponible' : ' · Archivo original no disponible en este navegador: no hay audio para reproducir ni descargar') : 'Archivo obligatorio pendiente'}<\/p><\/div><\/div>;\n}\nfunction BerszMetadata({ track }) {\n  const list = value => Array.isArray(value) ? value.join(', ') : value;\n  const fields = [['Artista Principal', track.mainArtist], ['Colaboradores', list(track.collaborators)], ['Letra explícita', track.explicit], ['Compositores', list(track.composers)], ['Productores', list(track.producers)], ['Otros créditos', track.otherCredits], ['Observaciones para Bersz Records', track.notes]];\n  return <><dl className=\"bersz-data-grid\">{fields.filter(([,v]) => v !== undefined && v !== null && v !== '').map(([label,value]) => <div key={label}><dt>{label}<\/dt><dd>{value}<\/dd><\/div>)}<\/dl>\n    <div className=\"bersz-read-credits\">{[['mainArtists','Artistas principales'],['writers','Escritores / Compositores'],['performers','Intérpretes'],['production','Producción e Ingeniería']].map(([key,title]) => {\n      const entries = track.credits?.[key] || [];\n      return <section key={key}><h5>{title}<\/h5>{entries.length ? <ol>{entries.map((entry,i) => <li key={i}><span className=\"bersz-entry-number\">{i+1}<\/span><dl className=\"bersz-data-grid\">{[['Nombre artístico',entry.artisticName],['NOMBRE LEGAL',berszLegalName(entry)],['Nombre real',entry.firstName],['Apellido real',entry.lastName],['Rol',entry.role]].filter(([,v]) => v).map(([label,value]) => <div key={label}><dt>{label}<\/dt><dd>{value}<\/dd><\/div>)}<\/dl><\/li>)}<\/ol> : <p className=\"bersz-empty-data\">Sin entradas registradas<\/p>}<\/section>;\n    })}<\/div><BerszAudioAvailability track={track} /><\/>;\n}\nfunction BerszReleaseOverview({ release, downloadCover = false }) {\n  return <section className=\"bersz-release-overview\"><BerszStoredCover cover={release.coverArt} download={downloadCover} /><dl className=\"bersz-data-grid\">\n    <div><dt>Lanzamiento<\/dt><dd>{release.title}<\/dd><\/div>\n    <div><dt>Artistas principales<\/dt><dd>{(release.mainArtists || [release.mainArtist]).filter(Boolean).join(', ') || 'No registrado'}<\/dd><\/div>\n    <div><dt>Colaboradores generales<\/dt><dd>{release.collaborators?.join(', ') || 'Sin entradas registradas'}<\/dd><\/div>\n    <div><dt>Fecha de lanzamiento solicitada<\/dt><dd>{release.releaseDateMode === 'asap' ? 'Lo antes posible' : release.requestedReleaseDate || 'No registrada'}{release.requestedReleaseDate && <small>Solicitud del artista · no confirma programación<\/small>}<\/dd><\/div>\n    <div><dt>Versiones incluidas<\/dt><dd>{(release.tracks || []).map(t => t.version).join(' · ') || 'No registradas'}<\/dd><\/div>\n    {release.notes && <div><dt>Observaciones del artista<\/dt><dd>{release.notes}<\/dd><\/div>}\n  <\/dl><\/section>;\n}\n\nfunction AdminReleasesView({ releases, artists, onUpdateRelease, onTrashRelease, showToast }) {\n  const [search, setSearch] = useState('');\n  const [filterArtist, setFilterArtist] = useState('all');\n  const [filterStatus, setFilterStatus] = useState('all');\n  const [selectedReleaseId, setSelectedReleaseId] = useState(releases[0]?.id || null);\n  const [statusDraft, setStatusDraft] = useState('');\n  const [feedbackDraft, setFeedbackDraft] = useState('');\n  const [playingAudioUrl, setPlayingAudioUrl] = useState(null);\n  const [playingTrackTitle, setPlayingTrackTitle] = useState('');\n  const [playingIsTest, setPlayingIsTest] = useState(false);\n  const [confirmTrashId, setConfirmTrashId] = useState(null);\n\n  const filtered = useMemo(() => {\n    return releases.filter(rel => {\n      const matchesSearch =\n        rel.title?.toLowerCase().includes(search.toLowerCase()) ||\n        rel.refCode?.toLowerCase().includes(search.toLowerCase()) ||\n        rel.mainArtist?.toLowerCase().includes(search.toLowerCase());\n      const matchesArtist = filterArtist === 'all' || rel.artistId === filterArtist;\n      const matchesStatus = filterStatus === 'all' || rel.status === filterStatus;\n      return matchesSearch && matchesArtist && matchesStatus;\n    });\n  }, [releases, search, filterArtist, filterStatus]);\n\n  const activeRelease = useMemo(() => {\n    return releases.find(r => r.id === selectedReleaseId) || filtered[0] || null;\n  }, [releases, selectedReleaseId, filtered]);\n\n  useEffect(() => {\n    if (activeRelease) {\n      setStatusDraft(activeRelease.status);\n      setFeedbackDraft(activeRelease.adminFeedback || '');\n    }\n  }, [activeRelease?.id]);\n\n  const missingOriginalMessage = (track) => `El WAV original de «${track.title} (${track.version})» no está en la bóveda local de este navegador. No se reproduce ni se descarga ningún audio de sustitución.`;\n\n  const handlePlayWav = async (track) => {\n    try {\n      const { status, record } = await inspectVaultAudio(track.audioFile);\n      if (status === 'missing') { showToast(missingOriginalMessage(track), 'error'); return; }\n      if (status === 'test') showToast('Reproduciendo un audio de prueba generado en el portal. No es un máster original.');\n      if (playingAudioUrl) URL.revokeObjectURL(playingAudioUrl);\n      const url = URL.createObjectURL(record.blob);\n      setPlayingAudioUrl(url);\n      setPlayingIsTest(status === 'test');\n      setPlayingTrackTitle(`${track.title} (${track.version})`);\n    } catch (e) {\n      showToast('No se pudo cargar el archivo de audio de la bóveda local.', 'error');\n    }\n  };\n\n  const handleDownloadWav = async (track) => {\n    try {\n      const { status, record } = await inspectVaultAudio(track.audioFile);\n      if (status === 'missing') { showToast(missingOriginalMessage(track), 'error'); return; }\n      const isTest = status === 'test';\n      const fileName = isTest\n        ? testAudioDownloadName(track.audioFile?.name || `${track.title.replace(/\\s+/g, '_')}.wav`)\n        : (track.audioFile?.name || `${track.title.replace(/\\s+/g, '_')}.wav`);\n      const url = URL.createObjectURL(record.blob);\n      const a = document.createElement('a');\n      a.href = url;\n      a.download = fileName;\n      document.body.appendChild(a);\n      a.click();\n      document.body.removeChild(a);\n      URL.revokeObjectURL(url);\n      showToast(isTest ? `Descargando audio de prueba (no es un máster original): ${fileName}` : `Descargando ${fileName}`);\n    } catch (e) {\n      showToast('Error al descargar el archivo WAV.', 'error');\n    }\n  };\n\n  return (\n    <div className=\"bersz-admin-review max-w-7xl mx-auto space-y-6 animate-fade-in\">\n      <div>\n        <h1 className=\"text-2xl sm:text-[26px] font-extrabold tracking-tight text-white\">Gestión y Revisión de Lanzamientos<\/h1>\n        <p className=\"text-xs sm:text-[13px] text-[#8E8E9E] mt-1\">Inspecciona versiones, créditos, archivos WAV, cambia estados y envía observaciones al artista.<\/p>\n      <\/div>\n\n      {/* FILTERS */}\n      <div className=\"grid grid-cols-1 sm:grid-cols-3 gap-3\">\n        <div className=\"flex items-center gap-2.5 bg-[#1E1E24] border border-[#2D2D35] focus-within:border-[#7138F5] rounded-xl px-3.5 py-2.5 transition-colors duration-150\">\n          <Search className=\"w-4 h-4 text-[#8E8E9E] shrink-0\" />\n          <input\n            type=\"text\"\n            value={search}\n            onChange={e => setSearch(e.target.value)}\n            placeholder=\"Buscar por título, código o artista...\"\n            className=\"bersz-search-input bg-transparent text-xs text-white w-full focus:outline-none\"\n          />\n        <\/div>\n        <select\n          value={filterArtist}\n          onChange={e => setFilterArtist(e.target.value)}\n          className=\"px-3.5 py-2.5 rounded-xl bg-[#1E1E24] border border-[#2D2D35] text-xs text-white\"\n        >\n          <option value=\"all\">Todos los artistas<\/option>\n          {artists.map(a => <option key={a.id} value={a.id}>{a.artisticName}<\/option>)}\n        <\/select>\n        <select\n          value={filterStatus}\n          onChange={e => setFilterStatus(e.target.value)}\n          className=\"px-3.5 py-2.5 rounded-xl bg-[#1E1E24] border border-[#2D2D35] text-xs text-white\"\n        >\n          <option value=\"all\">Todos los estados<\/option>\n          {RELEASE_STATUSES.map(st => <option key={st} value={st}>{st}<\/option>)}\n        <\/select>\n      <\/div>\n\n      {playingAudioUrl && (\n        <div className=\"p-4 sm:p-5 rounded-2xl bg-[#1E1E24] border border-[#7138F5] shadow-[0_8px_30px_rgba(113,56,245,0.18)] flex flex-col sm:flex-row items-center justify-between gap-4 animate-fade-in\">\n          <div className=\"flex items-center gap-3.5\">\n            <FileAudio className=\"w-6 h-6 text-[#B69AFF] shrink-0\" />\n            <div>\n              <p className=\"text-xs font-bold text-white\">{playingIsTest ? 'Audio de prueba' : 'Reproductor Master WAV'}: {playingTrackTitle}<\/p>\n              <p className={`text-[10px] mt-0.5 ${playingIsTest ? 'text-amber-200' : 'text-[#8E8E9E]'}`}>{playingIsTest ? 'Generado en el portal para pruebas. No es el máster original del artista.' : 'Máster original cargado desde BerszAudioVaultDB (IndexedDB)'}<\/p>\n            <\/div>\n          <\/div>\n          <div className=\"flex items-center gap-3 w-full sm:w-auto\">\n            <audio controls autoPlay src={playingAudioUrl} className=\"h-9 w-full sm:w-64 rounded-lg\" />\n            <button onClick={() => setPlayingAudioUrl(null)} className=\"p-2 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-zinc-400 hover:text-white transition-colors\">\n              <X className=\"w-4 h-4\" />\n            <\/button>\n          <\/div>\n        <\/div>\n      )}\n\n      <div className=\"grid grid-cols-1 lg:grid-cols-12 gap-6\">\n        {/* RELEASE LIST */}\n        <div className=\"lg:col-span-4 space-y-3\">\n          {filtered.length === 0 ? (\n            <div className=\"p-8 rounded-2xl bg-[#1E1E24] border border-[#2D2D35] text-center text-xs text-[#8E8E9E]\">\n              No hay lanzamientos que coincidan con los filtros seleccionados.\n            <\/div>\n          ) : (\n            filtered.map(rel => {\n              const isSelected = activeRelease?.id === rel.id;\n              return (\n                <div\n                  key={rel.id}\n                  onClick={() => setSelectedReleaseId(rel.id)}\n                  className={`p-4 sm:p-5 rounded-2xl border cursor-pointer transition-all duration-150 ${\n                    isSelected ? 'bg-[#1E1E24] border-[#7138F5] ring-1 ring-[#7138F5]/30 shadow-[0_8px_24px_rgba(113,56,245,0.14)]' : 'bg-[#1E1E24]/80 border-[#2D2D35] hover:border-[#7138F5]/45 hover:bg-[#1E1E24]'\n                  }`}\n                >\n                  <div className=\"flex justify-between items-start gap-2\">\n                    <div>\n                      <div className=\"flex items-center gap-2\">\n                        <span className=\"text-[10px] font-mono font-semibold text-[#B69AFF]\">{rel.refCode}<\/span>\n                        {rel.isDemo && <span className=\"text-[9px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 font-semibold\">DEMO<\/span>}\n                      <\/div>\n                      <h3 className=\"text-sm font-bold text-white mt-1\">{rel.title}<\/h3>\n                      <p className=\"text-xs text-[#8E8E9E] mt-0.5\">{rel.mainArtist}<\/p>\n                    <\/div>\n                    <span className={`text-[10px] px-2.5 py-1 rounded-full border font-semibold ${STATUS_BADGE_STYLES[rel.status] || STATUS_BADGE_STYLES['Borrador']}`}>\n                      {rel.status}\n                    <\/span>\n                  <\/div>\n                  <div className=\"mt-3.5 pt-3 border-t border-[#2D2D35] flex justify-between text-[10px] text-zinc-400\">\n                    <span>{rel.tracks?.length || 1} pista(s)/versión(es)<\/span>\n                    <span className=\"font-mono\">Enviado: {rel.submittedAt}<\/span>\n                  <\/div>\n                <\/div>\n              );\n            })\n          )}\n        <\/div>\n\n        {/* RELEASE DETAIL & ADMIN CONTROLS */}\n        <div className=\"lg:col-span-8\">\n          {!activeRelease ? (\n            <div className=\"p-10 rounded-2xl bg-[#1E1E24] border border-[#2D2D35] text-center text-xs text-[#8E8E9E]\">\n              Selecciona un lanzamiento de la lista para inspeccionar sus pistas y cambiar su estado.\n            <\/div>\n          ) : (\n                <div className=\"bersz-admin-detail space-y-5\">\n              <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-[#2D2D35] pb-4\">\n                <div>\n                  <span className=\"text-xs font-mono font-semibold text-[#B69AFF]\">{activeRelease.refCode}<\/span>\n                  <h2 className=\"text-xl font-black tracking-tight text-white mt-0.5\">{activeRelease.title}<\/h2>\n                  <p className=\"text-xs text-[#8E8E9E] mt-1\">\n                    Artista principal: <strong className=\"text-white\">{activeRelease.mainArtist}<\/strong>\n                    {activeRelease.collaborators?.length > 0 && ` • Colaboradores: ${activeRelease.collaborators.join(', ')}`}\n                  <\/p>\n                <\/div>\n                <span className={`text-xs px-3 py-1 rounded-full border font-bold self-start ${STATUS_BADGE_STYLES[activeRelease.status] || ''}`}>\n                  {activeRelease.status}\n                <\/span>\n              <\/div>\n\n              {(activeRelease.statusHistory || []).length > 0 && <div className=\"p-3.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] space-y-1.5\"><h3 className=\"text-[10px] font-bold uppercase tracking-wider text-[#B69AFF]\">Historial de revisión<\/h3>{activeRelease.statusHistory.map((h,i)=><p key={i} className=\"text-[11px] text-zinc-400\">{h.date} • {h.actor}: <strong className=\"text-zinc-200\">{h.status}<\/strong>{h.comment?` — ${h.comment}`:''}<\/p>)}<\/div>}\n\n              <BerszReleaseOverview key={activeRelease.id} release={activeRelease} downloadCover />\n              {/* TRACKS / VERSIONS */}\n              <div className=\"space-y-3\">\n                <h3 className=\"text-xs font-bold uppercase tracking-wider text-[#B69AFF]\">\n                  Versiones y Pistas Entregadas ({activeRelease.tracks?.length || 0})\n                <\/h3>\n                {(activeRelease.tracks || []).map((t, idx) => (\n                  <div key={idx} className=\"p-4 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] space-y-3\">\n                    <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-2.5\">\n                      <div>\n                        <span className=\"text-[10px] px-2.5 py-0.5 rounded-md bg-[#7138F5]/20 text-[#B69AFF] font-semibold border border-[#7138F5]/35\">\n                          Versión: {t.version}\n                        <\/span>\n                        <h4 className=\"text-sm font-bold text-white mt-1.5\">{t.title}<\/h4>\n                      <\/div>\n                      <div className=\"flex items-center gap-2\">\n                        <button\n                          onClick={() => handlePlayWav(t)}\n                          className=\"px-3.5 py-2 rounded-xl bg-[#7138F5] hover:bg-[#6127e3] text-white text-xs font-bold flex items-center gap-1.5 shadow-sm shadow-[#7138F5]/25 transition-all duration-150\"\n                        >\n                          <Play className=\"w-3.5 h-3.5\" /> Escuchar\n                        <\/button>\n                        <button\n                          onClick={() => handleDownloadWav(t)}\n                          className=\"px-3.5 py-2 rounded-xl bg-[#1E1E24] hover:bg-zinc-800 border border-[#2D2D35] text-white text-xs font-semibold flex items-center gap-1.5 transition-all duration-150\"\n                        >\n                          <Download className=\"w-3.5 h-3.5\" /> Descargar WAV\n                        <\/button>\n                      <\/div>\n                    <\/div>\n                    <BerszMetadata track={t} />\n                  <\/div>\n                ))}\n              <\/div>\n\n              {/* ADMIN RESOLUTION */}\n              <section className=\"bz-dictamen\" aria-labelledby=\"bz-dictamen-title\" data-status={statusDraft}>\n                <header className=\"bz-dict-head\">\n                  <div className=\"min-w-0\">\n                    <p className=\"bz-dict-eyebrow\"><ShieldCheck className=\"w-3.5 h-3.5\" aria-hidden=\"true\" /> Revisión administrativa<\/p>\n                    <h3 id=\"bz-dictamen-title\" className=\"bz-dict-title\">Dictamen y Estado Administrativo<\/h3>\n                  <\/div>\n                  <div className=\"bz-dict-current\">\n                    <span className=\"bz-dict-current-label\">Estado guardado<\/span>\n                    <span className={`text-[10px] px-2.5 py-1 rounded-full border font-bold ${STATUS_BADGE_STYLES[activeRelease.status] || STATUS_BADGE_STYLES['Borrador']}`}>{activeRelease.status}<\/span>\n                  <\/div>\n                <\/header>\n                <div className=\"bz-dict-grid\">\n                  <div className=\"bz-dict-field\">\n                    <label htmlFor=\"bz-status-select\" className=\"bz-dict-label\">Cambiar Estado del Lanzamiento<\/label>\n                    <div className=\"bz-dict-select-wrap\">\n                      <span className=\"bz-dict-dot\" data-status={statusDraft} aria-hidden=\"true\" />\n                      <select\n                        id=\"bz-status-select\"\n                        value={statusDraft}\n                        onChange={e => setStatusDraft(e.target.value)}\n                        className=\"bz-dict-select\"\n                      >\n                        {RELEASE_STATUSES.map(st => <option key={st} value={st}>{st}<\/option>)}\n                      <\/select>\n                      <ChevronDown className=\"bz-dict-caret w-4 h-4\" aria-hidden=\"true\" />\n                    <\/div>\n                    <p key={statusDraft} className=\"bz-dict-hint\">{RELEASE_STATUS_DESCRIPTIONS[statusDraft] || ''}<\/p>\n                    {statusDraft !== activeRelease.status && <p className=\"bz-dict-pending\" role=\"status\">Cambio sin guardar: {activeRelease.status} → {statusDraft}<\/p>}\n                    {statusDraft === 'Disponible' && activeRelease.status !== 'Disponible' && <p className=\"bz-dict-note\">Registra «Disponible» solo cuando hayas confirmado que el lanzamiento está publicado en las plataformas. El portal no lo comprueba automáticamente.<\/p>}\n                  <\/div>\n                  <div className=\"bz-dict-field\">\n                    <span className=\"bz-dict-label\">Acciones rápidas<\/span>\n                    <div className=\"bz-dict-quick-row\">\n                      <button\n                        type=\"button\"\n                        onClick={() => { setStatusDraft('Aprobado'); onUpdateRelease(activeRelease.id, 'Aprobado', feedbackDraft || 'Lanzamiento aprobado por dirección.'); }}\n                        className=\"bz-abtn bz-abtn-success\"\n                      >\n                        <CheckCircle2 className=\"w-4 h-4\" aria-hidden=\"true\" /> Aprobar rápido\n                      <\/button>\n                      <button\n                        type=\"button\"\n                        onClick={() => { setStatusDraft('Cambios solicitados'); onUpdateRelease(activeRelease.id, 'Cambios solicitados', feedbackDraft || 'Por favor revisa los créditos o el master WAV.'); }}\n                        className=\"bz-abtn bz-abtn-warn\"\n                      >\n                        <Edit3 className=\"w-4 h-4\" aria-hidden=\"true\" /> Solicitar cambios\n                      <\/button>\n                    <\/div>\n                    <p className=\"bz-dict-hint\">Guardan el estado al momento y notifican al artista con las observaciones escritas.<\/p>\n                  <\/div>\n                <\/div>\n                <div className=\"bz-dict-field\">\n                  <label htmlFor=\"bz-feedback-text\" className=\"bz-dict-label\">Observaciones privadas / Motivo para el artista<\/label>\n                  <textarea\n                    id=\"bz-feedback-text\"\n                    rows={3}\n                    value={feedbackDraft}\n                    onChange={e => setFeedbackDraft(e.target.value)}\n                    placeholder=\"Escribe comentarios sobre el master, créditos o motivo de rechazo/cambios...\"\n                    className=\"bz-dict-textarea\"\n                  />\n                <\/div>\n                <footer className=\"bz-dict-actions\">\n                  <button\n                    type=\"button\"\n                    onClick={() => setConfirmTrashId(activeRelease.id)}\n                    className=\"bz-abtn bz-abtn-danger\"\n                  ><Trash2 className=\"w-4 h-4\" aria-hidden=\"true\" /> Enviar a la papelera<\/button>\n                  <button\n                    type=\"button\"\n                    onClick={() => onUpdateRelease(activeRelease.id, statusDraft, feedbackDraft)}\n                    className=\"bz-abtn bz-abtn-primary\"\n                  ><Bell className=\"w-4 h-4\" aria-hidden=\"true\" /> Guardar estado y notificar al artista<\/button>\n                <\/footer>\n              <\/section>\n            <\/div>\n          )}\n        <\/div>\n      <\/div>\n      {confirmTrashId && (\n        <div className=\"fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 animate-modal-backdrop\" role=\"dialog\" aria-modal=\"true\">\n          <div className=\"w-full max-w-sm p-6 rounded-2xl bg-[#1E1E24] border border-[#2D2D35] shadow-2xl space-y-5 animate-modal-panel\">\n            <h2 className=\"text-base font-bold text-white\">¿Enviar este lanzamiento a la papelera?<\/h2>\n            <p className=\"text-xs text-zinc-400 leading-relaxed\">Se retirará de las colas activas; el propietario podrá restaurarlo o eliminarlo definitivamente.<\/p>\n            <div className=\"flex justify-end gap-2.5\">\n              <button onClick={() => setConfirmTrashId(null)} className=\"px-4 py-2 rounded-xl bg-[#0A0A0D] hover:bg-zinc-800 border border-[#2D2D35] text-xs font-bold text-white transition-colors\">Cancelar<\/button>\n              <button onClick={() => { const id = confirmTrashId; setConfirmTrashId(null); onTrashRelease(id); }} className=\"px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-xs font-bold text-white transition-colors\">Enviar a la papelera<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n      )}\n    <\/div>\n  );\n}\n\nfunction AdminReleaseTrashView({ releases, onRestore, onDelete, showToast }) {\n  const [selectedIds, setSelectedIds] = useState([]);\n  const [confirmAction, setConfirmAction] = useState(null);\n  const toggle = (id) => setSelectedIds(prev => {\n    if (prev.includes(id)) return prev.filter(x => x !== id);\n    if (prev.length >= 5) { showToast('Puedes seleccionar como máximo cinco lanzamientos por operación.', 'error'); return prev; }\n    return [...prev, id];\n  });\n  const runConfirmed = () => {\n    if (confirmAction?.kind === 'all') onDelete([], true);\n    if (confirmAction?.kind === 'selected') { onDelete(selectedIds); setSelectedIds([]); }\n    if (confirmAction?.kind === 'one') onDelete([confirmAction.id]);\n    setConfirmAction(null);\n  };\n  return (\n    <div className=\"max-w-7xl mx-auto space-y-6 animate-fade-in\">\n      <div className=\"flex flex-col md:flex-row md:items-end justify-between gap-3\">\n        <div><h1 className=\"text-2xl sm:text-[26px] font-extrabold tracking-tight text-white\">Papelera privada de lanzamientos<\/h1><p className=\"text-xs sm:text-[13px] text-[#8E8E9E] mt-1\">Acceso exclusivo de la cuenta propietaria. Restaurar conserva el estado e historial originales.<\/p><\/div>\n        <div className=\"flex flex-wrap gap-2.5\">\n          <button disabled={!selectedIds.length} onClick={() => setConfirmAction({ kind: 'selected' })} className=\"px-3.5 py-2 rounded-xl bg-red-500/15 hover:bg-red-500/25 border border-red-500/40 text-red-300 text-xs font-bold disabled:opacity-40 transition-all\">Borrar seleccionados ({selectedIds.length}/5)<\/button>\n          <button disabled={!releases.length} onClick={() => setConfirmAction({ kind: 'all' })} className=\"px-3.5 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold disabled:opacity-40 transition-all\">Vaciar papelera<\/button>\n        <\/div>\n      <\/div>\n      {releases.length === 0 ? <div className=\"p-10 rounded-2xl bg-[#1E1E24] border border-[#2D2D35] text-center text-xs text-zinc-400\">La papelera está vacía.<\/div> : (\n        <div className=\"space-y-3\">{releases.map(rel => (\n          <div key={rel.id} className=\"p-5 rounded-2xl bg-[#1E1E24] border border-[#2D2D35] hover:border-[#3A3A46] transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3\">\n            <div className=\"flex items-start gap-3.5\"><input type=\"checkbox\" checked={selectedIds.includes(rel.id)} onChange={() => toggle(rel.id)} aria-label={`Seleccionar ${rel.title}`} className=\"mt-1 rounded accent-[#7138F5]\" /><div><span className=\"text-[10px] font-mono font-semibold text-[#B69AFF]\">{rel.refCode}<\/span><h3 className=\"text-sm font-bold text-white mt-0.5\">{rel.title}<\/h3><p className=\"text-[11px] text-zinc-400 mt-0.5\">{rel.mainArtist} • Enviado a papelera por {rel.trashMeta?.actor || 'administración'} el {rel.trashMeta?.trashedAt || '—'}<\/p><p className=\"text-[10px] text-zinc-500 mt-0.5\">Estado conservado: {rel.status} • {(rel.tracks || []).length} versión(es)<\/p><\/div><\/div>\n            <div className=\"flex gap-2\"><button onClick={() => onRestore(rel.id)} className=\"px-3.5 py-2 rounded-xl bg-[#7138F5] hover:bg-[#6127e3] text-white text-xs font-bold transition-all\">Sacar un lanzamiento<\/button><button onClick={() => setConfirmAction({ kind: 'one', id: rel.id })} className=\"px-3.5 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold transition-all\">Borrar un lanzamiento<\/button><\/div>\n          <\/div>\n        ))}<\/div>\n      )}\n      {confirmAction && <div className=\"fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 animate-modal-backdrop\" role=\"dialog\" aria-modal=\"true\"><div className=\"w-full max-w-sm p-6 rounded-2xl bg-[#1E1E24] border border-red-500/40 shadow-2xl space-y-4 animate-modal-panel\"><h2 className=\"text-base font-bold text-white\">Confirmar eliminación definitiva<\/h2><p className=\"text-xs text-zinc-300 leading-relaxed\">{confirmAction.kind === 'all' ? 'Se eliminarán todos los lanzamientos de la papelera.' : confirmAction.kind === 'selected' ? `Se eliminarán definitivamente ${selectedIds.length} lanzamiento(s).` : 'Se eliminará definitivamente este lanzamiento.'} Esta acción no se puede deshacer.<\/p><div className=\"flex justify-end gap-2.5\"><button onClick={() => setConfirmAction(null)} className=\"px-4 py-2 rounded-xl bg-[#0A0A0D] hover:bg-zinc-800 border border-[#2D2D35] text-white text-xs font-bold transition-colors\">Cancelar<\/button><button onClick={runConfirmed} className=\"px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold transition-colors\">Eliminar definitivamente<\/button><\/div><\/div><\/div>}\n    <\/div>\n  );\n}\n\nfunction AdminAnalyticsManagerView({ artists, analyticsMap, publishedIndicators, onSaveArtistAnalytics, onSaveIndicator, onDeleteIndicator }) {\n  const [selectedArtistId, setSelectedArtistId] = useState(artists[0]?.id || '');\n  const currentMetrics = analyticsMap[selectedArtistId] || {\n    spotifyStreams: null,\n    otherPlatformsStreams: null,\n    tiktokSoundUses: null,\n    tiktokPromoViews: null,\n    tiktokViews: null,\n    lastUpdated: 'Sin actualizar'\n  };\n\n  const [spotifyStreams, setSpotifyStreams] = useState(currentMetrics.spotifyStreams);\n  const [otherPlatformsStreams, setOtherPlatformsStreams] = useState(currentMetrics.otherPlatformsStreams);\n  const [tiktokSoundUses, setTiktokSoundUses] = useState(currentMetrics.tiktokSoundUses);\n  const [tiktokPromoViews, setTiktokPromoViews] = useState(currentMetrics.tiktokPromoViews);\n  const [tiktokViews, setTiktokViews] = useState(currentMetrics.tiktokViews ?? '');\n\n  useEffect(() => {\n    const m = analyticsMap[selectedArtistId] || { spotifyStreams: null, otherPlatformsStreams: null, tiktokSoundUses: null, tiktokPromoViews: null, tiktokViews: null };\n    setSpotifyStreams(m.spotifyStreams);\n    setOtherPlatformsStreams(m.otherPlatformsStreams);\n    setTiktokSoundUses(m.tiktokSoundUses);\n    setTiktokPromoViews(m.tiktokPromoViews);\n    setTiktokViews(m.tiktokViews ?? '');\n  }, [selectedArtistId, analyticsMap]);\n\n  const [indId, setIndId] = useState(null);\n  const [indName, setIndName] = useState('');\n  const [indCategory, setIndCategory] = useState('Reproducciones');\n  const [indValue, setIndValue] = useState('');\n  const [indDescription, setIndDescription] = useState('');\n  const [indScope, setIndScope] = useState('general');\n  const [confirmDeleteId, setConfirmDeleteId] = useState(null);\n\n  const handleMetricsSubmit = (e) => {\n    e.preventDefault();\n    if (!selectedArtistId) return;\n    onSaveArtistAnalytics(selectedArtistId, {\n      spotifyStreams: spotifyStreams === '' || spotifyStreams == null ? null : Number(spotifyStreams),\n      otherPlatformsStreams: otherPlatformsStreams === '' || otherPlatformsStreams == null ? null : Number(otherPlatformsStreams),\n      tiktokSoundUses: tiktokSoundUses === '' || tiktokSoundUses == null ? null : Number(tiktokSoundUses),\n      tiktokPromoViews: tiktokPromoViews === '' || tiktokPromoViews == null ? null : Number(tiktokPromoViews),\n      tiktokViews: tiktokViews === '' ? null : Number(tiktokViews),\n      isDemo: false\n    });\n  };\n\n  const handleIndicatorSubmit = (e) => {\n    e.preventDefault();\n    if (!indName.trim() || !indValue.trim()) return;\n    onSaveIndicator({\n      id: indId,\n      name: indName.trim(),\n      category: indCategory,\n      value: indValue.trim(),\n      description: indDescription.trim(),\n      scope: indScope,\n      isDemo: false\n    }, Boolean(indId));\n    setIndId(null);\n    setIndName('');\n    setIndValue('');\n    setIndDescription('');\n    setIndScope('general');\n  };\n\n  const startEditIndicator = (ind) => {\n    s seState(false);\n  const [confirmDeleteId, setConfirmDeleteId] = useState(null);\n\n  const handleSubmit = (e) => {\n    e.preventDefault();\n    if (!songTitle.trim() || !isValidTikTokUrl(tiktokUrl)) { showToast('Completa la canción y un enlace válido de TikTok.', 'error'); return; }\n    const art = artists.find(a => a.id === artistId);\n    onSavePromo({\n      id: editingId,\n      songTitle: songTitle.trim(),\n      artistId,\n      artistName: art?.artisticName || 'Bersz Artist',\n      tiktokUrl: tiktokUrl.trim(),\n      creatorHandle: creatorHandle.trim(),\n      thumbnailUrl: thumbnailUrl.trim(),\n      publishedDate,\n      campaignTag: campaignTag.trim(),\n      classification,\n      featured,\n      isDemo: false\n    }, Boolean(editingId));\n    resetForm();\n  };\n\n  const resetForm = () => {\n    setEditingId(null);\n    setSongTitle('');\n    setTiktokUrl('');\n    setCreatorHandle('');\n    setThumbnailUrl('');\n    setPublishedDate('');\n    setCampaignTag('');\n    setClassification('');\n    setFeatured(false);\n  };\n\n  const startEdit = (p) => {\n    setEditingId(p.id);\n    setSongTitle(p.songTitle);\n    setArtistId(p.artistId);\n    setTiktokUrl(p.tiktokUrl);\n    setCreatorHandle(p.creatorHandle || '');\n    setThumbnailUrl(p.thumbnailUrl || '');\n    setPublishedDate(p.publishedDate || '');\n    setCampaignTag(p.campaignTag || '');\n    setClassification(p.classification || '');\n    setFeatured(Boolean(p.featured));\n  };\n\n  return (\n    <div className=\"max-w-7xl mx-auto space-y-8 animate-fade-in\">\n      <div>\n        <h1 className=\"text-2xl sm:text-[26px] font-extrabold tracking-tight text-white\">Gestionar Promoción en TikTok<\/h1>\n        <p className=\"text-xs sm:text-[13px] text-[#8E8E9E] mt-1\">Añade enlaces oficiales de TikTok, asocia canciones del catálogo y destaca campañas activas.<\/p>\n      <\/div>\n\n      <div className=\"grid grid-cols-1 lg:grid-cols-12 gap-6\">\n        <div className=\"lg:col-span-5 p-6 rounded-2xl bg-[#1E1E24] border border-[#2D2D35] shadow-lg space-y-4\">\n          <h2 className=\"text-base font-bold text-white\">{editingId ? 'Editar Video Promocional' : 'Añadir Video de TikTok'}<\/h2>\n          <form onSubmit={handleSubmit} className=\"space-y-3.5\">\n            <div>\n              <label className=\"block text-xs font-bold text-white mb-1.5\">Nombre de la canción / versión *<\/label>\n              <input\n                type=\"text\"\n                value={songTitle}\n                onChange={e => setSongTitle(e.target.value)}\n                placeholder=\"Ej. NO SIGNAL FUNK (Super Slowed)\"\n                className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\"\n                required\n              />\n            <\/div>\n            <div>\n              <label className=\"block text-xs font-bold text-white mb-1.5\">Artista del sello *<\/label>\n              <select\n                value={artistId}\n                onChange={e => setArtistId(e.target.value)}\n                className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\"\n              >\n                {artists.map(a => <option key={a.id} value={a.id}>{a.artisticName}<\/option>)}\n              <\/select>\n            <\/div>\n            <div>\n              <label className=\"block text-xs font-bold text-white mb-1.5\">Enlace del video en TikTok *<\/label>\n              <input\n                type=\"url\"\n                value={tiktokUrl}\n                onChange={e => setTiktokUrl(e.target.value)}\n                placeholder=\"https://www.tiktok.com/@usuario/video/...\"\n                className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\"\n                required\n              />\n            <\/div>\n            <div className=\"grid grid-cols-2 gap-3\">\n              <div>\n                <label className=\"block text-x -audio\">VIDEO VIRAL CON EL AUDIO<\/option>\n              <\/select>\n            <\/div>\n            <div>\n              <label className=\"block text-xs font-bold text-white mb-1.5\">Etiqueta de campaña<\/label>\n              <input\n                type=\"text\"\n                value={campaignTag}\n                onChange={e => setCampaignTag(e.target.value)}\n                placeholder=\"Ej. Campaña Oficial / Viral Edit\"\n                className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\"\n              />\n            <\/div>\n            <label className=\"flex items-center gap-2.5 text-xs text-zinc-300 cursor-pointer pt-1\">\n              <input type=\"checkbox\" checked={featured} onChange={e => setFeatured(e.target.checked)} className=\"rounded accent-[#7138F5]\" />\n              <span>Marcar publicación como Destacada<\/span>\n            <\/label>\n            <div className=\"flex justify-end gap-2.5 pt-2\">\n              {editingId && (\n                <button type=\"button\" onClick={resetForm} className=\"px-4 py-2 rounded-xl bg-[#0A0A0D] hover:bg-zinc-800 border border-[#2D2D35] text-xs font-semibold text-zinc-300 transition-colors\">Cancelar<\/button>\n              )}\n              <button type=\"submit\" className=\"px-5 py-2.5 rounded-xl bg-[#7138F5] hover:bg-[#6127e3] text-white text-xs font-bold shadow-md shadow-[#7138F5]/25 transition-all\">\n                {editingId ? 'Guardar cambios' : 'Publicar en galería'}\n              <\/button>\n            <\/div>\n          <\/form>\n        <\/div>\n\n        <div className=\"lg:col-span-7 space-y-4\">\n          <TikTokPromoGalleryView\n            promos={promos}\n            artists={artists}\n            isAdmin={true}\n            onEdit={startEdit}\n            onDelete={(id) => {\n              if (confirmDeleteId === id) {\n                onDeletePromo(id);\n                setConfirmDeleteId(null);\n              } else {\n                setConfirmDeleteId(id);\n              }\n            }}\n            confirmDeleteId={confirmDeleteId}\n          />\n        <\/div>\n      <\/div>\n    <\/div>\n  );\n}\n\nfunction AdminRoyaltiesView({ artists, royalties, advances, auditLog, onTogglePermission, onSaveRoyalty, onSaveAdvance, onAddAdvanceDiscount }) {\n  const [subTab, setSubTab] = useState('regalias');\n  const [filterArtist, setFilterArtist] = useState('all');\n\n  // Royalty Form\n  const [editingRoyaltyId, setEditingRoyaltyId] = useState(null);\n  const [royArtistId, setRoyArtistId] = useState(artists[0]?.id || '');\n  const [royAmount, setRoyAmount] = useState('');\n  const [royCurrency, setRoyCurrency] = useState('USD');\n  const [royDate, setRoyDate] = useState(new Date().toISOString().slice(0, 10));\n  const [royPeriod, setRoyPeriod] = useState('Q4 2026');\n  const [royStatus, setRoyStatus] = useState('Pendiente');\n  const [royRef, setRoyRef] = useState('');\n\n  // Advance Form\n  const [advArtistId, setAdvArtistId] = useState(artists[0]?.id || '');\n  const [advAmount, setAdvAmount] = useState('');\n  const [advCurrency, setAdvCurrency] = useState('USD');\n  const [advDate, setAdvDate] = useState(new Date().toISOString().slice(0, 10));\n  const [advNotes, setAdvNotes] = useState('');\n  const [discountInputs, setDiscountInputs] = useState({});\n\n  const handleRoyaltySubmit = (e) => {\n    e.preventDefault();\n    if (!royArtistId || !royAmount) return;\n    onSaveRoyalty({\n      id: editingRoyaltyId,\n      artistId: royArtistId,\n      amount: Number(royAmount),\n      currency: royCurrency,\n      date: royDate,\n      period: royPeriod,\n      status: royStatus,\n      reference: royRef,\n      isDemo: false\n    }, Boolean(editingRoyaltyId));\n    setEditingRoyaltyId(null);\n    setRoyAmount('');\n    setRoyRef('');\n  };\n\n  const handleAdvanceSubmit = (e) => {\n    e.preventDefault();\n    if (!advArtistId || !advAmount) return;\n    onSaveAdvance({\n      artistId: advArtistId,\n      totalAmount: Number(advAmount),\n      currency: advCurrency,\n      date: advDate,\n      status: 'Activo',\n      notes: advNotes,\n      discounts: [],\n      isDemo: false\n    }, false);\n    setAdvAmount('');\n    setAdvNotes('');\n  };\n\n  const filteredRoyalties = royalties.filter(r => filterArtist === 'all' || r.artistId === filterArtist);\n  const filteredAdvances = advances.filter(a => filterArtist === 'all' || a.artistId === filterArtist);\n\n  return (\n    <div className=\"space-y-6 animate-fade-in\">\n      <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-1\">\n        <div>\n          <h1 className=\"text-2xl sm:text-[26px] font-extrabold tracking-tight text-white\">Gestión Financiera: Regalías y Adelantos<\/h1>\n          <p className=\"text-xs sm:text-[13px] text-[#8E8E9E] mt-1\">Controla el acceso individual por artista, registra pagos auditables y gestiona descuentos sobre anticipos.<\/p>\n        <\/div>\n        <div className=\"flex rounded-xl bg-[#1E1E24] p-1 border border-white/[0.08] self-start shadow-inner\">\n          <button\n            onClick={() => setSubTab('regalias')}\n            className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 ${subTab === 'regalias' ? 'bg-[#7138F5] text-white shadow-md shadow-[#7138F5]/25' : 'text-[#8E8E9E] hover:text-white'}`}\n          >\n            Regalías ({royalties.length})\n          <\/button>\n          <button\n            onClick={() => setSubTab('adelantos')}\n            className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 ${subTab === 'adelantos' ? 'bg-[#7138F5] text-white shadow-md shadow-[#7138F5]/25' : 'text-[#8E8E9E] hover:text-white'}`}\n          >\n            Adelantos ({advances.length})\n          <\/button>\n        <\/div>\n      <\/div>\n\n      {/* PERMISSIONS BAR */}\n      <div className=\"p-5 rounded-2xl bg-[#1E1E24]/90 border border-white/[0.07] shadow-[0_8px_30px_rgba(0,0,0,0.28)] space-y-3.5\">\n        <p className=\"text-[11px] font-bold text-[#B69AFF] uppercase tracking-wider\">Estado de Permisos Financieros por Artista<\/p>\n        <div className=\"grid grid-cols-1 md:grid-cols-2 gap-3\">\n          {artists.map(a => (\n            <div key={a.id} className=\"p-3.5 rounded-xl bg-[#0A0A0D]/90 border border-white/[0.07] hover:border-white/[0.14] transition-colors duration-200 flex items-center justify-between gap-2\">\n              <span className=\"text-xs font-bold text-white\">{a.artisticName}<\/span>\n              <div className=\"flex items-center gap-2\">\n                <button\n                  onClick={() => onTogglePermission(a.id, 'royaltiesEnabled')}\n                  className={`px-2.5 py-1 rounded-lg text-[10px] font-bold border transition-all duration-150 ${a.royaltiesEnabled ? 'bg-emerald-500/15 border-emerald-500/35 text-emerald-300 hover:bg-emerald-500/25' : 'bg-[#1E1E24] border-white/[0.08] text-zinc-400 hover:text-white'}`}\n                >\n                  Regalías: {a.royaltiesEnabled ? 'Abierto' : 'Bloqueado'}\n                <\/button>\n                <button\n                  onClick={() => onTogglePermission(a.id, 'advancesEnabled')}\n                  className={`px-2.5 py-1 rounded-lg text-[10px] font-bold border transition-all duration-150 ${a.advancesEnabled ? 'bg-[#7138F5]/20 border-[#7138F5]/40 text-[#B69AFF] hover:bg-[#7138F5]/30' : 'bg-[#1E1E24] border-white/[0.08] text-zinc-400 hover:text-white'}`}\n                >\n                  Adelantos: {a.advancesEnabled ? 'Abierto' : 'Bloqueado'}\n                <\/button>\n              <\/div>\n            <\/div>\n          ))}\n        <\/div>\n      <\/div>\n\n      {subTab === 'regalias' ? (\n        <div className=\"grid grid-cols-1 lg:grid-cols-12 gap-6\">\n          <div className=\"lg:col-span-5 p-6 rounded-2xl bg-[#1E1E24]/90 border border-white/[0.07] shadow-[0_8px_30px_rgba(0,0,0,0.28)] space-y-4\">\n            <h2 className=\"text-base font-bold text-white tracking-tight\">{editingRoyaltyId ? 'Editar Registro de Regalía' : 'Registrar Pago de Regalías'}<\/h2>\n            <form onSubmit={handleRoyaltySubmit} className=\"space-y-3.5\">\n              <div>\n                <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">Artista *<\/label>\n                <select value={royArtistId} onChange={e => setRoyArtistId(e.target.value)} className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\">\n                  {artists.map(a => <option key={a.id} value={a.id}>{a.artisticName}<\/option>)}\n                <\/select>\n              <\/div>\n              <div className=\"grid grid-cols-2 gap-3\">\n                <div>\n                  <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">Importe *<\/label>\n                  <input type=\"number\" step=\"0.01\" min=\"0\" value={royAmount} onChange={e => setRoyAmount(e.target.value)} placeholder=\"1500.00\" className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\" required />\n                <\/div>\n                <div>\n                  <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">Moneda<\/label>\n                  <select value={royCurrency} onChange={e => setRoyCurrency(e.target.value)} className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\">\n                    <option value=\"USD\">USD ($)<\/option>\n                    <option value=\"EUR\">EUR (€)<\/option>\n                    <option value=\"BRL\">BRL (R$)<\/option>\n                  <\/select>\n                <\/div>\n              <\/div>\n              <div className=\"grid grid-cols-2 gap-3\">\n                <div>\n                  <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">Período / Concepto *<\/label>\n                  <input type=\"text\" value={royPeriod} onChange={e => setRoyPeriod(e.target.value)} placeholder=\"Ej. Q4 2026\" className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\" required />\n                <\/div>\n                <div>\n                  <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">Fecha de pago<\/label>\n                  <input type=\"date\" value={royDate} onChange={e => setRoyDate(e.target.value)} className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\" />\n                <\/div>\n              <\/div>\n              <div>\n                <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">Estado del pago<\/label>\n                <select value={royStatus} onChange={e => setRoyStatus(e.target.value)} className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\">\n                  <option value=\"Pendiente\">Pendiente<\/option>\n                  <option value=\"Procesado\">Procesado<\/option>\n                  <option value=\"Pagado\">Pagado<\/option>\n                <\/select>\n              <\/div>\n              <div>\n                <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">Referencia / Observación administrativa<\/label>\n                <input type=\"text\" value={royRef} onChange={e => setRoyRef(e.target.value)} placeholder=\"Ej. PIX-88412 / Liquidación trimestral\" className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\" />\n              <\/div>\n              <div className=\"flex justify-end gap-2 pt-2\">\n                {editingRoyaltyId && (\n                  <button type=\"button\" onClick={() => { setEditingRoyaltyId(null); setRoyAmount(''); setRoyRef(''); }} className=\"px-4 py-2 rounded-xl bg-[#0A0A0D] border border-white/[0.08] hover:border-white/[0.15] text-xs text-zinc-300 transition-all duration-150\">Cancelar<\/button>\n                )}\n                <button type=\"submit\" className=\"px-5 py-2.5 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] active:scale-[0.99] text-white text-xs font-bold shadow-lg shadow-[#7138F5]/25 transition-all duration-150\">\n                  {editingRoyaltyId ? 'Actualizar registro' : 'Registrar regalía'}\n                <\/button>\n              <\/div>\n            <\/form>\n          <\/div>\n\n          <div className=\"lg:col-span-7 p-6 rounded-2xl bg-[#1E1E24]/90 border border-white/[0.07] shadow-[0_8px_30px_rgba(0,0,0,0.28)] space-y-4\">\n            <div className=\"flex items-center justify-between gap-3\">\n              <h2 className=\"text-base font-bold text-white tracking-tight\">Historial de Regalías<\/h2>\n              <select value={filterArtist} onChange={e => setFilterArtist(e.target.value)} className=\"px-3.5 py-2 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\">\n                <option value=\"all\">Todos los artistas<\/option>\n                {artists.map(a => <option key={a.id} value={a.id}>{a.artisticName}<\/option>)}\n              <\/select>\n            <\/div>\n            <div className=\"space-y-2.5\">\n              {filteredRoyalties.map(r => {\n                const art = artists.find(a => a.id === r.artistId);\n                return (\n                  <div key={r.id} className=\"p-4 rounded-xl bg-[#0A0A0D]/90 border border-white/[0.07] hover:border-white/[0.14] transition-colors duration-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3\">\n                    <div>\n                      <div className=\"flex items-center gap-2\">\n                        <span className=\"text-xs font-bold text-white\">{art?.artisticName || r.artistId}<\/span>\n                        <span className=\"text-[10px] text-[#B69AFF] font-mono bg-[#7138F5]/10 px-2 py-0.5 rounded-md border border-[#7138F5]/20\">{r.period}<\/span>\n                        {r.isDemo && <span className=\"text-[9px] px-1.5 py-0.5 rounded bg-amber-500/15 border border-amber-500/30 text-amber-300 font-semibold\">DEMO<\/span>}\n                      <\/div>\n                      <p className=\"text-base font-black text-white mt-1 tabular-nums\">{formatCurrency(r.amount, r.currency)}<\/p>\n                      <p className=\"text-[11px] text-[#8E8E9E] mt-0.5\">Fecha: {r.date} • Ref: {r.reference || 'N/A'}<\/p>\n                    <\/div>\n                    <div className=\"flex items-center gap-2\">\n                      <span className={`text-[10px] px-2.5 py-1 rounded-full font-bold border ${\n                        r.status === 'Pagado' ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30' :\n                        r.status === 'Procesado' ? 'bg-sky-500/15 text-sky-300 border-sky-500/30' :\n                        'bg-amber-500/15 text-amber-300 border-amber-500/30'\n                      }`}>\n                        {r.status}\n                      <\/span>\n                      <button\n                        onClick={() => {\n                          setEditingRoyaltyId(r.id);\n                          setRoyArtistId(r.artistId);\n                          setRoyAmount(r.amount);\n                          setRoyCurrency(r.currency || 'USD');\n                          setRoyDate(r.date);\n                          setRoyPeriod(r.period);\n                          setRoyStatus(r.status);\n                          setRoyRef(r.reference || '');\n                        }}\n                        className=\"p-2 rounded-lg bg-[#1E1E24] border border-white/[0.07] hover:border-[#7138F5]/40 hover:bg-[#7138F5]/15 text-white transition-all duration-150\"\n                      >\n                        <Edit3 className=\"w-3.5 h-3.5\" />\n                      <\/button>\n                    <\/div>\n                  <\/div>\n                );\n              })}\n            <\/div>\n          <\/div>\n        <\/div>\n      ) : (\n        <div className=\"grid grid-cols-1 lg:grid-cols-12 gap-6\">\n          <div className=\"lg:col-span-5 p-6 rounded-2xl bg-[#1E1E24]/90 border border-white/[0.07] shadow-[0_8px_30px_rgba(0,0,0,0.28)] space-y-4\">\n            <h2 className=\"text-base font-bold text-white tracking-tight\">Registrar Nuevo Adelanto<\/h2>\n            <form onSubmit={handleAdvanceSubmit} className=\"space-y-3.5\">\n              <div>\n                <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">Artista *<\/label>\n                <select value={advArtistId} onChange={e => setAdvArtistId(e.target.value)} className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\">\n                  {artists.map(a => <option key={a.id} value={a.id}>{a.artisticName}<\/option>)}\n                <\/select>\n              <\/div>\n              <div className=\"grid grid-cols-2 gap-3\">\n                <div>\n                  <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">Importe total adelantado *<\/label>\n                  <input type=\"number\" step=\"0.01\" min=\"1\" value={advAmount} onChange={e => setAdvAmount(e.target.value)} placeholder=\"3000.00\" className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\" required />\n                <\/div>\n                <div>\n                  <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">Moneda<\/label>\n                  <select value={advCurrency} onChange={e => setAdvCurrency(e.target.value)} className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\">\n                    <option value=\"USD\">USD<\/option>\n                    <option value=\"EUR\">EUR<\/option>\n                    <option value=\"BRL\">BRL<\/option>\n                  <\/select>\n                <\/div>\n              <\/div>\n              <div>\n                <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">Fecha de entrega<\/label>\n                <input type=\"date\" value={advDate} onChange={e => setAdvDate(e.target.value)} className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\" />\n              <\/div>\n              <div>\n                <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">Condiciones / Notas del acuerdo<\/label>\n                <textarea rows={2} value={advNotes} onChange={e => setAdvNotes(e.target.value)} placeholder=\"Recuperable al 50% de regalías trimestrales...\" className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\" />\n              <\/div>\n              <button type=\"submit\" className=\"w-full py-2.5 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] active:scale-[0.99] text-white text-xs font-bold shadow-lg shadow-[#7138F5]/25 transition-all duration-150\">\n                Crear registro de Adelanto\n              <\/button>\n            <\/form>\n          <\/div>\n\n          <div className=\"lg:col-span-7 space-y-4\">\n            {filteredAdvances.map(adv => {\n              const art = artists.find(a => a.id === adv.artistId);\n              const recouped = (adv.discounts || []).reduce((acc, d) => acc + Number(d.amount || 0), 0);\n              const pending = Math.max(0, Number(adv.totalAmount || 0) - recouped);\n              const inp = discountInputs[adv.id] || { amount: '', note: '' };\n\n              return (\n                <div key={adv.id} className=\"p-5 rounded-2xl bg-[#1E1E24]/90 border border-white/[0.07] shadow-[0_8px_30px_rgba(0,0,0,0.28)] space-y-4\">\n                  <div className=\"flex justify-between items-start gap-3\">\n                    <div>\n                      <span className=\"text-xs font-bold text-[#B69AFF]\">{art?.artisticName}<\/span>\n                      <h3 className=\"text-lg font-black text-white tracking-tight tabular-nums mt-0.5\">Adelanto: {formatCurrency(adv.totalAmount, adv.currency)}<\/h3>\n                      <p className=\"text-[11px] text-[#8E8E9E] mt-0.5\">Entregado: {adv.date} {adv.notes ? `• ${adv.notes}` : ''}<\/p>\n                    <\/div>\n                    <span className={`text-[10px] px-2.5 py-1 rounded-full font-bold border ${pending === 0 ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30' : 'bg-[#7138F5]/20 text-[#B69AFF] border-[#7138F5]/35'}`}>\n                      {pending === 0 ? 'Recuperado' : adv.status}\n                    <\/span>\n                  <\/div>\n\n                  <div className=\"grid grid-cols-3 gap-3 text-center\">\n                    <div className=\"p-3 rounded-xl bg-[#0A0A0D]/90 border border-white/[0.07]\">\n                      <p className=\"text-[10px] font-semibold uppercase tracking-wider text-[#8E8E9E]\">Total Adelantado<\/p>\n                      <p className=\"text-xs font-bold text-white mt-1 tabular-nums\">{formatCurrency(adv.totalAmount, adv.currency)}<\/p>\n                    <\/div>\n                    <div className=\"p-3 rounded-xl bg-[#0A0A0D]/90 border border-white/[0.07]\">\n                      <p className=\"text-[10px] font-semibold uppercase tracking-wider text-[#8E8E9E]\">Recuperado<\/p>\n                      <p className=\"text-xs font-bold text-emerald-400 mt-1 tabular-nums\">{formatCurrency(recouped, adv.currency)}<\/p>\n                    <\/div>\n                    <div className=\"p-3 rounded-xl bg-[#0A0A0D]/90 border border-white/[0.07]\">\n                      <p className=\"text-[10px] font-semibold uppercase tracking-wider text-[#8E8E9E]\">Saldo Pendiente<\/p>\n                      <p className=\"text-xs font-bold text-amber-300 mt-1 tabular-nums\">{formatCurrency(pending, adv.currency)}<\/p>\n                    <\/div>\n                  <\/div>\n\n                  <div className=\"space-y-1.5\">\n                    <p className=\"text-[11px] font-bold text-zinc-300\">Descuentos aplicados ({(adv.discounts || []).l                         amount: Math.min(pending, Number(inp.amount)),\n                            note: inp.note || 'Retención de regalías'\n                          });\n                          setDiscountInputs(prev => ({ ...prev, [adv.id]: { amount: '', note: '' } }));\n                        }}\n                        className=\"px-4 py-2 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] text-white text-xs font-bold shadow-md shadow-[#7138F5]/20 transition-all duration-150\"\n                      >\n                        Aplicar descuento\n                      <\/button>\n                    <\/div>\n                  )}\n                <\/div>\n              );\n            })}\n          <\/div>\n        <\/div>\n      )}\n    <\/div>\n  );\n}\n\nfunction AdminAdvanceRequestsView({ artists, accessRequests, moneyRequests, advances, onReviewAccessRequest, onReviewMoneyRequest, onUpdateAdvanceStage }) {\n  const [tab, setTab] = useState('access');\n  const [openId, setOpenId] = useState(null);\n  const [reasons, setReasons] = useState({});\n  const [amounts, setAmounts] = useState({});\n  const [observations, setObservations] = useState({});\n  const artistFor = id => artists.find(a => a.id === id);\n  const labels = ['ACEPTADO','EN PROCESO','ENVIADO','RECIBIDO'];\n  return <section className=\"space-y-5 p-6 rounded-2xl bg-[#1E1E24]/75 border border-white/[0.07] shadow-[0_8px_30px_rgba(0,0,0,0.28)]\"><div><h2 className=\"text-xl font-extrabold tracking-tight text-white\">Solicitudes de acceso y dinero<\/h2><p className=\"text-xs text-[#8E8E9E] mt-1\">Las aprobaciones de acceso y las aprobaciones de desembolso son decisiones distintas.<\/p><p className=\"text-[11px] text-amber-200/90 mt-2\">Demostración local: se registran las decisiones y etapas, pero no se procesan pagos reales.<\/p><\/div><div className=\"flex flex-wrap gap-2\"><button onClick={()=>setTab('access')} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all duration-150 ${tab==='access'?'bg-[#7138F5] text-white shadow-md shadow-[#7138F5]/25':'bg-[#0A0A0D] border border-white/[0.07] text-zinc-400 hover:text-white'}`}>Acceso al programa ({accessRequests.length})<\/button><button onClick={()=>setTab('money')} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all duration-150 ${tab==='money'?'bg-[#7138F5] text-white shadow-md shadow-[#7138F5]/25':'bg-[#0A0A0D] border border-white/[0.07] text-zinc-400 hover:text-white'}`}>Solicitudes de dinero ({moneyRequests.length})<\/button><\/div>\n    {tab==='access'?<div className=\"space-y-3\">{accessRequests.length===0?<p className=\"p-5 rounded-xl bg-[#0A0A0D]/80 border border-white/[0.06] text-xs text-[#8E8E9E]\">Todavía no hay solicitudes de acceso.<\/p>:accessRequests.map(r=>{const artist=artistFor(r.artistId);const open=openId===r.id;return <div key={r.id} className=\"p-4 rounded-xl bg-[#0A0A0D]/90 border border-white/[0.07] hover:border-white/[0.14] transition-colors duration-200 space-y-3\"><div className=\"flex flex-wrap justify-between items-center gap-2\"><div><p className=\"font-bold text-white text-sm\">{artist?.artisticName||r.artistId} • {r.id}<\/p><p className=\"text-[11px] text-[#8E8E9E] mt-0.5\">Cuenta: {artist?.email||'—'} • Enviada: {r.submittedAt}<\/p><\/div><span className={`text-[11px] px-2.5 py-0.5 rounded-full border font-bold ${r.status==='Rechazado'?'bg-red-500/15 border-red-500/30 text-red-300':r.status==='Aprobado'?'bg-emerald-500/15 border-emerald-500/30 text-emerald-300':'bg-amber-500/15 border-amber-500/30 text-amber-200'}`}>{r.status}<\/span><\/div><button onClick={()=>setOpenId(open?null:r.id)} className=\"text-xs font-bold text-[#B69AFF] hover:text-white transition-colors underline underline-offset-4\">{open?'Cerrar revisión':'Abrir y revisar solicitud'}<\/button>{open&&<><div className=\"grid sm:grid-cols-2 gap-2.5 text-xs\">{[['Nombre legal',r.legalName],['País',r.country],['18 años o más',r.isAdult?'Sí':'No'],['Gmail',r.gmail],['Documento',r.docType],['Archivos requeridos',Object.entries(r.documentFiles||{}).filter(([,v])=>v).map(([k,v])=>`${k}: ${v}`).join(' • ')||'Faltantes'],['Método de pago',r.paymentMethod],['Motivo',r.reason]].map(([k,v])=><div key={k} className=\"p-3 rounded-xl bg-[#1E1E24]/80 border border-white/[0.06]\"><span className=\"text-[11px] font-semibold text-[#8E8E9E]\">{k}<\/span><p className=\"mt-1 text-zinc-100 font-medium\">{v||'—'}<\/p><\/div>)}<\/div><p className=\"text-[11px] text-amber-200/90\">Los archivos no se almacenan; esta solicitud local contiene solo nombres seleccionados. No es una verificación de identidad.<\/p>{(r.history||[]).map((h,i)=><p key={i} className=\"text-[11px] text-zinc-400\">{h.date} • {h.actor}: {h.status}{h.reason?` — ${h.reason}`:''}<\/p>)}{r.status==='En revisión'&&<div className=\"space-y-2.5 pt-1\"><textarea value={reasons[r.id]||''} onChange={e=>setReasons(p=>({...p,[r.id]:e.target.value}))} rows={2} placeholder=\"Motivo obligatorio si rechazas la solicitud\" className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#1E1E24] border border-[#2D2D35] text-xs text-white\"/><div className=\"flex gap-2\"><button onClick={()=>onReviewAccessRequest(r.id,'Aprobado')} className=\"px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition-colors\">Aprobar acceso<\/button><button onClick={()=>onReviewAccessRequest(r.id,'Rechazado',reasons[r.id]||'')} className=\"px-3.5 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold transition-colors\">Rechazar solicitud<\/button><\/div><\/div>}{r.status==='Rechazado'&&<p className=\"p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-xs text-red-300\">Motivo: {r.rejectionReason}<\/p>}<\/>}<\/div>})}<\/div>:<div className=\"space-y-5\"><div className=\"space-y-3\">{moneyRequests.length===0?<p className=\"p-5 rounded-xl bg-[#0A0A0D]/80 border border-white/[0.06] text-xs text-[#8E8E9E]\">Todavía no hay solicitudes de dinero.<\/p>:moneyRequests.map(r=>{const artist=artistFor(r.artistId);const open=openId===r.id;return <div key={r.id} className=\"p-4 rounded-xl bg-[#0A0A0D]/90 border border-white/[0.07] hover:border-white/[0.14] transition-colors duration-200 space-y-3\"><div className=\"flex flex-wrap justify-between items-center gap-2\"><div><p className=\"font-bold text-white text-sm\">{artist?.artisticName||r.artistId} • {r.id}<\/p><p className=\"text-[11px] text-[#8E8E9E] mt-0.5\">{r.optionLabel} • {r.submittedAt} • {r.status}<\/p><\/div><strong className=\"text-sm font-black text-[#B69AFF] tabular-nums\">{r.requestedAmount?formatCurrency(r.requestedAmount,'USD'):'Importe por determinar'}<\/strong><\/div><button onClick={()=>setOpenId(open?null:r.id)} className=\"text-xs font-bold text-[#B69AFF] hover:text-white transition-colors underline underline-offset-4\">{open?'Cerrar revisión':'Abrir y revisar solicitud'}<\/button>{open&&<><p className=\"text-xs text-zinc-200\">Justificación: {r.reason||'No requerida para importe fijo'}<\/p><p className=\"text-[11px] text-[#8E8E9E]\">Método preferido: {(accessRequests.find(a=>a.artistId===r.artistId&&a.status==='Aprobado')||{}).paymentMethod||'—'} • Gmail: verificado en demostración local<\/p><p className=\"text-[11px] text-[#8E8E9E]\">Observaciones administrativas: {r.observations||'—'}<\/p>{(r.history||[]).map((h,i)=><p key={i} className=\"text-[11px] text-zinc-400\">{h.date} • {h.actor}: {h.status}{h.reason?` — ${h.reason}`:''}<\/p>)}{r.status==='En revisión'&&<div className=\"space-y-2.5 pt-1\"><label className=\"block text-xs font-bold text-zinc-200\">Importe a aprobar (USD; requerido para “Que Bersz decida”)<input type=\"number\" min=\"0.01\" step=\"0.01\" value={amounts[r.id]??r.requestedAmount??''} onChange={e=>setAmounts(p=>({...p,[r.id]:e.target.value}))} className=\"mt-1.5 w-full px-3.5 py-2.5 rounded-xl bg-[#1E1E24] border border-[#2D2D35] text-xs text-white font-normal\"/><\/label><textarea value={observations[r.id]||''} onChange={e=>setObservations(p=>({...p,[r.id]:e.target.value}))} rows={2} placeholder=\"Observaciones administrativas\" className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#1E1E24] border border-[#2D2D35] text-xs text-white\"/><textarea value={reasons[r.id]||''} onChange={e=>setReasons(p=>({...p,[r.id]:e.target.value}))} rows={2} placeholder=\"Motivo obligatorio si rechazas la solicitud\" className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#1E1E24] border border-[#2D2D35] text-xs text-white\"/><div className=\"flex gap-2\"><button onClick={()=>onReviewMoneyRequest(r.id,'Aprobado','',amounts[r.id]??r.requestedAmount,observations[r.id]||'')} className=\"px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition-colors\">Aprobar adelanto<\/button><button onClick={()=>onReviewMoneyRequest(r.id,'Rechazado',reasons[r.id]||'',null,observations[r.id]||'')} className=\"px-3.5 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold transition-colors\">Rechazar<\/button><\/div><\/div>}{r.status==='Rechazado'&&<p className=\"p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-xs text-red-300\">Motivo: {r.rejectionReason}<\/p>}{r.status==='Aprobado'&&<p className=\"text-xs text-emerald-300 font-medium\">Aprobado por {formatCurrency(r.approvedAmount,'USD')}; el pago no se registra como enviado hasta que se actualice su etapa.<\/p>}<\/>}<\/div>})}<\/div>\n      {advances.filter(a=>a.requestId).length>0&&<div className=\"space-y-3 pt-2\"><h3 className=\"text-sm font-bold text-white tracking-tight\">Seguimiento de desembolsos<\/h3>{advances.filter(a=>a.requestId).map(a=>{const idx={accepted:0,in_progress:1,sent:2,received:3}[a.disbursementStage]??0;const next=['in_progress','sent','received'][idx];const label={in_progress:'Marcar EN PROCESO',sent:'Registrar ENVIADO',received:'Confirmar RECIBIDO'}[next];return <div key={a.id} className=\"p-4 rounded-xl bg-[#0A0A0D]/90 border border-white/[0.07] space-y-3\"><div className=\"flex justify-between items-center text-xs\"><strong className=\"text-white\">{artistFor(a.artistId)?.artisticName} • {formatCurrency(a.totalAmount,a.currency)}<\/strong><span className=\"px-2.5 py-0.5 rounded-full bg-[#7138F5]/15 border border-[#7138F5]/30 text-[#B69AFF] text-[10px] font-bold\">{a.status}<\/span><\/div><div className=\"grid grid-cols-2 sm:grid-cols-4 gap-1.5\">{labels.map((l,i)=><div key={l} className={`p-2 rounded-lg text-center text-[10px] font-semibold border transition-colors ${i<=idx?'bg-[#7138F5]/20 border-[#7138F5]/40 text-[#D7C8FF]':'bg-[#1E1E24]/60 border-white/[0.05] text-zinc-500'}`}>{l}<br/>{a.history?.find(h=>h.stage===l)?.date||'—'}<\/div>)}<\/div>{a.artistReportedReceived&&a.disbursementStage!=='received'&&<p className=\"text-[11px] text-amber-200\">El artista informó recepción; falta confirmación administrativa.<\/p>}{next&&<button disabled={next==='received'&&!a.artistReportedReceived} onClick={()=>onUpdateAdvanceStage(a.id,next)} className=\"px-3.5 py-2 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] text-white text-xs font-bold disabled:opacity-40 transition-all duration-150\">{label}<\/button>}<\/div>})}<\/div>}<\/div>}\n  <\/section>;\n}\n\nfunction AdminConfigView({ appData, currentUser, onUpdateAdminProfile, onRestoreDemo, onCleanDemoData, onImportJson }) {\n  const [adminName, setAdminName] = useState(currentUser.artisticName || 'BERSZ ADMIN');\n  const [adminEmail, setAdminEmail] = useState(currentUser.email || 'admin@berszrecords.com');\n  const [confirmClean, setConfirmClean] = useState(false);\n\n  const handleExportJson = () => {\n    const dataStr = \"data:text/json;charset=utf-8,\" + encodeURIComponent(JSON.stringify(appData, null, 2));\n    const a = document.createElement('a');\n    a.setAttribute(\"href\", dataStr);\n    a.setAttribute(\"download\", `bersz_portal_backup_${new Date().toISOString().slice(0, 10)}.json`);\n    document.body.appendChild(a);\n    a.click();\n    a.remove();\n  };\n\n  return (\n    <div className=\"space-y-6 animate-fade-in\">\n      <div className=\"pb-1\">\n
