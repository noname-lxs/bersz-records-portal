[0_8px_30px_rgba(0,0,0,0.28)] space-y-4\">\n          <h2 className=\"text-base font-bold text-white tracking-tight\">Gestión de Datos y Almacenamiento Local<\/h2>\n          <p className=\"text-xs text-[#8E8E9E] leading-relaxed\">\n            Los datos se guardan en <code className=\"text-[#B69AFF] bg-[#0A0A0D] px-1.5 py-0.5 rounded border border-white/[0.06]\">localStorage ({STORAGE_KEY_V2})<\/code> y los masters WAV en <code className=\"text-[#B69AFF] bg-[#0A0A0D] px-1.5 py-0.5 rounded border border-white/[0.06]\">IndexedDB ({AUDIO_DB_NAME})<\/code>.\n          <\/p>\n          <div className=\"flex flex-wrap gap-2\">\n            <button onClick={handleExportJson} className=\"px-3.5 py-2 rounded-xl bg-[#0A0A0D] hover:bg-[#25252D] border border-white/[0.08] hover:border-white/[0.16] text-xs font-semibold text-white flex items-center gap-1.5 transition-all duration-150\">\n              <Download className=\"w-3.5 h-3.5 text-[#B69AFF]\" /> Exportar Respaldo JSON\n            <\/button>\n            <button onClick={onRestoreDemo} className=\"px-3.5 py-2 rounded-xl bg-[#0A0A0D] hover:bg-[#25252D] border border-white/[0.08] hover:border-amber-500/30 text-xs font-semibold text-amber-300 flex items-center gap-1.5 transition-all duration-150\">\n              <RefreshCw className=\"w-3.5 h-3.5\" /> Restaurar Datos Demo\n            <\/button>\n            {confirmClean ? (\n              <button onClick={() => { onCleanDemoData(); setConfirmClean(false); }} className=\"px-3.5 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-xs font-bold text-white transition-colors\">\n                Confirmar limpieza de datos Demo\n              <\/button>\n            ) : (\n              <button onClick={() => setConfirmClean(true)} className=\"px-3.5 py-2 rounded-xl bg-red-500/15 hover:bg-red-500/25 border border-red-500/30 text-xs font-semibold text-red-300 transition-colors\">\n                Limpiar solo registros Demo\n              <\/button>\n            )}\n          <\/div>\n          <div className=\"p-3.5 rounded-xl bg-[#0A0A0D]/90 border border-white/[0.07] text-[11px] text-zinc-400 leading-relaxed\">\n            <strong className=\"text-white\">Integraciones externas pendientes:<\/strong> envío y verificación real de Gmail, backend con autenticación y permisos, almacenamiento privado para documentos de identidad, base de datos remota y TikTok OEmbed API. Esta versión solo demuestra los flujos localmente; localStorage no ofrece seguridad de producción y no deben añadirse documentos reales.\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div className=\"p-6 rounded-2xl bg-[#1E1E24]/90 border border-white/[0.07] shadow-[0_8px_30px_rgba(0,0,0,0.28)] space-y-3.5\">\n        <h2 className=\"text-base font-bold text-white tracking-tight\">Historial Completo de Acciones Administrativas ({(appData.auditLog || []).length})<\/h2>\n        <div className=\"space-y-2 max-h-64 overflow-y-auto pr-1\">\n          {(appData.auditLog || []).map(log => (\n            <div key={log.id} className=\"p-3 rounded-xl bg-[#0A0A0D]/90 border border-white/[0.06] flex justify-between items-center gap-3 text-xs\">\n              <span><strong className=\"text-[#B69AFF]\">{log.actor}:<\/strong> {log.action}<\/span>\n              <span className=\"text-[10px] text-zinc-500 shrink-0 font-mono\">{log.date}<\/span>\n            <\/div>\n          ))}\n        <\/div>\n      <\/div>\n    <\/div>\n  );\n}\n\nfunction ArtistDashboardView({ artist, releases, analytics, indicators, notifications, onNavigate }) {\n  return (\n    <div className=\"space-y-6 animate-fade-in\">\n      <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-1\">\n        <div>\n          <h1 className=\"text-2xl sm:text-[26px] font-extrabold tracking-tight text-white\">Hola, {artist.artisticName}<\/h1>\n          <p className=\"text-xs sm:text-[13px] text-[#8E8E9E] mt-1\">Panel oficial de artista en Bersz Records • {artist.genre}<\/p>\n        <\/div>\n        <button\n          onClick={() => onNavigate('enviar-lanzamiento')}\n          className=\"px-4 py-2.5 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] active:scale-[0.99] text-white text-xs font-bold flex items-center gap-2 shadow-lg shadow-[#7138F5]/25 self-start transition-all duration-150\"\n        >\n          <Upload className=\"w-4 h-4\" /> Enviar nuevo lanzamiento\n        <\/button>\n      <\/div>\n\n      <div className=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4\">\n        <MetricCard title=\"Mis Lanzamientos\" value={releases.length} icon={Disc} onClick={() => onNavigate('mis-lanzamientos')} />\n        <MetricCard title=\"Streams Spotify\" value={formatMetricValue(analytics?.spotifyStreams)} icon={BarChart3} />\n        <MetricCard title=\"Streams otras plataformas\" value={formatMetricValue(analytics?.otherPlatformsStreams)} icon={BarChart3} />\n        <MetricCard title=\"REPRODUCCIONES TOTALES\" value={analytics?.spotifyStreams == null || analytics?.otherPlatformsStreams == null ? 'Sin datos registrados' : formatNumber(Number(analytics.spotifyStreams)+Number(analytics.otherPlatformsStreams))} icon={Music} />\n        <MetricCard title=\"Visualizaciones TikTok\" value={formatMetricValue(analytics?.tiktokViews)} icon={Eye} onClick={() => onNavigate('tiktok')} />\n        <MetricCard title=\"Videos creados con la música\" value={formatMetricValue(analytics?.tiktokSoundUses)} icon={Video} onClick={() => onNavigate('tiktok')} />\n        <MetricCard title=\"Views de campañas TikTok\" value={formatMetricValue(analytics?.tiktokPromoViews)} icon={Sparkles} onClick={() => onNavigate('tiktok')} />\n      <\/div>\n\n      <div className=\"grid grid-cols-1 lg:grid-cols-2 gap-6\">\n        <div className=\"p-5 sm:p-6 rounded-2xl bg-[#1E1E24]/90 border border-white/[0.07] shadow-[0_8px_30px_rgba(0,0,0,0.28)] space-y-3.5\">\n          <div className=\"flex justify-between items-center\">\n            <h2 className=\"text-sm font-bold text-white tracking-tight\">Estado de mis lanzamientos<\/h2>\n            <button onClick={() => onNavigate('mis-lanzamientos')} className=\"text-xs font-semibold text-[#B69AFF] hover:text-white transition-colors\">Ver detalle<\/button>\n          <\/div>\n          {releases.length === 0 ? (\n            <p className=\"text-xs text-[#8E8E9E] py-4\">Aún no has enviado lanzamientos. Pulsa \"Enviar nuevo lanzamiento\" para comenzar.<\/p>\n          ) : (\n            releases.map(r => (\n              <div key={r.id} className=\"p-3.5 rounded-xl bg-[#0A0A0D]/90 border border-white/[0.07] hover:border-white/[0.14] transition-colors duration-200 flex justify-between items-center gap-3\">\n                <div>\n                  <span className=\"text-[10px] font-mono text-[#B69AFF]\">{r.refCode}<\/span>\n                  <p className=\"text-xs font-bold text-white mt-0.5\">{r.title}<\/p>\n                  {r.adminFeedback && <p className=\"text-[11px] text-zinc-400 mt-0.5\">{r.adminFeedback}<\/p>}\n                <\/div>\n                <span className={`text-[10px] px-2.5 py-1 rounded-full border font-semibold shrink-0 ${STATUS_BADGE_STYLES[r.status] || ''}`}>\n                  {r.status}\n                <\/span>\n              <\/div>\n            ))\n          )}\n        <\/div>\n\n        <div className=\"p-5 sm:p-6 rounded-2xl bg-[#1E1E24]/90 border border-white/[0.07] shadow-[0_8px_30px_rgba(0,0,0,0.28)] space-y-3.5\">\n          <h2 className=\"text-sm font-bold text-white tracking-tight\">Indicadores Publicados por Bersz Records<\/h2>\n          {indicators.length === 0 ? (\n            <p className=\"text-xs text-[#8E8E9E]\">No hay indicadores adicionales publicados.<\/p>\n          ) : (\n            indicators.map(ind => (\n              <div key={ind.id} className=\"p-3.5 rounded-xl bg-[#0A0A0D]/90 border border-white/[0.07] hover:border-white/[0.14] transition-colors duration-200 flex justify-between items-center gap-3\">\n                <div>\n                  <span className=\"text-[10px] text-[#B69AFF] font-semibold uppercase tracking-wider\">{ind.category}<\/span>\n                  <p className=\"text-xs font-bold text-white mt-0.5\">{ind.name}<\/p>\n                  <p className=\"text-[10px] text-zinc-500 mt-0.5\">Actualizado: {ind.updatedAt}<\/p>\n                <\/div>\n                <span className=\"text-base font-black text-[#B69AFF] tabular-nums\">{ind.value}<\/span>\n              <\/div>\n            ))\n          )}\n        <\/div>\n      <\/div>\n    <\/div>\n  );\n}\n\nfunction ArtistReleasesView({ releases, onNavigate, onEditRelease, onDeleteRelease, onTakedownRelease, showToast }) {\n  const [confirmDeleteId, setConfirmDeleteId] = useState(null);\n  const [confirmTakedownId, setConfirmTakedownId] = useState(null);\n  const takedownTarget = releases.find(r => r.id === confirmTakedownId);\n  return (\n    <div className=\"space-y-6 animate-fade-in\">\n      <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-1\">\n        <div>\n          <h1 className=\"text-2xl sm:text-[26px] font-extrabold tracking-tight text-white\">Mis Lanzamientos<\/h1>\n          <p className=\"text-xs sm:text-[13px] text-[#8E8E9E] mt-1\">Seguimiento de estados, códigos de referencia y comentarios de Bersz Records.<\/p>\n        <\/div>\n        <button onClick={() => onNavigate('enviar-lanzamiento')} className=\"px-4 py-2.5 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] active:scale-[0.99] text-xs font-bold text-white flex items-center gap-1.5 shadow-lg shadow-[#7138F5]/25 self-start transition-all duration-150\">\n          <Plus className=\"w-4 h-4\" /> Nuevo envío\n        <\/button>\n      <\/div>\n\n      {releases.length === 0 ? (\n        <div className=\"p-10 rounded-2xl bg-[#1E1E24]/90 border border-white/[0.07] text-center space-y-3.5\">\n          <Disc className=\"w-9 h-9 text-[#B69AFF] mx-auto opacity-90\" />\n          <p className=\"text-sm font-bold text-white\">Todavía no tienes lanzamientos registrados<\/p>\n          <button onClick={() => onNavigate('enviar-lanzamiento')} className=\"px-4 py-2.5 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] text-xs font-bold text-white shadow-lg shadow-[#7138F5]/25 transition-all duration-150\">\n            Enviar mi primer lanzamiento\n          <\/button>\n        <\/div>\n      ) : (\n        <div className=\"space-y-4\">\n          {releases.map(rel => (\n            <div key={rel.id} className=\"p-5 sm:p-6 rounded-2xl bg-[#1E1E24]/90 border border-white/[0.07] hover:border-white/[0.14] shadow-[0_8px_30px_rgba(0,0,0,0.28)] transition-all duration-200 space-y-3.5\">\n              <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-2\">\n                <div>\n                  <span className=\"text-xs font-mono text-[#B69AFF] bg-[#7138F5]/10 px-2 py-0.5 rounded-md border border-[#7138F5]/20\">{rel.refCode}<\/span>\n                  <h3 className=\"text-base font-bold text-white mt-1.5 tracking-tight\">{rel.title}<\/h3>\n                  <p className=\"text-xs text-[#8E8E9E] mt-0.5\">Enviado: {rel.submittedAt} • {rel.tracks?.length || 1} versión(es)<\/p>\n                <\/div>\n                <span className={`text-xs px-3 py-1 rounded-full border font-bold self-start ${STATUS_BADGE_STYLES[rel.status] || ''}`}>\n                  {rel.status}\n                <\/span>\n              <\/div>\n              {rel.adminFeedback && (\n                <div className=\"p-3.5 rounded-xl bg-[#0A0A0D]/90 border border-[#7138F5]/40 text-xs\">\n                  <span className=\"font-bold text-[#B69AFF]\">Nota de Bersz Records: <\/span>\n                  <span className=\"text-zinc-200\">{rel.adminFeedback}<\/span>\n                <\/div>\n              )}\n              {rel.status === 'Cambios solicitados' && (\n                <div className=\"flex flex-wrap gap-2 pt-1\">\n                  <button onClick={() => onEditRelease(rel.id)} className=\"px-4 py-2 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] text-white text-xs font-bold shadow-md shadow-[#7138F5]/20 transition-all duration-150\">Editar proyecto<\/button>\n                  <button onClick={() => setConfirmDeleteId(rel.id)} className=\"px-4 py-2 rounded-xl bg-red-500/15 hover:bg-red-500/25 border border-red-500/35 text-red-300 text-xs font-bold transition-colors\">Eliminar proyecto<\/button>\n                <\/div>\n              )}\n              {rel.takedownRequest && (\n                <div className=\"p-3.5 rounded-xl bg-[#0A0A0D]/90 border border-amber-500/40 text-xs flex items-start gap-2\">\n                  <AlertCircle className=\"w-4 h-4 text-amber-300 shrink-0\" />\n                  <span className=\"text-zinc-200\"><strong className=\"text-amber-300\">Baja solicitada el {rel.takedownRequest.requestedAt}.<\/strong> {releaseTakedownInfo(rel.status).pendingNotice || releaseTakedownInfo(rel.takedownRequest.statusAtRequest || 'Entregado a distribución').pendingNotice}<\/span>\n                <\/div>\n              )}\n              {rel.status !== 'Cambios solicitados' && (\n                <div className=\"flex flex-wrap gap-2 pt-1\">\n                  <button onClick={() => onEditRelease(rel.id)} className=\"px-4 py-2 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] text-white text-xs font-bold shadow-md shadow-[#7138F5]/20 transition-all duration-150 flex items-center gap-1.5\"><Edit3 className=\"w-3.5 h-3.5\" /> Editar lanzamiento<\/button>\n                  {!rel.takedownRequest && <button onClick={() => setConfirmTakedownId(rel.id)} className=\"px-4 py-2 rounded-xl bg-red-500/15 hover:bg-red-500/25 border border-red-500/35 text-red-300 text-xs font-bold transition-colors\">Dar de baja lanzamiento<\/button>}\n                <\/div>\n              )}\n              <div className=\"grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1\">\n                {(rel.tracks || []).map((t, i) => (\n                  <div key={i} className=\"p-3 rounded-xl bg-[#0A0A0D]/90 border border-white/[0.07] text-xs flex justify-between items-center gap-2\">\n                    <span className=\"truncate\"><strong className=\"text-zinc-200\">{t.version}:<\/strong> {t.title}<\/span>\n                    <span className=\"text-[10px] text-[#B69AFF] font-mono shrink-0\">{t.audioFile?.name || 'WAV'}<\/span>\n                  <\/div>\n                ))}\n              <\/div>\n            <\/div>\n          ))}\n        <\/div>\n      )}\n      {takedownTarget && (\n        <div className=\"fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-modal-backdrop\" role=\"dialog\" aria-modal=\"true\">\n          <div className=\"w-full max-w-sm p-6 rounded-2xl bg-[#1E1E24] border border-white/[0.1] shadow-2xl space-y-4 animate-modal-panel\">\n            <h2 className=\"text-base font-bold text-white tracking-tight\">¿Dar de baja \"{takedownTarget.title}\"?<\/h2>\n            <p className=\"text-xs text-zinc-300\">{releaseTakedownInfo(takedownTarget.status).confirm}<\/p>\n            <div className=\"flex justify-end gap-2.5\">\n              <button onClick={() => setConfirmTakedownId(null)} className=\"px-5 py-2 rounded-xl bg-[#0A0A0D] border border-white/[0.08] hover:bg-zinc-800 text-white text-xs font-bold transition-colors\">NO<\/button>\n              <button onClick={() => { const id = confirmTakedownId; setConfirmTakedownId(null); onTakedownRelease(id); }} className=\"px-5 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold transition-colors\">DAR DE BAJA<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n      )}\n      {confirmDeleteId && (\n        <div className=\"fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-modal-backdrop\" role=\"dialog\" aria-modal=\"true\">\n          <div className=\"w-full max-w-sm p-6 rounded-2xl bg-[#1E1E24] border border-white/[0.1] shadow-2xl space-y-5 animate-modal-panel\">\n            <h2 className=\"text-base font-bold text-white tracking-tight\">¿Quieres eliminar el proyecto?<\/h2>\n            <div className=\"flex justify-end gap-2.5\">\n              <button onClick={() => setConfirmDeleteId(null)} className=\"px-5 py-2 rounded-xl bg-[#0A0A0D] border border-white/[0.08] hover:bg-zinc-800 text-white text-xs font-bold transition-colors\">NO<\/button>\n              <button onClick={() => { const id = confirmDeleteId; setConfirmDeleteId(null); onDeleteRelease(id); }} className=\"px-5 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold transition-colors\">ELIMINAR<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n      )}\n    <\/div>\n  );\n}\n\nconst BERSZ_CREDIT_LIMIT = 5;\nconst berszCanAddEntry = entries => entries.length < BERSZ_CREDIT_LIMIT;\nconst berszTomorrow = (now = new Date()) => {\n  const date = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);\n  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;\n};\nconst berszValidRequestedDate = (date, now = new Date()) => /^\\d{4}-\\d{2}-\\d{2}$/.test(date) && date >= berszTomorrow(now) && !Number.isNaN(new Date(`${date}T12:00:00`).getTime()) && new Date(`${date}T12:00:00`).getDate() === Number(date.slice(-2));\nconst berszEmptyCredit = role => ({ artisticName: '', firstName: '', lastName: '', role });\nconst berszTrackCredits = track => track.credits || {\n  mainArtists: (track.mainArtists || [track.mainArtist]).filter(Boolean).map(artisticName => ({ ...berszEmptyCredit('Artista Principal'), artisticName })),\n  writers: [], performers: [], production: []\n};\nconst BERSZ_DATE_ASAP_NOTICE = 'Bersz Records gestionará tu lanzamiento lo antes posible. El procesamiento puede tardar aproximadamente de 1 a 5 días laborables y pueden producirse retrasos. Este plazo es estimado y no garantiza una fecha exacta de publicación';\nconst BERSZ_DATE_CHOICE_NOTICE = '¿Necesitas que tu música se publique en una fecha específica? Te recomendamos solicitarla con al menos 2 o 3 semanas de anticipación. Nuestro socio de distribución puede experimentar tiempos de procesamiento variables, por lo que no podemos garantizar la publicación exacta hasta confirmar que el lanzamiento está programado';\n\nfunction BerszNameEntries({ title, entries, onChange, addLabel, required = false, showToast }) {\n  return <fieldset className=\"bz-names space-y-2 min-w-0\">\n    <legend className=\"text-xs font-bold text-zinc-200 mb-1.5\">{title}<\/legend>\n    {entries.length === 0 && <p className=\"bz-empty-hint\">Sin entradas añadidas.<\/p>}\n    {entries.map((name, index) => <div key={index} className=\"bz-row flex gap-2 items-center\">\n      <span className=\"bersz-credit-index\" aria-hidden=\"true\">{index + 1}<\/span>\n      <input aria-label={`${title} ${index + 1}`} value={name} onChange={e => onChange(entries.map((entry, i) => i === index ? e.target.value : entry))} className=\"bersz-credit-input flex-1 min-w-0\" />\n      <button type=\"button\" aria-label={`Quitar ${title.toLowerCase()} ${index + 1}`} title=\"Quitar entrada\" onClick={() => onChange(entries.filter((_, i) => i !== index))} className=\"bersz-credit-remove\"><X className=\"w-4 h-4\" /><\/button>\n    <\/div>)}\n    <button type=\"button\" onClick={() => { if (!berszCanAddEntry(entries)) { showToast('Para añadir más de 5 entradas, contacta con Bersz Records para organizar el lanzamiento.', 'error'); return; } onChange([...entries, '']); }} className=\"bersz-credit-add\">{addLabel} ({entries.length}/5)<\/button>\n  <\/fieldset>;\n}\n\nconst berszLegalName = entry => entry.legalName ?? [entry.firstName, entry.lastName].filter(Boolean).join(' ');\nfunction BerszCreditGroup({ title, entries, roles, onChange, showToast, isMain = false }) {\n  const updateEntry = (index, fields) => onChange(entries.map((entry, i) => i === index ? { ...entry, ...fields } : entry));\n  return <fieldset className=\"bersz-credit-group\">\n    <legend className=\"bersz-credit-legend\">{title} <span className=\"bz-count\">{entries.length}/{BERSZ_CREDIT_LIMIT}<\/span><\/legend>\n    <div className=\"space-y-3\">\n    {entries.length === 0 && <p className=\"bz-empty-hint\">Todavía no hay entradas en este grupo.<\/p>}\n    {entries.map((entry, index) => <div key={index} className=\"bersz-credit-row\">\n      <span className=\"bersz-credit-index\">{index + 1}<\/span>\n      {isMain\n        ? <div className=\"grid grid-cols-1 sm:grid-cols-[1fr_auto] gap-3 items-end flex-1 min-w-0\"><label className=\"bersz-credit-label\">Nombre artístico<input aria-label={`${title} ${index + 1} nombre artístico`} className=\"bersz-credit-input\" value={entry.artisticName || ''} onChange={e => updateEntry(index, { artisticName: e.target.value, role: 'Artista Principal' })} /><\/label><span className=\"bersz-credit-role\" aria-label={`${title} ${index + 1} rol`}>Artista Principal<\/span><\/div>\n        : <label className=\"bersz-credit-label flex-1 min-w-0\">NOMBRE LEGAL<input aria-label={`${title} ${index + 1} nombre legal`} className=\"bersz-credit-input\" value={berszLegalName(entry)} onChange={e => updateEntry(index, { legalName: e.target.value })} /><\/label>}\n      <button type=\"button\" aria-label={`Quitar ${title} ${index + 1}`} title=\"Quitar entrada\" className=\"bersz-credit-remove\" onClick={() => onChange(entries.filter((_, i) => i !== index))}><X className=\"w-4 h-4\" /><\/button>\n    <\/div>)}\n    <\/div>\n    <button type=\"button\" className=\"bersz-credit-add\" onClick={() => { if (!berszCanAddEntry(entries)) { showToast('Para añadir más de 5 entradas en este grupo, contacta con Bersz Records para organizar correctamente los créditos.', 'error'); return; } onChange([...entries, isMain ? berszEmptyCredit('Artista Principal') : { ...berszEmptyCredit(roles[0]), legalName: '' }]); }}>{isMain ? '+ Añadir artista' : '+ Añadir colaborador'} ({entries.length}/5)<\/button>\n  <\/fieldset>;\n}\n\nfunction BerszReleaseIntroGate({ skip, children }) {\n  const [open, setOpen] = useState(skip);\n  if (open) return <div className=\"bz-form-enter\">{children}<\/div>;\n  return (\n    <section className=\"bz-intro max-w-3xl mx-auto\" aria-labelledby=\"bz-intro-title\">\n      <div className=\"bz-intro-hero\">\n        <span className=\"bz-intro-eyebrow\"><Upload className=\"w-3.5 h-3.5\" aria-hidden=\"true\" /> Bersz Records · Portal de artistas<\/span>\n        <h1 id=\"bz-intro-title\" className=\"bz-intro-title\">Enviar nuevo lanzamiento<\/h1>\n        <p className=\"bz-intro-text\">Prepara tu próximo lanzamiento con Bersz Records. Completa la información de tu EP y envía tu proyecto a nuestro equipo para su revisión.<\/p>\n        <button type=\"button\" className=\"bz-btn bz-btn-primary bz-btn-lg\" onClick={() => setOpen(true)}>\n          <span>Enviar nuevo lanzamiento<\/span><ChevronRight className=\"w-4 h-4\" aria-hidden=\"true\" />\n        <\/button>\n      <\/div>\n      <aside className=\"bz-intro-note\" role=\"note\">\n        <span className=\"bz-intro-note-icon\" aria-hidden=\"true\"><Disc className=\"w-5 h-5\" /><\/span>\n        <div>\n          <p className=\"bz-intro-note-title\">Actualmente aceptamos EPs<\/p>\n          <p className=\"bz-intro-note-text\">La opción de enviar álbumes estará disponible próximamente. Por el momento, puedes enviar tus EPs a través de nuestro portal.<\/p>\n        <\/div>\n      <\/aside>\n    <\/section>\n  );\n}\n\nfunction ReleaseSubmissionWizard({ artist, existingRelease, onSaveRelease, showToast }) {\n  const [step, setStep] = useState(1);\n  const bzPrevStep = React.useRef(1);\n  const bzStepDir = step >= bzPrevStep.current ? 'fwd' : 'back';\n  useEffect(() => { bzPrevStep.current = step; }, [step]);\n  const [bzWavBusy, setBzWavBusy] = useState(null);\n  const [releaseTitle, setReleaseTitle] = useState(existingRelease?.title || '');\n  const [mainArtists, setMainArtists] = useState(existingRelease?.mainArtists || [existingRelease?.mainArtist || artist.artisticName || '']);\n  const mainArtist = mainArtists[0] || '';\n  const [collaborators, setCollaborators] = useState(existingRelease?.collaborators || []);\n  const [releaseDateMode, setReleaseDateMode] = useState(existingRelease?.releaseDateMode || 'asap');\n  const [requestedReleaseDate, setRequestedReleaseDate] = useState(existingRelease?.requestedReleaseDate || '');\n  const versionCache = React.useRef({});\n  const [selectedPresets, setSelectedPresets] = useState(() => existingRelease?.tracks?.map(t => VERSION_PRESETS.includes(t.version) ? t.version : 'Otro').filter((v, i, a) => a.indexOf(v) === i) || ['Normal']);\n  const [customVersions, setCustomVersions] = useState(() => existingRelease?.tracks?.filter(t => !VERSION_PRESETS.includes(t.version)).map(t => t.version) || ['']);\n  const [tracksData, setTracksData] = useState(existingRelease?.tracks || []);\n  const [activeTrackIndex, setActiveTrackIndex] = useState(0);\n  const [confirmedAuth, setConfirmedAuth] = useState(false);\n  const [coverArt, setCoverArt] = useState(existingRelease?.coverArt || null);\n  const [coverPreviewUrl, setCoverPreviewUrl] = useState(null);\n\n  useEffect(() => {\n    let url = null; let cancelled = false;\n    if (!coverArt?.imageId) { setCoverPreviewUrl(null); return; }\n    getWavFromVault(coverArt.imageId).then(rec => {\n      if (cancelled || !rec?.blob) return;\n      url = URL.createObjectURL(rec.blob); setCoverPreviewUrl(url);\n    }).catch(() => {});\n    return () => { cancelled = true; if (url) URL.revokeObjectURL(url); };\n  }, [coverArt?.imageId]);\n\n  const handleAttachCover = async (file) => {\n    if (!file) return;\n    if (!['image/png', 'image/jpeg'].includes(file.type) && !/\\.(png|jpe?g)$/i.test(file.name)) {\n      showToast('Formato no aceptado. Usa PNG o JPG/JPEG.', 'error');\n      return;\n    }\n    let dims;\n    try {\n      dims = await new Promise((resolve, reject) => {\n        const u = URL.createObjectURL(file); const img = new Image();\n        img.onload = () => { resolve({ width: img.naturalWidth, height: img.naturalHeight }); URL.revokeObjectURL(u); };\n        img.onerror = () => { URL.revokeObjectURL(u); reject(new Error('img')); };\n        img.src = u;\n      });\n    } catch (e) { showToast('No se pudo leer la imagen seleccionada.', 'error'); return; }\n    const imageId = `cover-${Date.now()}`;\n    try {\n      await saveWavToVault(imageId, file, { name: file.name, sizeMB: `${(file.size / (1024 * 1024)).toFixed(2)} MB`, type: file.type || 'image/jpeg', ownerArtistId: artist.id, uploadedAt: new Date().toISOString() });\n      setCoverArt({ imageId, name: file.name, width: dims.width, height: dims.height });\n      showToast(`Portada \"${file.name}\" guardada.`);\n    } catch (e) {\n      showToast('Error al guardar la portada.', 'error');\n    }\n  };\n  const coverWarnings = coverArt ? [\n    coverArt.width !== coverArt.height && `La imagen no es cuadrada (${coverArt.width} × ${coverArt.height} px). La portada debe tener una relación de aspecto 1:1.`,\n    Math.min(coverArt.width, coverArt.height) < 3000 && `La resolución (${coverArt.width} × ${coverArt.height} px) es inferior a la recomendada de 3000 × 3000 px.`\n  ].filter(Boolean) : [];\n\n  const togglePreset = (preset) => {\n    if (preset === 'Normal') return; // Normal es obligatoria\n    setSelectedPresets(prev =>\n      prev.includes(preset) ? prev.filter(p => p !== preset) : [...prev, preset]\n    );\n  };\n\n  const buildStep2Tracks = () => {\n    if (releaseDateMode === 'date' && !berszValidRequestedDate(requestedReleaseDate)) {\n      showToast('Selecciona una fecha de lanzamiento futura.', 'error'); return;\n    }\n    if (!releaseTitle.trim() || !mainArtists.some(name => name.trim())) {\n      showToast('Completa el nombre del lanzamiento y el artista principal.', 'error');\n      return;\n    }\n    const finalVersions = [];\n    selectedPresets.forEach(p => {\n      if (p !== 'Otro') finalVersions.push(p);\n    });\n    if (selectedPresets.includes('Otro')) {\n      customVersions.map(v => v.trim()).filter(Boolean).slice(0, 5).forEach(v => finalVersions.push(v));\n    }\n\n    tracksData.forEach(track => { versionCache.current[track.version] = track; });\n    const synced = finalVersions.map(ver => {\n      const existing = versionCache.current[ver];\n      if (existing) return existing;\n      return {\n        version: ver,\n        title: ver === 'Normal' ? releaseTitle.trim() : `${releaseTitle.trim()} (${ver})`,\n        mainArtist: mainArtist.trim(),\n        collaborators: [...collaborators],\n        credits: { mainArtists: mainArtists.filter(name => name.trim()).map(artisticName => ({ ...berszEmptyCredit('Artista Principal'), artisticName })), writers: [], performers: collaborators.filter(name => name.trim()).map(artisticName => ({ ...berszEmptyCredit('Artista invitado'), artisticName })), production: [] },\n        composers: [],\n        producers: [],\n        otherCredits: '',\n        explicit: 'No',\n        notes: '',\n        audioFile: null\n      };\n    });\n    setTracksData(synced);\n    setActiveTrackIndex(0);\n    setStep(2);\n  };\n\n  const handleAttachWav = async (idx, file, options = {}) => {\n    if (!file) return;\n    const isTestAudio = Boolean(options.isTestAudio);\n    const audioId = `wav-${Date.now()}-${idx}`;\n    const sizeMB = `${(file.size / (1024 * 1024)).toFixed(2)} MB`;\n    setBzWavBusy(idx);\n    try {\n      await saveWavToVault(audioId, file, {\n        name: file.name,\n        sizeMB,\n        type: file.type || 'audio/wav',\n        ownerArtistId: artist.id,\n        uploadedAt: new Date().toISOString(),\n        ...(isTestAudio ? { isTestAudio: true } : {})\n      });\n      setTracksData(prev => prev.map((t, i) => i === idx ? { ...t, audioFile: { audioId, name: file.name, sizeMB, ...(isTestAudio ? { isTestAudio: true } : {}) } } : t));\n      showToast(isTestAudio ? `Audio de prueba \"${file.name}\" guardado. No es un máster original.` : `Archivo \"${file.name}\" guardado en la bóveda local.`);\n    } catch (e) {\n      showToast('Error al almacenar el archivo WAV en IndexedDB.', 'error');\n    } finally { setBzWavBusy(null); }\n  };\n\n  const handleGenerateTestWav = async (idx) => {\n    const blob = createSyntheticWavBlob();\n    const t = tracksData[idx];\n    const fileName = testAudioFileName(t.title);\n    const file = new File([blob], fileName, { type: 'audio/wav' });\n    await handleAttachWav(idx, file, { isTestAudio: true });\n  };\n\n  const finalizeSubmission = (isDraft) => {\n    if (releaseDateMode === 'date' && !berszValidRequestedDate(requestedReleaseDate)) { showToast('Selecciona una fecha de lanzamiento futura.', 'error'); return; }\n    if (!isDraft) {\n      for (const t of tracksData) {\n        if (!t.title.trim() || !t.composers.length || !t.audioFile) {\n          showToast(`Completa el título, al menos un Escritor / Compositor y el archivo WAV en la versión \"${t.version}\".`, 'error');\n          return;\n        }\n      }\n      if (!confirmedAuth) {\n        showToast('Debes confirmar la casilla de autorización de derechos antes de enviar.', 'error');\n        return;\n      }\n    }\n    const now = new Date().toISOString().replace('T', ' ').slice(0, 16);\n    onSaveRelease({\n      id: existingRelease?.id || `rel-${Date.now()}`,\n      refCode: existingRelease?.refCode || `#BRZ-2026-${Math.floor(1000 + Math.random() * 9000)}`,\n      artistId: artist.id,\n      title: releaseTitle.trim() || 'Lanzamiento sin título',\n      mainArtist: mainArtists.filter(name => name.trim()).join(', '),\n      mainArtists: [...mainArtists],\n      releaseDateMode,\n      requestedReleaseDate: releaseDateMode === 'date' ? requestedReleaseDate : null,\n      collaborators,\n      coverArt,\n      status: isDraft ? 'Borrador' : 'En revisión',\n      adminFeedback: '',\n      submittedAt: now,\n      updatedAt: now,\n      tracks: tracksData,\n      isDemo: false\n    }, isDraft);\n  };\n\n  return (\n    <div className=\"bersz-wizard max-w-5xl mx-auto space-y-6 animate-fade-in\">\n      <div className=\"pb-1\">\n        <h1 className=\"text-2xl sm:text-[26px] font-extrabold tracking-tight text-white\">{existingRelease ? (existingRelease.status === 'Cambios solicitados' ? 'Editar proyecto con cambios solicitados' : 'Editar lanzamiento') : 'Enviar Lanzamiento a Bersz Records'}<\/h1>\n        <p className=\"text-xs sm:text-[13px] text-[#8E8E9E] mt-1\">Paso {step} de 3 • Proceso simplificado para artistas verificados del sello.<\/p>\n      <\/div>\n\n      <ol className=\"bersz-stepper\" aria-label=\"Progreso del lanzamiento\">{['Información general','Pistas y créditos','Revisión final'].map((label,i) => <li key={label} aria-current={step === i+1 ? 'step' : undefined} data-complete={step > i+1}><span>{step > i+1 ? <Check className=\"w-4 h-4\" /> : i+1}<\/span><strong>{label}<\/strong><\/li>)}<\/ol>\n      {/* PROGRESS BAR */}\n      <div className=\"bz-progress w-full bg-[#1E1E24] h-2 rounded-full overflow-hidden border border-white/[0.06]\">\n        <div className=\"bz-progress-fill bg-gradient-to-r from-[#7138F5] to-[#B69AFF] h-full transition-all duration-200 ease-out\" style={{ width: `${(step / 3) * 100}%` }} />\n      <\/div>\n\n      {step === 1 && (\n        <div key={step} data-dir={bzStepDir} className=\"bersz-form-step space-y-5\">\n          <h2 className=\"text-base font-bold text-white tracking-tight\">Paso 1: Información General y Selección de Versiones<\/h2>\n          <div className=\"bz-panel space-y-5\">\n          <div className=\"grid grid-cols-1 sm:grid-cols-2 gap-4\">\n            <div>\n              <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">Nombre provisional del lanzamiento *<\/label>\n              <input\n                type=\"text\"\n                value={releaseTitle}\n                onChange={e => setReleaseTitle(e.target.value)}\n                placeholder=\"Ej. MONTAGEM ECLIPSE RJ\"\n                className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\"\n              />\n            <\/div>\n            <BerszNameEntries title=\"Artistas principales\" entries={mainArtists} onChange={setMainArtists} addLabel=\"+ Añadir artista\" showToast={showToast} />\n          <\/div>\n          <BerszNameEntries title=\"Colaboradores generales\" entries={collaborators} onChange={setCollaborators} addLabel=\"+ Añadir colaborador\" showToast={showToast} />\n          <\/div>\n\n          <fieldset className=\"bz-panel space-y-3\">\n            <legend className=\"text-xs font-bold text-zinc-200 mb-2\">Fecha de lanzamiento<\/legend>\n            <div className=\"flex flex-wrap gap-4 text-xs text-zinc-200\">\n              <label className=\"flex items-center gap-2 cursor-pointer\"><input type=\"radio\" name=\"release-date-mode\" value=\"asap\" checked={releaseDateMode === 'asap'} onChange={() => setReleaseDateMode('asap')} className=\"bersz-credit-radio\" />Lo antes posible<\/label>\n              <label className=\"flex items-center gap-2 cursor-pointer\"><input type=\"radio\" name=\"release-date-mode\" value=\"date\" checked={releaseDateMode === 'date'} onChange={() => setReleaseDateMode('date')} className=\"bersz-credit-radio\" />Elegir fecha<\/label>\n            <\/div>\n            {releaseDateMode === 'date' && <label className=\"bersz-credit-label block max-w-xs\">Fecha deseada (solicitud)<input aria-label=\"Fecha deseada\" type=\"date\" min={berszTomorrow()} value={requestedReleaseDate} onChange={e => setRequestedReleaseDate(e.target.value)} className=\"bersz-credit-input\" /><\/label>}\n            <p className=\"text-xs text-zinc-300 leading-relaxed\">{releaseDateMode === 'asap' ? BERSZ_DATE_ASAP_NOTICE : BERSZ_DATE_CHOICE_NOTICE}<\/p>\n          <\/fieldset>\n\n          {/* PORTADA DEL EP */}\n          <div className=\"bz-panel space-y-3\">\n            <label className=\"block text-xs font-bold text-zinc-200\">Portada del EP<\/label>\n            <div className=\"bz-note p-3.5 rounded-xl text-xs space-y-1.5\">\n              <p className=\"font-bold text-[#B69AFF]\">Requisitos de portada — Bersz Records<\/p>\n              <p className=\"text-zinc-300\">«La portada debe ser un cuadrado perfecto, con una relación de aspecto de 1:1. En Bersz Records recomendamos una resolución de <strong className=\"text-white\">3000 × 3000 píxeles<\/strong> para mantener una calidad visual óptima en nuestros lanzamientos. Los formatos aceptados son PNG y JPG/JPEG».<\/p>\n            <\/div>\n            <div className=\"flex flex-col sm:flex-row gap-4 items-start\">\n              <div data-has={Boolean(coverPreviewUrl)} className=\"bz-cover w-32 h-32 shrink-0 rounded-xl bg-[#0A0A0D] border border-white/[0.08] flex items-center justify-center overflow-hidden\">\n                {coverPreviewUrl ? <img key={coverPreviewUrl} src={coverPreviewUrl} alt=\"Portada del EP\" className=\"bz-cover-img max-w-full max-h-full object-contain\" /> : <ImageIcon className=\"w-8 h-8 text-zinc-600\" />}\n              <\/div>\n              <div className=\"space-y-2.5 flex-1\">\n                <label className=\"bz-btn bz-btn-primary bz-btn-sm bz-file-btn\">\n                  <ImageIcon className=\"w-4 h-4\" aria-hidden=\"true\" />{coverArt ? 'Reemplazar portada' : 'Seleccionar portada'}\n                  <input type=\"file\" accept=\"image/png,image/jpeg,.png,.jpg,.jpeg\" aria-label=\"Seleccionar portada del EP\" onChange={e => { handleAttachCover(e.target.files?.[0]); e.target.value = ''; }} className=\"bz-sr-only\" />\n                <\/label>\n                <p className=\"text-[11px] text-zinc-400\">{coverArt ? `Portada actual: ${coverArt.name} (${coverArt.width} × ${coverArt.height} px). Selecciona otra imagen para reemplazarla.` : 'No se ha seleccionado portada.'}<\/p>\n                {coverWarnings.map((w, i) => (\n                  <div key={i} className=\"bz-msg p-2.5 rounded-lg bg-amber-500/10 border border-amber-500/40 text-[11px] text-amber-200 flex items-start gap-2\"><AlertCircle className=\"w-3.5 h-3.5 shrink-0 mt-0.5\" /><span>{w}<\/span><\/div>\n                ))}\n              <\/div>\n            <\/div>\n          <\/div>\n\n          {/* VERSION SELECTOR */}\n          <div className=\"bz-panel space-y-3\">\n            <label className=\"block text-xs font-bold text-zinc-200\">Selecciona las versiones que vas a entregar *<\/label>\n            <p className=\"bz-panel-hint\">«Normal» es obligatoria. Cada versión seleccionada tendrá su propia pista, créditos y archivo WAV en el paso 2.<\/p>\n            <div className=\"grid grid-cols-2 sm:grid-cols-4 gap-2.5\">\n              {VERSION_PRESETS.map(preset => {\n                const active = selectedPresets.includes(preset);\n                return (\n                  <button\n                    key={preset}\n                    type=\"button\"\n                    onClick={() => togglePreset(preset)}\n                    aria-pressed={active}\n                    data-active={active}\n                    data-locked={preset === 'Normal'}\n                    className={`bz-chip p-3 rounded-xl border text-xs font-bold flex items-center justify-between transition-all duration-150 ${\n                      active ? 'bg-[#7138F5]/20 border-[#7138F5] text-white shadow-sm shadow-[#7138F5]/15' : 'bg-[#0A0A0D] border-white/[0.07] hover:border-white/[0.15] text-[#8E8E9E] hover:text-white'\n                    }`}\n                  >\n                    <span>{preset}<\/span>\n                    <span className=\"bz-chip-check\" aria-hidden=\"true\"><Check className=\"w-3.5 h-3.5\" /><\/span>\n                  <\/button>\n                );\n              })}\n            <\/div>\n          <\/div>\n\n          {selectedPresets.includes('Otro') && (\n            <div className=\"bz-reveal p-4 rounded-xl bg-[#0A0A0D]/90 border border-[#7138F5]/40 space-y-3\">\n              <div className=\"flex justify-between items-center\">\n                <p className=\"text-xs font-bold text-[#B69AFF]\">Versiones personalizadas en \"Otro\" (Máximo 5 adicionales)<\/p>\n                {customVersions.length < 5 && (\n                  <button\n                    type=\"button\"\n                    onClick={() => setCustomVersions([...customVersions, ''])}\n                    className=\"bz-btn bz-btn-primary bz-btn-sm text-xs text-white bg-[#7138F5] hover:bg-[#6229E8] px-2.5 py-1 rounded-lg font-bold transition-colors\"\n                  >\n                    + Añadir versión ({customVersions.length}/5)\n                  <\/button>\n                )}\n              <\/div>\n              {customVersions.map((val, idx) => (\n                <div key={idx} className=\"flex gap-2\">\n                  <input\n                    type=\"text\"\n                    value={val}\n                    onChange={e => setCustomVersions(customVersions.map((v, i) => i === idx ? e.target.value : v))}\n                    placeholder={`Nombre de versión personalizada #${idx + 1} (ej. Instrumental / TikTok Cut)`}\n                    className=\"flex-1 px-3.5 py-2 rounded-xl bg-[#1E1E24] border border-[#2D2D35] text-xs text-white\"\n                  />\n                  {customVersions.length > 1 && (\n                    <button type=\"button\" onClick={() => setCustomVersions(customVersions.filter((_, i) => i !== idx))} className=\"bz-icon-btn p-2 text-red-400 hover:text-red-300 transition-colors\">\n                      <Trash2 className=\"w-4 h-4\" />\n                    <\/button>\n                  )}\n                <\/div>\n              ))}\n            <\/div>\n          )}\n\n          <div className=\"flex justify-end pt-2\">\n            <button onClick={buildStep2Tracks} className=\"bz-btn bz-btn-primary px-6 py-2.5 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] active:scale-[0.99] text-white text-xs font-bold flex items-center gap-2 shadow-lg shadow-[#7138F5]/25 transition-all duration-150\">\n              <span>Continuar al Paso 2<\/span>\n              <ChevronRight className=\"w-4 h-4\" />\n            <\/button>\n          <\/div>\n        <\/div>\n      )}\n\n      {step === 2 && tracksData[activeTrackIndex] && (\n        <div key={step} data-dir={bzStepDir} className=\"bersz-form-step space-y-5\">\n          <h2 className=\"text-base font-bold text-white tracking-tight\">Paso 2: Pistas, créditos y archivo WAV<\/h2>\n          <div className=\"bz-track-tabs flex flex-wrap gap-2 border-b border-white/[0.07] pb-3.5\" aria-label=\"Versiones del lanzamiento\">\n            {tracksData.map((t, idx) => (\n              <button\n                key={idx}\n                onClick={() => setActiveTrackIndex(idx)}\n                data-active={activeTrackIndex === idx}\n                className={`bz-tab px-3.5 py-1.5 rounded-xl text-xs font-bold flex items-center gap-2 border transition-all duration-150 ${\n                  activeTrackIndex === idx ? 'bg-[#7138F5] border-[#7138F5] text-white shadow-md shadow-[#7138F5]/25' : 'bg-[#0A0A0D] border-white/[0.07] text-zinc-400 hover:text-white'\n                }`}\n              >\n                <span>{t.version}<\/span>\n                {t.audioFile && <CheckCircle2 className=\"w-3.5 h-3.5 text-emerald-300\" />}\n              <\/button>\n            ))}\n          <\/div>\n\n          {(() => {\n            const cur = tracksData[activeTrackIndex];\n            const updateCur = (fields) => {\n              setTracksData(prev => prev.map((item, i) => i === activeTrackIndex ? { ...item, ...fields } : item));\n            };\n            return (\n              <div className=\"space-y-4\">\n                <div className=\"bz-panel space-y-4\">\n                <h3 className=\"bz-panel-title\"><Music className=\"w-4 h-4\" aria-hidden=\"true\" />Datos de la pista · {cur.version}<\/h3>\n                <div className=\"grid grid-cols-1 sm:grid-cols-2 gap-4\">\n                  <div>\n                    <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">1. Nombre de la pista ({cur.version}) *<\/label>\n                    <input\n                      type=\"text\"\n                      value={cur.title}\n                      onChange={e => updateCur({ title: e.target.value })}\n                      className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\"\n                    />\n                  <\/div>\n                  <div>\n                    <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">2. Artista Principal<\/label>\n                    <input\n                      type=\"text\"\n                      value={cur.mainArtist}\n                      onChange={e => updateCur({ mainArtist: e.target.value })}\n                      className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\"\n                    />\n                  <\/div>\n                <\/div>\n\n                <div className=\"grid grid-cols-1 sm:grid-cols-2 gap-4\">\n                  <div>\n                    <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">3. Letra explícita<\/label>\n                    <select\n                      value={cur.explicit}\n                      onChange={e => updateCur({ explicit: e.target.value })}\n                      className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\"\n                    >\n                      <option value=\"No\">No<\/option>\n                      <option value=\"Sí\">Sí (Explicit)<\/option>\n                    <\/select>\n                  <\/div>\n                  <div>\n                    <label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">4. Observaciones para Bersz Records<\/label>\n                    <input\n                      type=\"text\"\n                      value={cur.notes || ''}\n                      onChange={e => updateCur({ notes: e.target.value })}\n                      placeholder=\"Notas sobre mezcla o master...\"\n                      className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\"\n                    />\n                  <\/div>\n                <\/div>\n                <\/div>\n\n                <section aria-label={`Créditos de ${cur.version}`} className=\"bersz-credit-section\">\n                  <h3 className=\"bz-panel-title\"><Users className=\"w-4 h-4\" aria-hidden=\"true\" />Artistas y colaboradores · {cur.version}<\/h3>\n                  <div className=\"bersz-credit-notice\"><p className=\"font-bold mb-1\">Importante — Créditos para Apple Music<\/p><p>Para los créditos de colaboradores destinados a Apple Music, introduce los nombres y apellidos reales en los campos correspondientes. No utilices nombres artísticos como sustitutos de los nombres reales cuando se soliciten datos legales de los colaboradores. El nombre artístico debe conservarse en su campo correspondiente.<\/p><\/div>\n                  {[\n                    { key: 'mainArtists', title: 'Artistas principales', roles: ['Artista principal', 'Artista conjunto'], isMain: true },\n                    { key: 'writers', title: 'Escritores / Compositores', roles: ['Compositor', 'Letrista', 'Escritor', 'Compositor y letrista'] },\n                    { key: 'performers', title: 'Intérpretes', roles: ['Artista invitado', 'Vocalista', 'Intérprete', 'Instrumentista', 'Remixer'] },\n                    { key: 'production', title: 'Producción e Ingeniería', roles: ['Productor', 'Coproductor', 'Ingeniero de grabación', 'Ingeniero de mezcla', 'Ingeniero de masterización'] }\n                  ].map(group => <BerszCreditGroup key={`${cur.version}-${group.key}`} title={group.title} entries={berszTrackCredits(cur)[group.key] || []} roles={group.roles} isMain={group.isMain} showToast={showToast} onChange={entries => { const credits = { ...berszTrackCredits(cur), [group.key]: entries }; const names = list => (list || []).map(berszLegalName).map(n => n.trim()).filter(Boolean); updateCur({ credits, ...(group.key === 'writers' ? { composers: names(credits.writers) } : {}), ...(group.key === 'production' ? { producers: names(credits.production) } : {}) }); }} />)}\n                <\/section>\n\n                {/* WAV UPLOAD */}\n                <div data-loaded={Boolean(cur.audioFile)} data-loading={bzWavBusy === activeTrackIndex} className=\"bz-wav p-4 rounded-xl bg-[#0A0A0D]/90 border border-[#7138F5]/40 space-y-3\">\n                  <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-2.5\">\n                    <div>\n                      <p className=\"text-xs font-bold text-white\">Archivo de Audio Master (.WAV) *<\/p>\n                      <p key={cur.audioFile?.audioId || 'none'} className=\"bz-swap text-[11px] text-[#8E8E9E] mt-0.5\">\n                        {cur.audioFile ? `Cargado: ${cur.audioFile.name} (${cur.audioFile.sizeMB})` : 'Aún no se ha seleccionado archivo para esta versión.'}\n                      <\/p>\n                    <\/div>\n                    <div className=\"flex flex-wrap gap-2\">\n                      <label data-loading={bzWavBusy === activeTrackIndex} className=\"bz-btn bz-btn-primary px-3.5 py-2 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] text-white text-xs font-bold cursor-pointer shadow-md shadow-[#7138F5]/20 transition-all duration-150\">\n                        {bzWavBusy === activeTrackIndex ? <span className=\"bz-loading\"><span className=\"bz-spinner\" aria-hidden=\"true\" />Guardando WAV…<\/span> : 'Seleccionar archivo WAV'}\n                        <input\n                          type=\"file\"\n                          accept=\".wav,audio/wav\"\n                          onChange={e => handleAttachWav(activeTrackIndex, e.target.files?.[0])}\n                          aria-label={`Seleccionar archivo WAV para ${cur.version}`}\n                          className=\"bz-sr-only\"\n                        />\n                      <\/label>\n                      <button\n                        type=\"button\"\n                        onClick={() => handleGenerateTestWav(activeTrackIndex)}\n                        disabled={bzWavBusy === activeTrackIndex}\n                        className=\"bz-btn bz-btn-ghost px-3 py-2 rounded-xl bg-[#1E1E24] hover:bg-[#25252D] border border-white/[0.08] text-xs text-[#B69AFF] font-semibold transition-colors\"\n                      >\n                        + Generar WAV de prueba real\n                      <\/button>\n                    <\/div>\n                  <\/div>\n                <\/div>\n              <\/div>\n            );\n          })()}\n\n          <div className=\"flex justify-between pt-4 border-t border-white/[0.07]\">\n            <button onClick={() => setStep(1)} className=\"bz-btn bz-btn-ghost px-4 py-2 rounded-xl bg-[#0A0A0D] border border-white/[0.08] hover:border-white/[0.16] text-xs text-zinc-300 flex items-center gap-1 transition-colors\">\n              <ChevronLeft className=\"w-4 h-4\" /> Volver al Paso 1\n            <\/button>\n            <div className=\"flex gap-2\">\n              {<button onClick={() => finalizeSubmission(true)} className=\"bz-btn bz-btn-ghost px-4 py-2 rounded-xl bg-[#0A0A0D] border border-white/[0.08] hover:bg-zinc-800 text-xs font-semibold text-white transition-colors\">\n                Guardar Borrador\n              <\/button>}\n              <button onClick={() => setStep(3)} className=\"bz-btn bz-btn-primary px-6 py-2 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] text-xs font-bold text-white shadow-lg shadow-[#7138F5]/25 transition-all duration-150\">\n                Revisar Resumen Final\n              <\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n      )}\n\n      {step === 3 && (\n        <div key={step} data-dir={bzStepDir} className=\"bersz-form-step space-y-5\">\n          <h2 className=\"text-base font-bold text-white tracking-tight\">Revisión y Confirmación Final<\/h2>\n          <BerszReleaseOverview release={{ title: releaseTitle, mainArtists, collaborators, releaseDateMode, requestedReleaseDate, coverArt, tracks: tracksData }} />\n          <div className=\"bersz-summary-tracks\">{tracksData.map((t,i) => <article key={i} className=\"bersz-summary-track\" aria-label={`Resumen de ${t.version}`}><div className=\"bersz-track-heading\"><span>{t.version}<\/span><h3>{t.title}<\/h3><\/div><BerszMetadata track={t} /><\/article>)}<\/div>\n\n          <label data-checked={confirmedAuth} className=\"bz-confirm flex items-start gap-2.5 text-xs text-zinc-300 cursor-pointer\">\n            <input type=\"checkbox\" checked={confirmedAuth} onChange={e => setConfirmedAuth(e.target.checked)} className=\"mt-0.5 accent-[#7138F5]\" />\n            <span>Confirmo que tengo autorización para entregar esta música y que la información y los créditos proporcionados son correctos.<\/span>\n          <\/label>\n\n          <div className=\"flex justify-between pt-3\">\n            <button onClick={() => setStep(2)} className=\"bz-btn bz-btn-ghost px-4 py-2 rounded-xl bg-[#0A0A0D] border border-white/[0.08] hover:border-white/[0.16] text-xs text-zinc-300 transition-colors\">\n              Volver a editar pistas\n            <\/button>\n            <button onClick={() => finalizeSubmission(false)} className=\"bz-btn bz-btn-primary px-6 py-2.5 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] active:scale-[0.99] text-white text-xs font-bold shadow-lg shadow-[#7138F5]/25 transition-all duration-150\">\n              {existingRelease ? 'Reenviar proyecto corregido' : 'Enviar lanzamiento definitivo'}\n            <\/button>\n          <\/div>\n        <\/div>\n      )}\n    <\/div>\n  );\n}\n\nfunction TikTokPromoGalleryView({ promos, artists, isAdmin, onEdit, onDelete, confirmDeleteId, artistId, releases = [], requests = [], onSubmitRequest, onViewRequests, showRequestTools = !isAdmin, canViewAllPromos = false }) {\n  const [artistFilter, setArtistFilter] = useState('all');\n  const [searchSong, setSearchSong] = useState('');\n  const [showRequestModal, setShowRequestModal] = useState(false);\n  const [selectedReleaseId, setSelectedReleaseId] = useState('');\n  const [selectedTrackIndex, setSelectedTrackIndex] = useState('');\n  const ownedReleases = (releases || []).filter(release => release.artistId === artistId);\n  const selectedRelease = ownedReleases.find(release => release.id === selectedReleaseId);\n  const selectedTrack = selectedRelease && selectedTrackIndex !== '' ? selectedRelease.tracks?.[Number(selectedTrackIndex)] : null;\n\n  const visiblePromos = (promos || []).filter(item => canViewAllPromos || isAdmin || !item.isCampaignVideo || item.artistId === artistId);\n  const filtered = visiblePromos.filter(p => {\n    const matchArtist = artistFilter === 'all' || p.artistId === artistFilter;\n    const matchSong = p.songTitle?.toLowerCase().includes(searchSong.toLowerCase()) || p.creatorHandle?.toLowerCase().includes(searchSong.toLowerCase());\n    return matchArtist && matchSong;\n  });\n\n  const openRequestModal = () => { setSelectedReleaseId(''); setSelectedTrackIndex(''); setShowRequestModal(true); };\n\n  return (\n    <div className=\"space-y-6 animate-fade-in\">\n      {!isAdmin && (\n        <div className=\"pb-1\">\n          <h1 className=\"text-2xl sm:text-[26px] font-extrabold tracking-tight text-white\">Promoción en TikTok<\/h1>\n          <p className=\"text-xs sm:text-[13px] text-[#8E8E9E] mt-1\">Galería oficial de videos y campañas que impulsan el catálogo de Bersz Records en TikTok.<\/p>\n        <\/div>\n      )}\n\n      {showRequestTools && <section className=\"p-5 sm:p-6 rounded-2xl bg-gradient-to-r from-[#7138F5]/20 via-[#1E1E24] to-[#1E1E24] border border-[#7138F5]/35 flex flex-col sm:flex-row sm:items-center justify-between gap-4\">\n        <div className=\"max-w-2xl\"><p className=\"text-[10px] font-bold uppercase tracking-[.16em] text-[#B69AFF]\">Campañas del equipo de Bersz<\/p><h2 className=\"text-base sm:text-lg font-extrabold text-white mt-1\">¿QUIERES PROMOCIONAR TU MÚSICA?<\/h2><p className=\"text-xs text-[#D0CDD9] mt-2 leading-relaxed\">Envía tu lanzamiento a nuestro equipo y solicita una campaña promocional con cuentas de TikTok como @bonaizznt o @brazilian.funk. Revisaremos tu solicitud y te notificaremos nuestra decisión. La aprobación de una campaña no está garantizada.<\/p><\/div>\n        <div className=\"flex flex-col gap-2 shrink-0\"><button onClick={openRequestModal} className=\"px-5 py-3 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] text-white text-xs font-extrabold shadow-lg shadow-[#7138F5]/25\">SOLICITAR PROMOCIÓN<\/button>{onViewRequests && <button onClick={onViewRequests} className=\"text-[11px] font-semibold text-[#B69AFF] hover:text-white\">Ver mis solicitudes ({requests.length})<\/button>}<\/div>\n      <\/section>}\n\n      {showRequestTools && showRequestModal && <div className=\"fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4\"><form onSubmit={event => { event.preventDefault(); if (!selectedRelease || !selectedTrack) return; if (onSubmitRequest(selectedRelease.id, Number(selectedTrackIndex))) setShowRequestModal(false); }} className=\"w-full max-w-lg p-5 sm:p-6 rounded-2xl bg-[#1E1E24] border border-[#7138F5]/45 space-y-4 max-h-[90vh] overflow-y-auto\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"promo-request-title\"><div className=\"flex items-start justify-between gap-3\"><div><p className=\"text-[10px] font-bold uppercase tracking-wider text-[#B69AFF]\">Solicitud de campaña<\/p><h2 id=\"promo-request-title\" className=\"text-lg font-extrabold text-white mt-1\">Solicitar promoción<\/h2><\/div><button type=\"button\" onClick={() => setShowRequestModal(false)} aria-label=\"Cerrar\" className=\"p-1 text-zinc-400 hover:text-white\"><X className=\"w-5 h-5\" /><\/button><\/div>\n        {ownedReleases.length === 0 ? <div className=\"p-4 rounded-xl bg-[#0A0A0D] border border-white/[.07]\"><p className=\"text-xs font-bold text-white\">No tienes lanzamientos elegibles en el catálogo de esta cuenta.<\/p><p className=\"text-[11px] text-[#8E8E9E] mt-1\">Primero debes disponer de un lanzamiento asociado a tu perfil.<\/p><\/div> : <><label className=\"block text-[11px] font-semibold text-zinc-300\">Seleccionar lanzamiento<select required value={selectedReleaseId} onChange={event => { setSelectedReleaseId(event.target.value); setSelectedTrackIndex(''); }} className=\"mt-1.5 block w-full px-3 py-2.5 rounded-lg bg-[#0A0A0D] border border-white/10 text-xs text-white\"><option value=\"\">Selecciona un lanzamiento<\/option>{ownedReleases.map(release => <option key={release.id} value={release.id}>{release.title} · {release.mainArtist || 'Artista principal no registrado'}<\/option>)}<\/select><\/label>{selectedRelease && <div className=\"flex items-center gap-3 p-3 rounded-xl bg-[#0A0A0D]/70 border border-white/[.06]\">{(selectedRelease.coverArt?.dataUrl || selectedRelease.coverArt?.url) ? <img src={selectedRelease.coverArt.dataUrl || selectedRelease.coverArt.url} alt={`Portada de ${selectedRelease.title}`} className=\"w-12 h-12 rounded-lg object-cover\" /> : <div className=\"w-12 h-12 rounded-lg bg-[#7138F5]/20 flex items-center justify-center\"><Disc className=\"w-5 h-5 text-[#B69AFF]\" /><\/div>}<div><p className=\"text-xs font-bold text-white\">{selectedRelease.title}<\/p><p className=\"text-[10px] text-[#8E8E9E]\">{selectedRelease.mainArtist || 'Artista no registrado'} · {(selectedRelease.tracks || []).length} pista(s)/versión(es)<\/p><\/div><\/div>}\n          {selectedRelease && <label className=\"block text-[11px] font-semibold text-zinc-300\">Seleccionar pista o versión<select required value={selectedTrackIndex} onChange={event => setSelectedTrackIndex(event.target.value)} className=\"mt-1.5 block w-full px-3 py-2.5 rounded-lg bg-[#0A0A0D] border border-white/10 text-xs text-white\"><option value=\"\">Selecciona pista o versión<\/option>{(selectedRelease.tracks || []).map((track,index) => <option key={`${track.version || ''}-${index}`} value={index}>{track.title || selectedRelease.title} · {track.version || `Versión ${index + 1}`}<\/option>)}<\/select><\/label>}\n          {selectedTrack && <p className=\"p-3 rounded-lg bg-[#7138F5]/10 border border-[#7138F5]/20 text-[11px] text-[#D9CCFF]\">Selección: {selectedTrack.title || selectedRelease.title} · {selectedTrack.version || 'Versión sin nombre'}<\/p>}<\/>}\n        <p className=\"text-[10px] text-zinc-500\">La solicitud se guarda en esta demo local. El equipo revisará el material y podrá aceptar o rechazarla.<\/p><div className=\"flex justify-end gap-2\"><button type=\"button\" onClick={() => setShowRequestModal(false)} className=\"px-4 py-2.5 rounded-lg bg-[#0A0A0D] border border-white/10 text-xs\">Cancelar<\/button><button type=\"submit\" disabled={!selectedRelease || !selectedTrack} className=\"px-4 py-2.5 rounded-lg bg-[#7138F5] text-xs font-bold text-white disabled:opacity-40 disabled:cursor-not-allowed\">ENVIAR SOLICITUD<\/button><\/div>\n      <\/form><\/div>}\n\n      <div className=\"grid grid-cols-1 sm:grid-cols-2 gap-3\">\n        <input\n          type=\"text\"\n          value={searchSong}\n          onChange={e => setSearchSong(e.target.value)}\n          placeholder=\"Filtrar por canción o cuenta @creador...\"\n          className=\"px-3.5 py-2.5 rounded-xl bg-[#1E1E24] border border-white/[0.08] text-xs text-white\"\n        />\n        <select\n          value={artistFilter}\n          onChange={e => setArtistFilter(e.target.value)}\n          className=\"px-3.5 py-2.5 rounded-xl bg-[#1E1E24] border border-white/[0.08] text-xs text-white\"\n        >\n          <option value=\"all\">Todos los artistas del sello<\/option>\n          {(artists || []).map(a => <option key={a.id} value={a.id}>{a.artisticName}<\/option>)}\n        <\/select>\n      <\/div>\n\n      {filtered.length === 0 ? (\n        <div className=\"p-10 rounded-2xl bg-[#1E1E24]/90 border border-white/[0.07] text-center space-y-2.5\">\n          <Video className=\"w-9 h-9 text-[#B69AFF] mx-auto opacity-90\" />\n          <p className=\"text-sm font-bold text-white\">Todavía no hay videos promocionales publicados para este filtro<\/p>\n          <p className=\"text-xs text-[#8E8E9E]\">El equipo de Bersz Records añadirá nuevos enlaces de campañas aquí.<\/p>\n        <\/div>\n      ) : (\n        <div className=\"grid grid-cols-1 sm:grid-cols-2 gap-4\">\n          {filtered.map(item => (\n            <div key={item.id} className=\"group rounded-2xl bg-[#1E1E24]/90 border border-white/[0.07] hover:border-[#7138F5]/60 shadow-[0_8px_30px_rgba(0,0,0,0.28)] overflow-hidden transition-all duration-200 ease-out flex flex-col justify-between\">\n              <div>\n                <div className=\"relative h-40 bg-[#0A0A0D] overflow-hidden flex items-center justify-center\">\n                  {item.thumbnailUrl ? (\n                    <img src={item.thumbnailUrl} alt={item.songTitle} className=\"w-full h-full object-cover group-hover:scale-[1.02] transition-transform duration-200 ease-out\" />\n                  ) : (\n                    <div className=\"text-center text-[#8E8E9E]\"><Video className=\"w-8 h-8 mx-auto opacity-70\" /><p className=\"text-[10px] mt-2\">Vista previa no registrada<\/p><\/div>\n                  )}\n                  <div className=\"absolute top-2.5 left-2.5 flex gap-1.5\">\n                    {item.featured && <span className=\"px-2.5 py-0.5 rounded-md bg-[#7138F5] text-white text-[10px] font-bold shadow-sm\">Destacado<\/span>}\n                    <span className={`px-2.5 py-0.5 rounded-md bg-black/80 backdrop-blur-sm border text-[9px] font-bold ${item.classification === 'bersz-promo' ? 'border-[#7138F5]/60 text-[#D4C4FF]' : item.classification === 'viral-audio' ? 'border-sky-400/50 text-sky-200' : 'border-white/20 text-zinc-300'}`}>{item.classification === 'bersz-promo' ? 'PROMOCIÓN DE BERSZ' : item.classification === 'viral-audio' ? 'VIDEO VIRAL CON EL AUDIO' : 'CLASIFICACIÓN NO REGISTRADA'}<\/span>\n                    {item.isDemo && <span className=\"px-2 py-0.5 rounded-md bg-amber-500/20 border border-amber-400/30 text-amber-100 text-[9px] font-bold\">DEMO<\/span>}\n                  <\/div>\n                <\/div>\n                <div className=\"p-4 space-y-1\">\n                  <h3 className=\"text-sm font-bold text-white tracking-tight\">{item.songTitle}<\/h3>\n                  <p className=\"text-xs text-[#B69AFF] font-semibold\">{item.artistName || 'Artista no registrado'}<\/p>\n                  <p className=\"text-[11px] text-[#8E8E9E]\">Cuenta: {item.creatorHandle || 'No registrada'} · Fecha: {item.publishedDate || 'No registrada'}<\/p>\n                  {item.campaignTag && <p className=\"text-[10px] text-zinc-500\">{item.campaignTag}<\/p>}\n                <\/div>\n              <\/div>\n              <div className=\"p-4 pt-0 flex items-center justify-between gap-2\">\n                {item.tiktokUrl ? <a href={item.tiktokUrl} target=\"_blank\" rel=\"noopener noreferrer\" className=\"px-3.5 py-2 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] active:scale-[0.99] text-white text-xs font-bold flex items-center gap-1.5 shadow-md shadow-[#7138F5]/20 transition-all duration-150\"><span>Abrir video en TikTok<\/span><ExternalLink className=\"w-3.5 h-3.5\" /><\/a> : <span className=\"text-[10px] text-zinc-500\">Enlace no registrado<\/span>}\n                {isAdmin && onEdit && onDelete && !item.isCampaignVideo && (\n                  <div className=\"flex items-center gap-1.5\">\n                    <button onClick={() => onEdit(item)} className=\"p-2 rounded-lg bg-[#0A0A0D] border border-white/[0.07] text-white hover:bg-[#25252D] transition-colors\">\n                      <Edit3 className=\"w-3.5 h-3.5\" />\n                    <\/button>\n                    <button onClick={() => onDelete(item.id)} className=\"px-2.5 py-1.5 rounded-lg bg-[#0A0A0D] border border-white/[0.07] text-red-400 hover:bg-red-500/20 text-[10px] font-bold transition-colors\">\n                      {confirmDeleteId === item.id ? 'Confirmar' : <Trash2 className=\"w-3.5 h-3.5\" />}\n                    <\/button>\n                  <\/div>\n                )}\n              <\/div>\n            <\/div>\n          ))}\n        <\/div>\n      )}\n    <\/div>\n  );\n}\n\nfunction ArtistRoyaltiesView({ artist, royalties, advances, accessRequests = [], moneyRequests = [], onSubmitAccessRequest, onVerifyAccessEmail, onSubmitMoneyRequest, onReportAdvanceReceived }) {\n  const [subTab, setSubTab] = useState('regalias');\n\n  if (!artist.royaltiesEnabled && subTab !== 'adelantos') {\n    return (\n      <div className=\"max-w-xl mx-auto my-12 p-8 rounded-2xl bg-[#1E1E24]/90 border border-white/[0.07] shadow-[0_8px_30px_rgba(0,0,0,0.28)] text-center space-y-4 animate-fade-in\">\n        <div className=\"w-14 h-14 rounded-2xl bg-[#7138F5]/15 border border-[#7138F5]/35 flex items-center justify-center mx-auto text-[#B69AFF]\">\n          <Lock className=\"w-7 h-7\" />\n        <\/div>\n        <h2 className=\"text-lg font-extrabold text-white tracking-tight\">Sección de Regalías Bloqueada<\/h2>\n        <p className=\"text-xs text-[#8E8E9E] leading-relaxed\">\n          La sección de regalías todavía no está habilitada para tu cuenta. Bersz Records activará el acceso cuando corresponda.\n        <\/p>\n        <button onClick={() => setSubTab('adelantos')} className=\"px-4 py-2.5 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] text-white text-xs font-bold shadow-lg shadow-[#7138F5]/25 transition-all duration-150\">Ver Adelantos y solicitar acceso<\/button>\n      <\/div>\n    );\n  }\n\n  const totalPaid = royalties.filter(r => r.status === 'Pagado').reduce((acc, r) => acc + Number(r.amount || 0), 0);\n  const totalPending = royalties.filter(r => r.status !== 'Pagado').reduce((acc, r) => acc + Number(r.amount || 0), 0);\n\n  return (\n    <div className=\"space-y-6 animate-fade-in\">\n      <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-1\">\n        <div>\n          <h1 className=\"text-2xl sm:text-[26px] font-extrabold tracking-tight text-white\">Mis Regalías y Liquidaciones<\/h1>\n          <p className=\"text-xs sm:text-[13px] text-[#8E8E9E] mt-1\">Registro privado de pagos y estado de anticipos en Bersz Records.<\/p>\n        <\/div>\n        <div className=\"flex rounded-xl bg-[#1E1E24] p-1 border border-white/[0.08] self-start shadow-inner\">\n          <button onClick={() => setSubTab('regalias')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all duration-150 ${subTab === 'regalias' ? 'bg-[#7138F5] text-white shadow-md shadow-[#7138F5]/25' : 'text-[#8E8E9E] hover:text-white'}`}>\n            Historial de Regalías\n          <\/button>\n          <button onClick={() => setSubTab('adelantos')} className={`px-4 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all duration-150 ${subTab === 'adelantos' ? 'bg-[#7138F5] text-white shadow-md shadow-[#7138F5]/25' : 'text-[#8E8E9E] hover:text-white'}`}>\n            <span>Adelantos<\/span>\n            {!artist.advancesEnabled && <Lock className=\"w-3 h-3\" />}\n          <\/button>\n        <\/div>\n      <\/div>\n\n      {subTab === 'regalias' ? (\n        <div className=\"space-y-6\">\n          <div className=\"grid grid-cols-1 sm:grid-cols-2 gap-4\">\n            <MetricCard title=\"Total Regalías Pagadas\" value={formatCurrency(totalPaid, 'USD')} icon={CheckCircle2} />\n            <MetricCard title=\"Saldo Pendiente / En Proceso\" value={formatCurrency(totalPending, 'USD')} icon={Clock} />\n          <\/div>\n          <div className=\"space-y-3\">\n            {royalties.length === 0 ? (\n              <p className=\"text-xs text-[#8E8E9E]\">Aún no existen liquidaciones registradas en tu cuenta.<\/p>\n            ) : (\n              royalties.map(r => (\n                <div key={r.id} className=\"p-4 sm:p-5 rounded-2xl bg-[#1E1E24]/90 border border-white/[0.07] hover:border-white/[0.14] shadow-[0_8px_30px_rgba(0,0,0,0.28)] transition-colors duration-200 flex justify-between items-center gap-3\">\n                  <div>\n                    <span className=\"text-xs font-bold text-[#B69AFF]\">{r.period}<\/span>\n                    <p className=\"text-lg font-black text-white tabular-nums mt-0.5\">{formatCurrency(r.amount, r.currency)}<\/p>\n                    <p className=\"text-[11px] text-[#8E8E9E] mt-0.5\">Fecha: {r.date} • Ref: {r.reference || 'N/A'}<\/p>\n                  <\/div>\n                  <span className={`text-xs px-3 py-1 rounded-full font-bold border ${r.status === 'Pagado' ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30' : 'bg-amber-500/15 text-amber-300 border-amber-500/30'}`}>\n                    {r.status}\n                  <\/span>\n                <\/div>\n              ))\n            )}\n          <\/div>\n        <\/div>\n      ) : (\n        <ArtistAdvanceCenter artist={artist} advances={advances} accessRequests={accessRequests} moneyRequests={moneyRequests} onSubmitAccessRequest={onSubmitAccessRequest} onVerifyAccessEmail={onVerifyAccessEmail} onSubmitMoneyRequest={onSubmitMoneyRequest} onReportAdvanceReceived={onReportAdvanceReceived} />\n      )}\n    <\/div>\n  );\n}\n\nfunction AdvanceAccessForm({ onSubmit, onCancel }) {\n  const [legalName, setLegalName] = useState('');\n  const [country, setCountry] = useState('');\n  const [age, setAge] = useState('');\n  const [gmail, setGmail] = useState('');\n  const [docType, setDocType] = useState('Documento de identidad del país');\n  const [docFiles, setDocFiles] = useState({ front: '', back: '', full: '' });\n  const [paymentMethod, setPaymentMethod] = useState('');\n  const [reason, setReason] = useState('');\n  const [step, setStep] = useState(1);\n  const [error, setError] = useState('');\n\n  const countries = ['Argentina','Bolivia','Brasil','Canadá','Chile','Colombia','Costa Rica','Cuba','Ecuador','El Salvador','España','Estados Unidos','Francia','Guatemala','Honduras','Italia','México','Nicaragua','Panamá','Paraguay','Perú','Portugal','Puerto Rico','República Dominicana','Reino Unido','Uruguay','Venezuela','Otro'];\n  const requiredFiles = docType === 'Pasaporte' ? ['full'] : ['front', 'back'];\n  const validEmail = /^[^\\s@]+@gmail\\.com$/i.test(gmail.trim());\n  const valid = legalName.trim() && country && age === 'Sí' && validEmail && requiredFiles.every(k => docFiles[k]) && paymentMethod && reason.trim();\n  const setFile = (key, file) => setDocFiles(prev => ({ ...prev, [key]: file?.name || '' }));\n  const continueToReview = () => {\n    if (age === 'No') { setError('No puedes continuar porque los adelantos de regalías de Bersz Records son exclusivos para artistas mayores de 18 años'); return; }\n    if (!valid) { setError('Completa todos los campos obligatorios, selecciona los archivos de prueba requeridos y revisa el Gmail.'); return; }\n    setError(''); setStep(2);\n  };\n  const submit = () => {\n    if (!valid) { setStep(1); setError('Completa todos los campos obligatorios antes de enviar.'); return; }\n    const result = onSubmit({ legalName: legalName.trim(), country, isAdult: age === 'Sí', gmail: gmail.trim(), docType, documentFiles: { ...docFiles }, paymentMethod, reason: reason.trim(), documentStorage: 'Solo nombres de archivos de prueba; los archivos no se guardan.' });\n    if (result) onCancel();\n  };\n  const fileField = (key, label) => <div className=\"p-3.5 rounded-xl bg-[#0A0A0D]/90 border border-white/[0.08] space-y-2\"><label className=\"block text-xs font-bold text-white\">{label} *<\/label><input type=\"file\" accept=\"image/*\" required={!docFiles[key]} onChange={e => setFile(key, e.target.files?.[0])} className=\"block w-full text-xs text-zinc-300 file:mr-3 file:px-3.5 file:py-2 file:rounded-lg file:border-0 file:bg-[#7138F5] file:text-white file:font-semibold hover:file:bg-[#6229E8] file:cursor-pointer\"/><p className=\"text-[11px] text-zinc-400\">{docFiles[key] ? `Seleccionado: ${docFiles[key]}` : 'No se ha seleccionado archivo.'}<\/p><\/div>;\n  return <section className=\"w-full max-w-3xl mx-auto p-6 sm:p-7 rounded-2xl bg-[#1E1E24]/95 border border-[#7138F5]/40 shadow-[0_12px_36px_rgba(0,0,0,0.35)] space-y-5\"><div className=\"flex justify-between items-start gap-3\"><div><h2 className=\"text-xl font-extrabold text-white tracking-tight\">Solicitud de acceso a Adelantos<\/h2><p className=\"text-xs text-[#8E8E9E] mt-1\">Paso {step} de 2 • Usa solamente información e imágenes ficticias en esta prueba local.<\/p><\/div><button onClick={onCancel} className=\"shrink-0 px-3.5 py-2 rounded-xl bg-[#0A0A0D] border border-white/[0.08] hover:border-white/[0.16] text-xs text-zinc-300 transition-colors\">Volver a Adelantos<\/button><\/div>\n    {step === 1 ? <div className=\"space-y-4\"><div className=\"grid grid-cols-1 sm:grid-cols-2 gap-3.5\"><div><label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">Nombre legal completo *<\/label><input value={legalName} onChange={e=>setLegalName(e.target.value)} className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\" required/><\/div><div><label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">País de residencia actual *<\/label><select value={country} onChange={e=>setCountry(e.target.value)} className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\" required><option value=\"\">Selecciona tu país<\/option>{countries.map(c=><option key={c}>{c}<\/option>)}<\/select><\/div><\/div>\n      <fieldset className=\"p-3.5 rounded-xl bg-[#0A0A0D]/90 border border-white/[0.08]\"><legend className=\"px-1.5 text-xs font-bold text-zinc-200\"> />}<\/div>\n      <fieldset className=\"p-3.5 rounded-xl bg-[#0A0A0D]/90 border border-white/[0.08]\"><legend className=\"px-1.5 text-xs font-bold text-zinc-200\">Método de pago preferido *<\/legend><div className=\"space-y-2.5 mt-1\">{[['Transferencia internacional','Disponible según el país de residencia y las posibilidades de transferencia.'],['PayPal','Disponible como opción de pago para artistas de todos los países, sujeto a la disponibilidad del servicio y a sus restricciones aplicables.']].map(([v,desc])=><label key={v} className=\"flex items-start gap-2.5 text-xs cursor-pointer\"><input type=\"radio\" name=\"payment\" value={v} checked={paymentMethod===v} onChange={()=>setPaymentMethod(v)} required/><span><strong>{v}<\/strong><span className=\"block text-zinc-400 mt-0.5\">{desc}<\/span><\/span><\/label>)}<\/div><p className=\"text-[11px] text-amber-200/90 mt-2.5\">Bersz Records no cubre comisiones de transferencia ni impuestos u otros cargos que puedan aplicarse. No ingreses números bancarios, contraseñas ni datos financieros.<\/p><\/fieldset>\n      <div><label className=\"block text-xs font-bold text-zinc-200 mb-1.5\">¿Por qué quieres solicitar acceso a adelantos de regalías? *<\/label><textarea rows={3} value={reason} onChange={e=>setReason(e.target.value)} className=\"w-full px-3.5 py-2.5 rounded-xl bg-[#0A0A0D] border border-[#2D2D35] text-xs text-white\" required/><\/div>\n      {error&&<p className=\"text-xs text-red-300\">{error}<\/p>}<div className=\"flex justify-end gap-2.5\"><button onClick={onCancel} className=\"px-4 py-2 rounded-xl bg-[#0A0A0D] border border-white/[0.08] hover:bg-zinc-800 text-xs font-bold transition-colors\">Cancelar<\/button><button onClick={continueToReview} disabled={age==='No'} className=\"px-5 py-2 rounded-xl bg-[#7138F5] hover:bg-[#6229E8] text-white text-xs font-bold disabled:opacity-40 shadow-lg shadow-[#7138F5]/25 transition-all duration-150\">Revisar solicitud<\/button><\/div><\/div> : <div className=\"space-y-4\"><h3
